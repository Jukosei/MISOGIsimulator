<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>禊シミュレーター</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1a1a1a;
            --border-color: #333333;
            --btn-blue: #007bff;
            --btn-red: #dc3545;
            --btn-green: #28a745;
            --btn-accent: #e6002d;
            --text-color: #ffffff;
            --card-width: 120px;
            --card-height: 168px;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            /* touch-action: none; を削除してボタン操作や入力が効くように修正 */
        }
        
        /* メニュー画面 */
        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 700px;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        .title {
            font-size: 54px;
            font-weight: bold;
            margin-bottom: 35px;
            letter-spacing: 6px;
        }
        .mode-selection {
            display: flex;
            gap: 10px;
            margin-bottom: 35px;
        }
        .mode-btn {
            background-color: #242424;
            color: #8a8a8a;
            border: 1px solid #3a3a3a;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        .mode-btn.active {
            background-color: var(--btn-blue);
            color: #ffffff;
            border-color: var(--btn-blue);
        }
        .input-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }
        .deck-code-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center; /* 横幅いっぱいに揃える修正 */
        }
        .label-text {
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 160px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            padding: 15px;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
            outline: none;
        }
        .clear-btn {
            background-color: var(--btn-red);
            color: #ffffff;
            border: none;
            padding: 10px 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 12px;
            align-self: flex-start;
        }
        .start-btn {
            background-color: var(--btn-accent);
            color: #ffffff;
            border: none;
            padding: 15px 100px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 45px;
            letter-spacing: 2px;
        }

        /* ゲーム画面 */
        .game-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            background-color: #0d0d0d;
            box-sizing: border-box;
            padding: 10px;
            gap: 14px;
        }
        .left-panel {
            width: var(--card-width);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            box-sizing: border-box;
            padding-bottom: 15px;
        }
        .zone-box {
            background-color: var(--panel-bg);
            border: 2px dashed #444;
            border-radius: 6px;
            width: var(--card-width);
            height: var(--card-height);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            position: relative;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .zone-box .count-display {
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0px 0px 4px #000, 0px 0px 4px #000;
        }
        .zone-label {
            font-size: 10px;
            color: #8a8a8a;
            margin-top: 5px;
            text-align: center;
            text-shadow: 0px 0px 4px #000, 0px 0px 4px #000;
        }
        .zone-box.drag-over {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: #fff;
        }
        .temporary-btn-green {
            width: 100%;
            background-color: var(--btn-green);
            color: white;
            font-size: 12px;
            font-weight: bold;
            border: none;
            padding: 10px 0;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            margin: auto 0;
        }
        .center-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 12px;
            flex: 1;
        }
        .field-section-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .stage-box { flex: 6.4; margin-bottom: 20px; }
        .direction-box { flex: 2.8; }
        .field-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
        .row-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .slot-column-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            gap: 8px;
            height: 380px;
        }
        .stage-placeholder-stack {
            position: relative;
            width: var(--card-width);
            height: 336px;
            margin-top: -6px;
        }
        .frame-layer {
            position: absolute;
            width: var(--card-width);
            height: var(--card-height);
            border-radius: 6px;
            box-sizing: border-box;
            z-index: 5;
        }
        .frame-layer.layer-1 { top: 0px; border: 2px dashed #1565c0; }
        .frame-layer.layer-2 { top: 84px; border: 2px dashed #f9a825; }
        .frame-layer.layer-3 { top: 168px; border: 2px dashed #6a1b9a; }
        .frame-layer.drag-over { background-color: rgba(255, 255, 255, 0.08); }
        
        .direction-placeholder {
            width: var(--card-width);
            height: var(--card-height);
            border: 2px dashed #c62828;
            border-radius: 6px;
            box-sizing: border-box;
            position: relative;
        }
        .direction-placeholder.drag-over { background-color: rgba(198, 40, 40, 0.1); }
        .frame-layer .game-card, .direction-placeholder .game-card {
            position: absolute;
            top: 0;
            left: 0;
            margin: 0;
            width: 100%;
            height: 100%;
        }
        .slot-tag-btn {
            background-color: #222;
            color: #aaa;
            font-size: 11px;
            border: 1px solid #444;
            padding: 4px 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            z-index: 20;
        }
        .slot-tag-btn.selecting {
            background-color: var(--btn-accent);
            color: #fff;
            border-color: var(--btn-accent);
        }
        .hand-area {
            flex: 2.8;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-content: flex-start;
        }
        .game-card {
            width: var(--card-width);
            height: var(--card-height);
            background-color: #333;
            border: 1px solid #555;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: grab;
            box-sizing: border-box;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            text-shadow: 0px 0px 4px #000, 0px 0px 4px #000;
        }
        .game-card.dragging {
            opacity: 0.8 !important;
            position: fixed !important;
            z-index: 9999 !important;
            pointer-events: none !important;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            transform: scale(1.05);
        }
        .control-panel {
            width: 190px;
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 6px;
        }
        .control-btn {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
        }
        .control-btn.orange { background-color: #ff9f00; }
        .control-btn.gray { background-color: #444; }
        .deck-zone {
            margin-top: auto;
            border: 2px dashed #444;
            background-color: #222;
            border-radius: 6px;
            width: 100%;
            height: var(--card-height);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .deck-count { font-size: 32px; font-weight: bold; }
        .deck-label { font-size: 10px; color: #888; margin-top: 4px; }
        .counter-panel {
            width: 150px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            padding: 20px 5px;
            box-sizing: border-box;
            justify-content: flex-start;
            gap: 22px;
            height: 100%;
        }
        .counter-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .counter-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }
        .icon-vol { background-color: #ffd700; color: #000; }
        .icon-alpha { background-color: #ff69b4; }
        .icon-beta { background-color: #1e90ff; }
        .icon-omega { background-color: #9400d3; }
        .counter-controls { display: flex; align-items: center; gap: 12px; }
        .counter-btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .counter-value { font-size: 28px; font-weight: bold; width: 35px; text-align: center; }
        .turn-display {
            margin-top: auto;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            font-size: 13px;
            color: #aaa;
        }
        .turn-display span { display: block; font-size: 32px; font-weight: bold; color: #fff; margin-top: 5px; }

        /* サーチ用オーバーレイ */
        .search-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            justify-content: center;
            align-items: flex-start;
            padding-top: 25px;
            box-sizing: border-box;
        }
        .search-overlay.dragging-mode { background-color: rgba(0, 0, 0, 0.2); }
        .search-overlay.dragging-mode .search-modal { opacity: 0.3; }
        .search-modal {
            background-color: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            width: 85%;
            max-width: 900px;
            height: 62%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            pointer-events: auto;
        }
        .search-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .search-modal-title { font-size: 20px; font-weight: bold; color: #fff; }
        .search-modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 28px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-modal-close:hover { color: #fff; }
        .search-card-grid {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-content: flex-start;
            padding: 5px;
        }
        .search-modal .game-card { cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .search-modal .game-card:hover { transform: scale(1.03); border-color: #fff; }

        /* 汎用アクションメニューモーダル */
        .action-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.6);
            z-index: 20000;
            justify-content: center;
            align-items: center;
        }
        .action-box {
            background-color: #1e1e1e;
            border: 2px solid #555;
            border-radius: 8px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            max-width: 320px;
            width: 80%;
        }
        .action-title {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            text-align: center;
            margin-bottom: 6px;
            word-break: break-all;
        }
        .action-btn {
            width: 100%;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }
        .action-btn:hover { background-color: var(--btn-blue); border-color: var(--btn-blue); }
        .action-btn.cancel { background-color: #444; margin-top: 6px; }
        .action-btn.cancel:hover { background-color: var(--btn-red); border-color: var(--btn-red); }
    </style>
</head>
<body>

    <!-- メニュー画面 -->
    <div class="menu-container" id="menuScreen">
        <div class="title">禊</div>
        
        <div class="mode-selection">
            <button class="mode-btn" id="btn1Deck" onclick="selectMode(1)">1デッキモード</button>
            <button class="mode-btn active" id="btn2Deck" onclick="selectMode(2)">2デッキ対戦モード</button>
        </div>

        <div class="input-section">
            <div class="deck-code-area" id="areaPlayer1">
                <div class="label-text">プレイヤー1のデッキ</div>
                <textarea id="deckInput1" oninput="saveData()"></textarea>
                <button class="clear-btn" onclick="clearInput(1)">クリア</button>
            </div>

            <div class="deck-code-area" id="areaPlayer2">
                <div class="label-text">プレイヤー2のデッキ</div>
                <textarea id="deckInput2" oninput="saveData()"></textarea>
                <button class="clear-btn" onclick="clearInput(2)">クリア</button>
            </div>
        </div>

        <button class="start-btn" onclick="startGame()">ゲーム開始</button>
    </div>

    <!-- ゲーム画面 -->
    <div class="game-screen" id="gameScreen">
        <!-- 左パネル -->
        <div class="left-panel">
            <div class="zone-box" id="trashZone" onclick="openSearchModal('trash')" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToTrash(event)" draggable="true">
                <div class="count-display" id="trashCount">0</div>
                <div class="zone-label">トラッシュ</div>
            </div>
            <button class="temporary-btn-green">一時保存場所</button>
            <div class="zone-box" id="volNoiseZone" onclick="openSearchModal('noise')" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToVolNoise(event)">
                <div class="count-display" id="volNoiseCount">0</div>
                <div class="zone-label">VOLノイズ</div>
            </div>
        </div>

        <!-- 中央パネル -->
        <div class="center-panel">
            <div class="field-section-box stage-box">
                <div class="row-label">ステージエリア</div>
                <div class="field-row">
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-1" onclick="clickChangeBtn(1)">入れ替え 1</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1" id="frame-1-1" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,1,1)"></div>
                            <div class="frame-layer layer-2" id="frame-1-2" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,1,2)"></div>
                            <div class="frame-layer layer-3" id="frame-1-3" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,1,3)"></div>
                        </div>
                    </div>
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-2" onclick="clickChangeBtn(2)">入れ替え 2</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1" id="frame-2-1" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,2,1)"></div>
                            <div class="frame-layer layer-2" id="frame-2-2" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,2,2)"></div>
                            <div class="frame-layer layer-3" id="frame-2-3" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,2,3)"></div>
                        </div>
                    </div>
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-3" onclick="clickChangeBtn(3)">入れ替え 3</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1" id="frame-3-1" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,3,1)"></div>
                            <div class="frame-layer layer-2" id="frame-3-2" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,3,2)"></div>
                            <div class="frame-layer layer-3" id="frame-3-3" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,3,3)"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="field-section-box direction-box">
                <div class="row-label">ディレクションエリア</div>
                <div class="field-row">
                    <div class="direction-placeholder" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToDirection(event,1)"></div>
                    <div class="direction-placeholder" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToDirection(event,2)"></div>
                    <div class="direction-placeholder" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToDirection(event,3)"></div>
                </div>
            </div>

            <div class="hand-area" id="handArea" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToHand(event)"></div>
        </div>

        <!-- 操作パネル -->
        <div class="control-panel">
            <button class="control-btn" onclick="drawCard()">ドロー</button>
            <button class="control-btn" onclick="openSearchModal('deck')">山札サーチ</button>
            <button class="control-btn orange" onclick="shuffleDeckBtn()">シャッフル</button>
            <button class="control-btn orange" onclick="mulliganBtn()">引き直し</button>
            <button class="control-btn orange" onclick="trashAllHandBtn()">手札を全破棄</button>
            <button class="control-btn gray" onclick="rollDice()">ダイス</button>
            <button class="control-btn gray" onclick="resetGameBtn()">ゲームリセット</button>
            <button class="control-btn gray" onclick="backToMenu()">メニューに戻る</button>

            <div class="deck-zone" onclick="drawCard()" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToDeckZone(event)">
                <div class="deck-count" id="deckCount">0</div>
                <div class="deck-label">山札 (クリックで引く)</div>
            </div>
        </div>

        <!-- カウンターパネル -->
        <div class="counter-panel">
            <div class="counter-item">
                <div class="counter-icon icon-vol">VOL</div>
                <div class="counter-controls">
                    <button class="counter-btn" onclick="changeCounter('vol', -1)">-</button>
                    <div class="counter-value" id="val-vol">0</div>
                    <button class="counter-btn" onclick="changeCounter('vol', 1)">+</button>
                </div>
            </div>
            <div class="counter-item">
                <div class="counter-icon icon-alpha">α</div>
                <div class="counter-controls">
                    <button class="counter-btn" onclick="changeCounter('alpha', -1)">-</button>
                    <div class="counter-value" id="val-alpha">0</div>
                    <button class="counter-btn" onclick="changeCounter('alpha', 1)">+</button>
                </div>
            </div>
            <div class="counter-item">
                <div class="counter-icon icon-beta">β</div>
                <div class="counter-controls">
                    <button class="counter-btn" onclick="changeCounter('beta', -1)">-</button>
                    <div class="counter-value" id="val-beta">0</div>
                    <button class="counter-btn" onclick="changeCounter('beta', 1)">+</button>
                </div>
            </div>
            <div class="counter-item">
                <div class="counter-icon icon-omega">Ω</div>
                <div class="counter-controls">
                    <button class="counter-btn" onclick="changeCounter('omega', -1)">-</button>
                    <div class="counter-value" id="val-omega">0</div>
                    <button class="counter-btn" onclick="changeCounter('omega', 1)">+</button>
                </div>
            </div>
            <div class="turn-display">
                TURN
                <span id="turnCount">1</span>
                <button class="control-btn" style="margin-top:10px; width:100%;" onclick="nextTurn()">次ターン</button>
            </div>
        </div>
    </div>

    <!-- サーチ・トラッシュ用モーダル -->
    <div class="search-overlay" id="searchOverlay" onclick="handleOverlayClick(event)" ondragover="allowDrop(event)" ondrop="dropReturnToSearch(event)">
        <div class="search-modal">
            <div class="search-modal-header">
                <div class="search-modal-title" id="searchModalTitle">山札からサーチ</div>
                <button class="search-modal-close" onclick="closeSearchModal()">×</button>
            </div>
            <div class="search-card-grid" id="searchCardGrid"></div>
        </div>
    </div>

    <!-- 汎用選択アクションモーダル -->
    <div class="action-overlay" id="actionOverlay">
        <div class="action-box">
            <div class="action-title" id="actionTitle">選択してください</div>
            <div id="actionButtons" style="width:100%; display:flex; flex-direction:column; gap:10px;"></div>
            <button class="action-btn cancel" onclick="closeActionMenu()">キャンセル</button>
        </div>
    </div>

    <script>
        let currentMode = 2;
        let masterDeck = [];
        let virtualDeck = [];
        let trashCards = [];
        let volNoiseCards = [];
        let counters = { vol: 0, alpha: 0, beta: 0, omega: 0 };
        let turn = 1;
        let cardIdCounter = 0;
        let currentSearchType = 'deck';
        let selectedColumnIndex = null;
        let dragTarget = null;
        let startX = 0, startY = 0;
        let isSearchOpen = false;

        let pendingActionData = null;
        let currentActionCallback = null;

        function openActionMenu(titleText, options, callback) {
            document.getElementById('actionTitle').innerText = titleText;
            let container = document.getElementById('actionButtons');
            container.innerHTML = "";
            currentActionCallback = callback;

            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.innerText = opt.label;
                btn.onclick = function() {
                    if (currentActionCallback) currentActionCallback(opt.value);
                };
                container.appendChild(btn);
            });
            document.getElementById('actionOverlay').style.display = 'flex';
        }

        function closeActionMenu() {
            document.getElementById('actionOverlay').style.display = 'none';
            pendingActionData = null;
            currentActionCallback = null;
        }

        function handleDeckReturnChoice(value) {
            if (!pendingActionData) return;
            let letters = pendingActionData.name.toUpperCase(), suff = letters.slice(-1);
            if (value === "top") {
                virtualDeck.unshift({ name: pendingActionData.name, suffix: suff, imagePath: pendingActionData.imagePath });
            } else if (value === "bottom") {
                virtualDeck.push({ name: pendingActionData.name, suffix: suff, imagePath: pendingActionData.imagePath });
            }
            document.getElementById('deckCount').innerText = virtualDeck.length;
            if (pendingActionData.fromHand && pendingActionData.elementId) {
                let el = document.getElementById(pendingActionData.elementId);
                if (el) el.remove();
            }
            closeActionMenu();
        }

        window.onload = function() {
            let savedMode = localStorage.getItem('misogi_mode');
            if (savedMode) selectMode(parseInt(savedMode));
            let savedDeck1 = localStorage.getItem('misogi_deck1');
            if (savedDeck1) document.getElementById('deckInput1').value = savedDeck1;
            let savedDeck2 = localStorage.getItem('misogi_deck2');
            if (savedDeck2) document.getElementById('deckInput2').value = savedDeck2;
            initTouchEvents();
        };

        function selectMode(type) {
            currentMode = type;
            let areaP2 = document.getElementById('areaPlayer2');
            if (type === 1) {
                document.getElementById('btn1Deck').classList.add('active');
                document.getElementById('btn2Deck').classList.remove('active');
                document.getElementById('areaPlayer1').querySelector('.label-text').innerText = 'デッキリストを入力してください';
                areaP2.style.display = 'none';
            } else {
                document.getElementById('btn1Deck').classList.remove('active');
                document.getElementById('btn2Deck').classList.add('active');
                document.getElementById('areaPlayer1').querySelector('.label-text').innerText = 'プレイヤー1のデッキ';
                areaP2.style.display = 'flex';
            }
            saveData();
        }

        function saveData() {
            localStorage.setItem('misogi_mode', currentMode);
            localStorage.setItem('misogi_deck1', document.getElementById('deckInput1').value);
            localStorage.setItem('misogi_deck2', document.getElementById('deckInput2').value);
        }

        function clearInput(num) {
            document.getElementById(`deckInput${num}`).value = '';
            saveData();
        }

        function startGame() {
            let rawText1 = document.getElementById('deckInput1').value.trim();
            if (!rawText1) return alert('デッキコードを入力してください。');

            masterDeck = parseDeckCode(rawText1);
            if (masterDeck.length === 0) return alert('有効なカードが見つかりませんでした。入力内容を確認してください。');

            virtualDeck = [...masterDeck];
            for (let i = virtualDeck.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [virtualDeck[i], virtualDeck[j]] = [virtualDeck[j], virtualDeck[i]];
            }

            trashCards = [];
            volNoiseCards = [];
            updateTrashUI();
            document.getElementById('volNoiseCount').innerText = 0;

            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            document.getElementById('deckCount').innerText = virtualDeck.length;

            document.getElementById('handArea').innerHTML = '';
            for (let i = 1; i <= 3; i++) {
                for (let j = 1; j <= 3; j++) document.getElementById(`frame-${i}-${j}`).innerHTML = '';
            }
            document.querySelectorAll('.direction-placeholder').forEach(el => el.innerHTML = '');

            turn = 1;
            document.getElementById('turnCount').innerText = turn;
            counters = { vol: 0, alpha: 0, beta: 0, omega: 0 };
            for (let key in counters) document.getElementById(`val-${key}`).innerText = 0;

            let drawNum = Math.min(5, virtualDeck.length);
            for (let i = 0; i < drawNum; i++) {
                let cardObj = virtualDeck.shift();
                createGameCardToHand(cardObj.name, cardObj.imagePath);
            }
            document.getElementById('deckCount').innerText = virtualDeck.length;
        }

        function parseDeckCode(code) {
            let deck = [];
            let clean = code.replace(/^!deck\s*/i, '');
            let parts = clean.split('/');
            parts.forEach(p => {
                let trimP = p.trim();
                if (trimP) {
                    let match = trimP.match(/^(.*?)([A-Za-z])$/);
                    let cardName = trimP;
                    let suffix = "A";
                    if (match) {
                        cardName = match[1].trim();
                        suffix = match[2].toUpperCase();
                    }
                    let imgPath = `images/${cardName}${suffix}.png`;
                    deck.push({ name: cardName + suffix, suffix: suffix, imagePath: imgPath });
                }
            });
            return deck;
        }

        function createGameCardToHand(cardName, imagePath) {
            let hand = document.getElementById('handArea');
            let card = document.createElement('div');
            card.className = 'game-card';
            card.innerText = cardName;
            card.style.backgroundImage = `url('${imagePath}')`;
            card.setAttribute('draggable', 'true');
            card.setAttribute('data-cardname', cardName);
            card.setAttribute('data-imagepath', imagePath);
            card.id = `card-id-${cardIdCounter++}`;
            card.ondragstart = function(ev) { ev.dataTransfer.setData('text/plain', card.id); };
            hand.appendChild(card);
        }

        function updateTrashUI() {
            let el = document.getElementById('trashZone');
            let countEl = document.getElementById('trashCount');
            countEl.innerText = trashCards.length;
            if (trashCards.length > 0) {
                let topCard = trashCards[trashCards.length - 1];
                el.style.backgroundImage = `url('${topCard.imagePath}')`;
            } else {
                el.style.backgroundImage = 'none';
            }
        }

        function allowDrop(ev) { ev.preventDefault(); ev.currentTarget.classList.add('drag-over'); }
        function dragLeave(ev) { ev.currentTarget.classList.remove('drag-over'); }

        function dropToSpecificFrame(ev, colIndex, layerNum) {
            ev.preventDefault(); ev.currentTarget.classList.remove('drag-over');
            let dataText = ev.dataTransfer.getData('text/plain');
            if (dataText === 'search-drag') {
                let idx = parseInt(ev.dataTransfer.getData('search-index'));
                let targetList = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);
                let cardObj = targetList.splice(idx, 1)[0];
                createGameCardToHand(cardObj.name, cardObj.imagePath);
                let genCard = document.getElementById(`card-id-${cardIdCounter-1}`);
                if (genCard) executeCardPlacement(genCard, ev.currentTarget, layerNum);
                document.getElementById('deckCount').innerText = virtualDeck.length;
                document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                updateTrashUI(); renderSearchList(); return;
            }
            if (dataText === 'trash-zone-drag' && trashCards.length > 0) {
                let cardObj = trashCards.pop();
                createGameCardToHand(cardObj.name, cardObj.imagePath);
                let genCard = document.getElementById(`card-id-${cardIdCounter-1}`);
                if (genCard) executeCardPlacement(genCard, ev.currentTarget, layerNum);
                updateTrashUI(); return;
            }
            if (dataText) {
                let r = document.getElementById(dataText);
                if (r) executeCardPlacement(r, ev.currentTarget, layerNum);
            }
        }

        function executeCardPlacement(targetCard, frameEl, layerNum) {
            let childCount = frameEl.children.length;
            if (layerNum === 3) {
                if (childCount < 2) frameEl.appendChild(targetCard);
                else alert('紫色の枠にはこれ以上重ねられません！');
            } else {
                if (childCount === 0) frameEl.appendChild(targetCard);
                else alert('この枠には既にカードがあります！');
            }
        }

        function dropToDirection(ev, slotIdx) {
            ev.preventDefault(); ev.currentTarget.classList.remove('drag-over');
            let dataText = ev.dataTransfer.getData('text/plain');
            if (dataText === 'search-drag') {
                let idx = parseInt(ev.dataTransfer.getData('search-index'));
                let targetList = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);
                if (ev.currentTarget.children.length === 0) {
                    let cardObj = targetList.splice(idx, 1)[0];
                    createGameCardToHand(cardObj.name, cardObj.imagePath);
                    let genCard = document.getElementById(`card-id-${cardIdCounter-1}`);
                    if (genCard) ev.currentTarget.appendChild(genCard);
                    document.getElementById('deckCount').innerText = virtualDeck.length;
                    document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                    updateTrashUI(); renderSearchList();
                }
                return;
            }
            if (dataText === 'trash-zone-drag' && trashCards.length > 0) {
                if (ev.currentTarget.children.length === 0) {
                    let cardObj = trashCards.pop();
                    createGameCardToHand(cardObj.name, cardObj.imagePath);
                    let genCard = document.getElementById(`card-id-${cardIdCounter-1}`);
                    if (genCard) ev.currentTarget.appendChild(genCard);
                    updateTrashUI();
                }
                return;
            }
            if (dataText) {
                let card = document.getElementById(dataText);
                if (card && ev.currentTarget.children.length === 0) ev.currentTarget.appendChild(card);
            }
        }

        function dropToHand(ev) {
            ev.preventDefault(); ev.currentTarget.classList.remove('drag-over');
            let dataText = ev.dataTransfer.getData('text/plain');
            if (dataText === 'search-drag') {
                let idx = parseInt(ev.dataTransfer.getData('search-index'));
                let targetList = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);
                let cardObj = targetList.splice(idx, 1)[0];
                createGameCardToHand(cardObj.name, cardObj.imagePath);
                document.getElementById('deckCount').innerText = virtualDeck.length;
                document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                updateTrashUI(); renderSearchList();
            } else if (dataText === 'trash-zone-drag' && trashCards.length > 0) {
                let cardObj = trashCards.pop();
                createGameCardToHand(cardObj.name, cardObj.imagePath);
                updateTrashUI();
            } else if (dataText) {
                let card = document.getElementById(dataText);
                if (card) document.getElementById('handArea').appendChild(card);
            }
        }

        function dropToTrash(ev) {
            ev.preventDefault(); ev.currentTarget.classList.remove('drag-over');
            let dataText = ev.dataTransfer.getData('text/plain');
            if (dataText === 'search-drag') {
                let idx = parseInt(ev.dataTransfer.getData('search-index'));
                let targetList = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);
                let cardObj = targetList.splice(idx, 1)[0];
                trashCards.push({ name: cardObj.name, imagePath: cardObj.imagePath });
                document.getElementById('deckCount').innerText = virtualDeck.length;
                document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                updateTrashUI(); renderSearchList();
            } else if (dataText && dataText !== 'trash-zone-drag') {
                let card = document.getElementById(dataText);
                if (card) {
                    trashCards.push({ name: card.getAttribute('data-cardname'), imagePath: card.getAttribute('data-imagepath') });
                    updateTrashUI();
                    card.remove();
                }
            }
        }

        function dropToVolNoise(ev) {
            ev.preventDefault(); ev.currentTarget.classList.remove('drag-over');
            let dataText = ev.dataTransfer.getData('text/plain');
            if (dataText === 'trash-zone-drag' && trashCards.length > 0) {
                let cardObj = trashCards.pop();
                volNoiseCards.push({ name: cardObj.name, imagePath: cardObj.imagePath });
                document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                updateTrashUI(); return;
            }
            if (dataText) {
                let card = document.getElementById(dataText);
                if (card) {
                    volNoiseCards.push({ name: card.getAttribute('data-cardname'), imagePath: card.getAttribute('data-imagepath') });
                    document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                    card.remove();
                }
            }
        }

        function dropToDeckZone(ev) {
            ev.preventDefault(); ev.currentTarget.classList.remove('drag-over');
            let dataText = ev.dataTransfer.getData('text/plain');
            if (dataText === 'trash-zone-drag' && trashCards.length > 0) {
                let cardObj = trashCards.pop();
                pendingActionData = { name: cardObj.name, imagePath: cardObj.imagePath, elementId: null, fromHand: false };
                updateTrashUI();
                openActionMenu(`カード「${cardObj.name}」の戻し先`, [
                    { label: "山札の一番上に戻す", value: "top" },
                    { label: "山札の一番下に戻す", value: "bottom" }
                ], handleDeckReturnChoice);
                return;
            }
            if (dataText && dataText !== 'search-drag') {
                let card = document.getElementById(dataText);
                if (card) {
                    let cName = card.getAttribute('data-cardname'), imgP = card.getAttribute('data-imagepath');
                    pendingActionData = { name: cName, imagePath: imgP, elementId: card.id, fromHand: true };
                    openActionMenu(`カード「${cName}」の戻し先`, [
                        { label: "山札の一番上に戻す", value: "top" },
                        { label: "山札の一番下に戻す", value: "bottom" }
                    ], handleDeckReturnChoice);
                }
            }
        }

        function drawCard() {
            if (virtualDeck.length > 0) {
                let cardObj = virtualDeck.shift();
                document.getElementById('deckCount').innerText = virtualDeck.length;
                createGameCardToHand(cardObj.name, cardObj.imagePath);
            } else alert('山札がなくなりました！');
        }

        function shuffleDeckBtn() {
            if (virtualDeck.length === 0) return alert('山札が空のためシャッフルできません。');
            for (let i = virtualDeck.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [virtualDeck[i], virtualDeck[j]] = [virtualDeck[j], virtualDeck[i]];
            }
            alert('山札をシャッフルしました！');
        }

        function trashAllHandBtn() {
            let hand = document.getElementById('handArea');
            if (hand.children.length === 0) return alert('手札がありません。');
            Array.from(hand.children).forEach(card => {
                trashCards.push({ name: card.getAttribute('data-cardname'), imagePath: card.getAttribute('data-imagepath') });
                card.remove();
            });
            updateTrashUI();
        }

        function mulliganBtn() {
            let hand = document.getElementById('handArea');
            let count = hand.children.length;
            Array.from(hand.children).forEach(card => {
                trashCards.push({ name: card.getAttribute('data-cardname'), imagePath: card.getAttribute('data-imagepath') });
                card.remove();
            });
            updateTrashUI();
            for (let i = virtualDeck.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [virtualDeck[i], virtualDeck[j]] = [virtualDeck[j], virtualDeck[i]];
            }
            let drawNum = Math.min(count, virtualDeck.length);
            for (let i = 0; i < drawNum; i++) {
                let cardObj = virtualDeck.shift();
                createGameCardToHand(cardObj.name, cardObj.imagePath);
            }
            document.getElementById('deckCount').innerText = virtualDeck.length;
            alert(`手札を引き直しました！（${drawNum}枚ドロー）`);
        }

        function resetGameBtn() {
            if (confirm('ゲーム状態を完全にリセットして山札を再構築しますか？')) startGame();
        }

        function openSearchModal(type) {
            currentSearchType = type;
            isSearchOpen = true;
            renderSearchList();
            document.getElementById('searchOverlay').style.display = 'flex';
        }

        function renderSearchList() {
            let titleEl = document.getElementById('searchModalTitle');
            let gridEl = document.getElementById('searchCardGrid');
            gridEl.innerHTML = "";
            let targetList = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);

            titleEl.innerText = (currentSearchType === 'deck') ? `山札からサーチ (残り: ${virtualDeck.length}枚)` :
                                (currentSearchType === 'noise' ? `VOLノイズからサーチ (現在: ${volNoiseCards.length}枚)` : `トラッシュ確認 (現在: ${trashCards.length}枚)`);

            if (targetList.length === 0) {
                gridEl.innerHTML = "<div style='color:#666; font-size:14px; padding:20px;'>カードがありません</div>";
                return;
            }

            targetList.forEach((cardData, idx) => {
                let card = document.createElement('div');
                card.className = 'game-card';
                card.innerText = cardData.name;
                card.style.backgroundImage = `url('${cardData.imagePath}')`;
                card.setAttribute('draggable', 'true');
                card.ondragstart = function(ev) {
                    ev.dataTransfer.setData('text/plain', 'search-drag');
                    ev.dataTransfer.setData('search-index', idx);
                    document.getElementById('searchOverlay').classList.add('dragging-mode');
                };
                card.ondragend = function() {
                    document.getElementById('searchOverlay').classList.remove('dragging-mode');
                };
                card.onclick = function(ev) {
                    ev.stopPropagation();
                    if (currentSearchType === 'trash') {
                        pendingActionData = { name: cardData.name, imagePath: cardData.imagePath, index: idx, list: targetList };
                        openActionMenu(`トラッシュ：${cardData.name}`, [
                            { label: "手札に加える", value: "hand" },
                            { label: "山札の一番上に戻す", value: "top" },
                            { label: "山札の一番下に戻す", value: "bottom" }
                        ], handleTrashChoice);
                    } else {
                        let cut = targetList.splice(idx, 1)[0];
                        createGameCardToHand(cut.name, cut.imagePath);
                        document.getElementById('deckCount').innerText = virtualDeck.length;
                        document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                        updateTrashUI(); renderSearchList();
                    }
                };
                gridEl.appendChild(card);
            });
        }

        function handleTrashChoice(value) {
            if (!pendingActionData) return;
            let idx = pendingActionData.index;
            let list = pendingActionData.list;
            let cut = list.splice(idx, 1)[0];
            let letters = cut.name.toUpperCase(), suff = letters.slice(-1);

            if (value === "hand") {
                createGameCardToHand(cut.name, cut.imagePath);
            } else if (value === "top") {
                virtualDeck.unshift({ name: cut.name, suffix: suff, imagePath: cut.imagePath });
            } else if (value === "bottom") {
                virtualDeck.push({ name: cut.name, suffix: suff, imagePath: cut.imagePath });
            }
            document.getElementById('deckCount').innerText = virtualDeck.length;
            document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
            updateTrashUI();
            closeActionMenu();
            renderSearchList();
        }

        function handleOverlayClick(ev) {
            if (ev.target.id === "searchOverlay" || ev.target.id === "searchCardGrid") closeSearchModal();
        }

        function closeSearchModal() {
            let list = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);
            if (list.length > 0 && currentSearchType !== 'trash') {
                for (let i = list.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [list[i], list[j]] = [list[j], list[i]];
                }
                if (currentSearchType === 'deck') alert('サーチを終了したため、山札を自動シャッフルしました。');
                else alert('サーチを終了したため、VOLノイズエリアを自動シャッフルしました。');
            }
            isSearchOpen = false;
            document.getElementById('searchOverlay').style.display = 'none';
        }

        function dropReturnToSearch(ev) {
            ev.preventDefault();
            document.getElementById('searchOverlay').classList.remove('dragging-mode');
            let dataText = ev.dataTransfer.getData('text/plain');
            if (dataText && dataText !== 'search-drag') {
                let card = document.getElementById(dataText);
                if (card) returnCardFromHand(card);
            }
        }

        function returnCardFromHand(card) {
            let cName = card.getAttribute('data-cardname'), imgP = card.getAttribute('data-imagepath');
            let letters = cName.toUpperCase(), suff = letters.slice(-1);
            if (currentSearchType === 'deck') {
                virtualDeck.push({ name: cName, suffix: suff, imagePath: imgP });
                document.getElementById('deckCount').innerText = virtualDeck.length;
            } else if (currentSearchType === 'noise') {
                volNoiseCards.push({ name: cName, imagePath: imgP });
                document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
            } else {
                trashCards.push({ name: cName, imagePath: imgP });
                updateTrashUI();
            }
            card.remove();
            renderSearchList();
        }

        function clickChangeBtn(colIndex) {
            let btn = document.getElementById(`change-btn-${colIndex}`);
            if (selectedColumnIndex === null) {
                selectedColumnIndex = colIndex;
                btn.classList.add('selecting');
            } else if (selectedColumnIndex === colIndex) {
                btn.classList.remove('selecting');
                selectedColumnIndex = null;
            } else {
                for (let layer = 1; layer <= 3; layer++) {
                    let f1 = document.getElementById(`frame-${selectedColumnIndex}-${layer}`);
                    let f2 = document.getElementById(`frame-${colIndex}-${layer}`);
                    let c1 = Array.from(f1.children), c2 = Array.from(f2.children);
                    f1.innerHTML = ""; f2.innerHTML = "";
                    c1.forEach(el => f2.appendChild(el));
                    c2.forEach(el => f1.appendChild(el));
                }
                document.getElementById(`change-btn-${selectedColumnIndex}`).classList.remove('selecting');
                selectedColumnIndex = null;
            }
        }

        function backToMenu() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('menuScreen').style.display = 'flex';
        }

        function changeCounter(key, val) {
            counters[key] = Math.max(0, counters[key] + val);
            document.getElementById(`val-${key}`).innerText = counters[key];
        }

        function nextTurn() {
            turn++;
            document.getElementById('turnCount').innerText = turn;
        }

        function rollDice() {
            alert(`ダイスの出目: ${Math.floor(Math.random() * 6) + 1}`);
        }

        function initTouchEvents() {
            let trashZone = document.getElementById('trashZone');
            trashZone.addEventListener('touchstart', function(ev) {
                if (trashCards.length === 0) return;
                ev.preventDefault();
                dragTarget = document.createElement('div');
                dragTarget.className = 'game-card dragging';
                let topCard = trashCards[trashCards.length - 1];
                dragTarget.innerText = topCard.name;
                dragTarget.style.backgroundImage = `url('${topCard.imagePath}')`;
                dragTarget.setAttribute('data-from-trash-zone', 'true');
                document.body.appendChild(dragTarget);

                let touch = ev.touches[0];
                startX = touch.clientX - 60;
                startY = touch.clientY - 84;
                dragTarget.style.left = touch.clientX - startX + 'px';
                dragTarget.style.top = touch.clientY - startY + 'px';
            }, { passive: false });

            document.addEventListener('touchmove', function(ev) {
                if (!dragTarget) return;
                ev.preventDefault();
                let touch = ev.touches[0];
                dragTarget.style.left = (touch.clientX - startX) + 'px';
                dragTarget.style.top = (touch.clientY - startY) + 'px';
            }, { passive: false });

            document.addEventListener('touchend', function(ev) {
                if (!dragTarget) return;
                let touch = ev.changedTouches[0];
                dragTarget.style.display = 'none';
                let dropTarget = document.elementFromPoint(touch.clientX, touch.clientY);
                dragTarget.style.display = '';

                let isFromSearch = dragTarget.getAttribute('data-from-search') === 'true';
                let isFromTrashZone = dragTarget.getAttribute('data-from-trash-zone') === 'true';

                if (dropTarget) {
                    let frame = dropTarget.closest('.frame-layer');
                    let direction = dropTarget.closest('.direction-placeholder');
                    let hand = dropTarget.closest('.hand-area');
                    let trash = dropTarget.closest('#trashZone');
                    let noise = dropTarget.closest('#volNoiseZone');
                    let deckZ = dropTarget.closest('.deck-zone');
                    let searchOverlay = dropTarget.closest('#searchOverlay');

                    if (isFromSearch) {
                        let searchIdx = parseInt(dragTarget.getAttribute('data-search-index'));
                        let targetList = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);
                        let cardObj = targetList.splice(searchIdx, 1)[0];

                        if (frame) {
                            let layerNum = parseInt(frame.id.split('-')[2]);
                            createGameCardToHand(cardObj.name, cardObj.imagePath);
                            let genCard = document.getElementById(`card-id-${cardIdCounter-1}`);
                            executeCardPlacement(genCard, frame, layerNum);
                        } else if (direction && direction.children.length === 0) {
                            createGameCardToHand(cardObj.name, cardObj.imagePath);
                            let genCard = document.getElementById(`card-id-${cardIdCounter-1}`);
                            direction.appendChild(genCard);
                        } else if (trash) {
                            trashCards.push({ name: cardObj.name, imagePath: cardObj.imagePath });
                        } else {
                            createGameCardToHand(cardObj.name, cardObj.imagePath);
                        }
                        document.getElementById('deckCount').innerText = virtualDeck.length;
                        document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                        updateTrashUI(); renderSearchList();
                    } else if (isFromTrashZone) {
                        let cardObj = trashCards.pop();
                        if (frame) {
                            let layerNum = parseInt(frame.id.split('-')[2]);
                            createGameCardToHand(cardObj.name, cardObj.imagePath);
                            let genCard = document.getElementById(`card-id-${cardIdCounter-1}`);
                            executeCardPlacement(genCard, frame, layerNum);
                        } else if (direction && direction.children.length === 0) {
                            createGameCardToHand(cardObj.name, cardObj.imagePath);
                            let genCard = document.getElementById(`card-id-${cardIdCounter-1}`);
                            direction.appendChild(genCard);
                        } else if (noise) {
                            volNoiseCards.push({ name: cardObj.name, imagePath: cardObj.imagePath });
                            document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                        } else if (deckZ) {
                            pendingActionData = { name: cardObj.name, imagePath: cardObj.imagePath, elementId: null, fromHand: false };
                            openActionMenu(`カード「${cardObj.name}」の戻し先`, [
                                { label: "山札の一番上に戻す", value: "top" },
                                { label: "山札の一番下に戻す", value: "bottom" }
                            ], handleDeckReturnChoice);
                        } else {
                            createGameCardToHand(cardObj.name, cardObj.imagePath);
                        }
                        updateTrashUI();
                    } else {
                        if (searchOverlay && isSearchOpen) {
                            returnCardFromHand(dragTarget);
                        } else if (frame) {
                            let layerNum = parseInt(frame.id.split('-')[2]);
                            executeCardPlacement(dragTarget, frame, layerNum);
                        } else if (direction && direction.children.length === 0) {
                            direction.appendChild(dragTarget);
                        } else if (hand) {
                            hand.appendChild(dragTarget);
                        } else if (trash) {
                            trashCards.push({ name: dragTarget.getAttribute('data-cardname'), imagePath: dragTarget.getAttribute('data-imagepath') });
                            updateTrashUI();
                            dragTarget.remove();
                        } else if (noise) {
                            volNoiseCards.push({ name: dragTarget.getAttribute('data-cardname'), imagePath: dragTarget.getAttribute('data-imagepath') });
                            document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                            dragTarget.remove();
                        } else if (deckZ) {
                            let cName = dragTarget.getAttribute('data-cardname'), imgP = dragTarget.getAttribute('data-imagepath');
                            pendingActionData = { name: cName, imagePath: imgP, elementId: dragTarget.id, fromHand: true };
                            openActionMenu(`カード「${cName}」の戻し先`, [
                                { label: "山札の一番上に戻す", value: "top" },
                                { label: "山札の一番下に戻す", value: "bottom" }
                            ], handleDeckReturnChoice);
                        }
                    }
                }

                dragTarget.classList.remove('dragging');
                dragTarget = null;
                if (isSearchOpen) document.getElementById('searchOverlay').classList.remove('dragging-mode');
            });
        }
    </script>
</body>
</html>

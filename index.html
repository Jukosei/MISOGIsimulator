<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>神椿TCG 自由配置シミュレーター</title>
    <style>
        * { touch-action: none; box-sizing: border-box; }
        body { margin: 0; background: #121212; color: #fff; font-family: sans-serif; overflow: hidden; }
        #top-bar { height: auto; min-height: 50px; background: #222; display: flex; flex-direction: column; padding: 5px; gap: 5px; border-bottom: 2px solid #333; }
        .bar-row { display: flex; width: 100%; justify-content: space-around; align-items: center; gap: 5px; }
        .code-input-area { display: flex; width: 100%; padding: 0 5px; gap: 5px; }
        input[type="text"] { flex: 1; background: #333; border: 1px solid #555; color: #fff; padding: 6px; border-radius: 4px; font-size: 11px; }
        button { background: #444; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 11px; font-weight: bold; }
        button.active { background: #007aff; }
        button.action-btn { background: #28a745; }
        button.turn-end-btn { background: #dc3545; }
        #table { position: relative; height: calc(100vh - 85px); width: 100vw; }
        .player-board { position: absolute; width: 100%; height: 100%; display: none; flex-direction: column; padding: 10px; gap: 8px; }
        .player-board.active { display: flex; }
        .zone-title { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
        .field-zone { background: rgba(255,255,255,0.03); border: 1px dashed #444; border-radius: 6px; padding: 5px; min-height: 240px; position: relative; }
        .hand-zone { background: #1a1a2e; border: 1px solid #335; border-radius: 6px; padding: 8px; height: 115px; display: flex; gap: 8px; overflow-x: auto; touch-action: pan-x; }
        .bottom-row { display: flex; gap: 10px; align-items: flex-end; }
        .pile-container { display: flex; flex-direction: column; gap: 5px; }
        .pile { width: 64px; height: 90px; border: 2px dashed #555; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #aaa; background: #151515; text-align: center; position: relative; }
        #trashA, #trashB { border-color: #633; background: #221515; color: #f87171; }
        .card { width: 64px; height: 90px; background: #e0e0e0; color: #000; border-radius: 5px; position: absolute; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 4px; font-size: 9px; font-weight: bold; text-align: center; box-shadow: 2px 2px 6px rgba(0,0,0,0.5); user-select: none; z-index: 10; transition: transform 0.1s; }
        .hand-zone .card { position: relative; top: 0 !important; left: 0 !important; flex-shrink: 0; }
        .card.standby { transform: rotate(90deg); border: 2px solid #ffaa00; }
        .card.face-down { background: #333 !important; color: #333; border: 1px solid #fff; }
        .card.persist { transform: rotate(15deg); border: 2px solid #10b981; box-shadow: 0 0 10px rgba(16,185,129,0.5); }
        .card-menu { display: flex; gap: 2px; width: 100%; justify-content: center; z-index: 20; }
        .card-btn { background: rgba(0,0,0,0.8); color: white; border: none; font-size: 7px; padding: 1px 3px; border-radius: 2px; }
        .badge { font-size: 6px; padding: 1px 2px; border-radius: 2px; color: #fff; position: absolute; top: 2px; left: 2px; z-index: 15; }
        .badge.Artist { background: #e11d48; }
        .badge.Direction { background: #2563eb; }
        .badge.Song { background: #10b981; }
        .badge.Magic { background: #7c3aed; }
    </style>
</head>
<body>
    <div id="top-bar">
        <div class="bar-row">
            <button id="tabA" class="active" onclick="switchPlayer('A')">プレイヤーA</button>
            <button id="tabB" onclick="switchPlayer('B')">プレイヤーB</button>
            <button class="action-btn" onclick="startGame()">ゲーム開始</button>
            <button class="turn-end-btn" onclick="endTurn()">ターン終了</button>
        </div>
        <div class="code-input-area">
            <input type="text" id="deckCodeInput" placeholder="型番コードを入力（例: AA-01/AM-02/AS-01/AD-01...）">
            <button onclick="loadDeckFromCode()">コード読込</button>
        </div>
    </div>
    <div id="table">
        <div id="boardA" class="player-board active">
            <div>
                <div class="zone-title">メインフィールド (カードを自由にドラッグして重ねてください)</div>
                <div id="fieldA" class="field-zone"></div>
            </div>
            <div class="bottom-row">
                <div class="pile-container">
                    <div class="zone-title">トラッシュ</div>
                    <div id="trashA" class="pile">トラッシュ<br>0枚</div>
                </div>
                <div class="pile-container">
                    <div class="zone-title">山札</div>
                    <div id="deckPileA" class="pile" onclick="drawCard('A')">山札:<br>0枚</div>
                </div>
                <div style="flex: 1;"><div class="zone-title">手札</div><div id="handA" class="hand-zone"></div></div>
            </div>
        </div>
        <div id="boardB" class="player-board">
            <div>
                <div class="zone-title">メインフィールド (カードを自由にドラッグして重ねてください)</div>
                <div id="fieldB" class="field-zone"></div>
            </div>
            <div class="bottom-row">
                <div class="pile-container">
                    <div class="zone-title">トラッシュ</div>
                    <div id="trashB" class="pile">トラッシュ<br>0枚</div>
                </div>
                <div class="pile-container">
                    <div class="zone-title">山札</div>
                    <div id="deckPileB" class="pile" onclick="drawCard('B')">山札:<br>0枚</div>
                </div>
                <div style="flex: 1;"><div class="zone-title">手札</div><div id="handB" class="hand-zone"></div></div>
            </div>
        </div>
    </div>
    <script>
        let currentPlayer = 'A';
        let gameData = { A: { deck: [], hand: [], trash: [], allCards: {} }, B: { deck: [], hand: [], trash: [], allCards: {} } };
        function parseCardCode(code) { const typeChar = code.charAt(1).toUpperCase(); switch(typeChar) { case 'A': return 'Artist'; case 'D': return 'Direction'; case 'S': return 'Song'; case 'M': return 'Magic'; default: return 'Other'; } }
        function loadDeckFromCode() { const input = document.getElementById('deckCodeInput').value.trim(); if (!input) { alert("デッキコードを入力してください。"); return; } const cardCodes = input.split('/').map(c => c.trim().toUpperCase()).filter(c => c.length > 0); if (cardCodes.length !== 60) { alert(`デッキは60枚である必要があります。（現在: ${cardCodes.length}枚）`); return; } let p = currentPlayer; let loadedDeck = cardCodes.map((code, index) => ({ id: `${p}-${index}-${Date.now()}`, code: code, type: parseCardCode(code), isStandby: false, isFaceDown: false, isPersist: false })); gameData[p].deck = loadedDeck; gameData[p].hand = []; gameData[p].trash = []; gameData[p].allCards = {}; loadedDeck.forEach(c => { gameData[p].allCards[c.id] = c; }); document.getElementById(`hand${p}`).innerHTML = ''; document.getElementById(`field${p}`).innerHTML = ''; updateDeckCount(p); updateTrashCount(p); alert(`【プレイヤー${p}】デッキコードを読み込みました！`); }
        function switchPlayer(p) { currentPlayer = p; document.getElementById('boardA').classList.toggle('active', p === 'A'); document.getElementById('boardB').classList.toggle('active', p === 'B'); document.getElementById('tabA').classList.toggle('active', p === 'A'); document.getElementById('tabB').classList.toggle('active', p === 'B'); }
        function shuffleDeck(p) { let deck = gameData[p].deck; for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; } }
        function updateDeckCount(p) { document.getElementById(`deckPile${p}`).innerHTML = `山札:<br>${gameData[p].deck.length}枚`; }
        function updateTrashCount(p) { document.getElementById(`trash${p}`).innerHTML = `トラッシュ<br>${gameData[p].trash.length}枚`; }
        function startGame() { let p = currentPlayer; if (gameData[p].deck.length !== 60) { alert(`先にデッキコードを読み込んでください。`); return; } shuffleDeck(p); gameData[p].hand = gameData[p].deck.splice(0, 7); renderHand(p); setTimeout(() => { mulliganProcess(p); }, 100); }
        function mulliganProcess(p) { let hasArtist = gameData[p].hand.some(card => card.type === 'Artist'); if (!hasArtist) { let confirmMulligan = confirm(`【プレイヤー${p}】手札にArtistがありません！\n確認後にOKで引き直します。`); if (confirmMulligan) { gameData[p].deck = gameData[p].deck.concat(gameData[p].hand); gameData[p].hand = []; shuffleDeck(p); gameData[p].hand = gameData[p].deck.splice(0, 7); renderHand(p); setTimeout(() => { mulliganProcess(p); }, 100); } } }
        function renderHand(p) { const handEl = document.getElementById(`hand${p}`); handEl.innerHTML = ''; gameData[p].hand.forEach(cardData => { handEl.appendChild(createCardElement(cardData)); }); updateDeckCount(p); }
        function drawCard(p) { if (gameData[p].deck.length === 0) return; gameData[p].hand.push(gameData[p].deck.shift()); renderHand(p); }
function createCardElement(data) { const card = document.createElement('div'); card.className = card ${data.isStandby ? 'standby' : ''} ${data.isFaceDown ? 'face-down' : ''} ${data.isPersist ? 'persist' : ''}; card.id = data.id; let menuButtons = <button class="card-btn" onclick="rotateCard(event, '${data.id}')">状態</button>; if (data.type === 'Song') { menuButtons += <button class="card-btn" onclick="togglePersistSong(event, '${data.id}')">持続</button>; } card.innerHTML = <span class="badge ${data.type}">${data.type}</span><div style="font-size:11px; margin-top:14px;">${data.code}</div><div class="card-menu"><button class="card-btn" onclick="playCard(event, '${data.id}')">場へ</button>${menuButtons}</div>; if (!gameData[currentPlayer].hand.some(c => c.id === data.id)) { makeElementDraggable(card); } return card; }function playCard(e, id) { e.stopPropagation(); let p = currentPlayer; let cardIndex = gameData[p].hand.findIndex(c => c.id === id); if (cardIndex === -1) return; let cardData = gameData[p].hand[cardIndex]; if (cardData.type === 'Artist') cardData.isStandby = true; gameData[p].hand.splice(cardIndex, 1); let newCard = createCardElement(cardData); let zone = document.getElementById(field${p}); newCard.style.left = (15 + zone.children.length * 5) + 'px'; newCard.style.top = (35 + zone.children.length * 3) + 'px'; zone.appendChild(newCard); renderHand(p); }function togglePersistSong(e, id) { e.stopPropagation(); let p = currentPlayer; let cardData = gameData[p].allCards[id]; cardData.isPersist = !cardData.isPersist; const cardEl = document.getElementById(id); cardEl.classList.toggle('persist', cardData.isPersist); }function endTurn() { let p = currentPlayer; let zone = document.getElementById(field${p}); let cardsInField = Array.from(zone.getElementsByClassName('card')); let artists = cardsInField.filter(el => gameData[p].allCards[el.id].type === 'Artist').map(el => { return { id: el.id, left: parseInt(el.style.left), top: parseInt(el.style.top) }; }); cardsInField.forEach(el => { let cardData = gameData[p].allCards[el.id]; if (cardData.type === 'Artist') { cardData.isStandby = false; el.classList.remove('standby'); return; } if (cardData.type === 'Song') { if (cardData.isPersist) { return; } let cardLeft = parseInt(el.style.left); let isAttached = artists.some(art => { return Math.abs(art.left - cardLeft) < 30; }); if (isAttached) { gameData[p].trash.push(cardData); el.remove(); } } }); updateTrashCount(p); alert(【プレイヤー${p}】ターン終了しました。\n通常のSongをトラッシュし、持続Song・装備Magicは維持したまま、ArtistをActiveに戻しました。); }function rotateCard(e, id) { e.stopPropagation(); document.getElementById(id).classList.toggle('standby'); }function makeElementDraggable(el) { let startX = 0, startY = 0, initialX = 0, initialY = 0; el.addEventListener('mousedown', dragStart); el.addEventListener('touchstart', dragStart, { passive: false }); function dragStart(e) { if (e.target.tagName === 'BUTTON') return; el.parentElement.appendChild(el); const clientX = e.type === 'touchstart' ? e.touches.clientX : e.clientX; const clientY = e.type === 'touchstart' ? e.touches.clientY : e.clientY; startX = clientX; startY = clientY; initialX = el.offsetLeft; initialY = el.offsetTop; if (e.type === 'touchstart') { document.addEventListener('touchmove', dragMove, { passive: false }); document.addEventListener('touchend', dragEnd); } else { document.addEventListener('mousemove', dragMove); document.addEventListener('mouseup', dragEnd); } } function dragMove(e) { e.preventDefault(); const clientX = e.type === 'touchmove' ? e.touches.clientX : e.clientX; const clientY = e.type === 'touchmove' ? e.touches.clientY : e.clientY; el.style.left = (initialX + (clientX - startX)) + 'px'; el.style.top = (initialY + (clientY - startY)) + 'px'; } function dragEnd() { document.removeEventListener('mousemove', dragMove); document.removeEventListener('mouseup', dragEnd); document.removeEventListener('touchmove', dragMove); document.removeEventListener('touchend', dragEnd); } }

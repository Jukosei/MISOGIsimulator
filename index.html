<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禊シミュレーター</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --text-color: #ffffff;
            --accent-color: #ff0055;
            --artist-color: #22a6b3;
            --song-color: #be2edd;
            --magic-color: #f0932b;
            --direction-color: #6ab04c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; }

        .screen { display: none !important; min-height: 100vh; padding: 15px; }
        .screen.active { display: flex !important; flex-direction: column; }

        #menu-screen { justify-content: center; align-items: center; max-width: 500px; margin: 50px auto; padding: 20px; background: var(--card-bg); border-radius: 8px; }
        h1 { font-size: 3.5rem; margin-bottom: 25px; text-align: center; letter-spacing: 6px; border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; width: 100%; font-weight: 900; }
        .form-group { width: 100%; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; }
        textarea { width: 100%; height: 100px; background: #111; border: 1px solid #444; border-radius: 6px; color: #fff; padding: 10px; resize: none; }
        .radio-group { display: flex; gap: 20px; background: #111; padding: 12px; border-radius: 6px; }
        .btn { width: 100%; padding: 14px; background: var(--accent-color); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }

        #game-screen.active {
            display: grid !important;
            grid-template-columns: 100px 1fr 160px 110px;
            grid-template-rows: auto 1fr auto;
            height: 100vh; gap: 10px; padding: 10px;
        }

        .info-bar { grid-column: 1 / span 4; display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 8px 15px; border-radius: 6px; font-size: 0.9rem; }

        .left-sidebar { grid-column: 1; display: flex; flex-direction: column; gap: 15px; justify-content: center; }
        .temp-box { background: var(--card-bg); border-radius: 6px; padding: 10px; text-align: center; border: 1px solid #333; }
        .temp-title { font-size: 0.65rem; color: #888; margin-bottom: 5px; }
        .temp-num { font-size: 2rem; font-weight: bold; margin: 5px 0; }
        .temp-btn { background: #333; color: white; border: none; width: 25px; height: 25px; border-radius: 3px; cursor: pointer; font-weight: bold; }

        .battlefield { grid-column: 2; display: flex; flex-direction: column; gap: 10px; height: 100%; overflow: hidden; }
        .zone { background: rgba(255,255,255,0.02); border: 1px solid #333; border-radius: 8px; padding: 10px; flex: 1; display: flex; flex-direction: column; }
        .zone-title { font-size: 0.75rem; color: #aaa; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
        .slots-row { display: flex; gap: 10px; flex: 1; justify-content: space-between; }
        .card-slot {
            flex: 1; border: 2px dashed #444; border-radius: 6px; position: relative;
            background: rgba(0,0,0,0.2); max-width: 90px; aspect-ratio: 2 / 3;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .slot-btn { position: absolute; top: -8px; background: var(--accent-color); color: white; border: none; font-size: 0.55rem; padding: 1px 4px; border-radius: 3px; cursor: pointer; z-index: 10; }

        .right-sidebar { grid-column: 3; background: var(--card-bg); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
        .sidebar-title { font-size: 0.8rem; font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 5px; margin-bottom: 5px; text-align: center; }
        .control-btn { width: 100%; padding: 8px; background: #2a2a32; color: white; border: 1px solid #444; border-radius: 4px; font-size: 0.75rem; cursor: pointer; text-align: center; }
        .control-btn.end-turn { background: #d35400; font-weight: bold; border: none; margin-top: auto; }

        .token-sidebar { grid-column: 4; background: var(--card-bg); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; justify-content: space-around; align-items: center; }
        .token-container { text-align: center; width: 100%; }
        .token-icon { width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.65rem; font-weight: bold; margin: 0 auto 5px; border: 2px solid #555; }
        .vol-icon { background: #f1c40f; color: #000; }
        .mana-icon { background: #2980b9; color: #fff; }
        .noise-icon { background: #e74c3c; color: #fff; }
        .counter-icon { background: #8e44ad; color: #fff; }
        .token-controls { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .token-btn { background: #333; color: white; border: none; width: 22px; height: 22px; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .token-value { font-size: 1.1rem; font-weight: bold; min-width: 15px; }

        .hand-container { grid-column: 1 / span 4; background: var(--card-bg); border-radius: 8px; padding: 10px; }
        #hand-row { display: flex; gap: 10px; overflow-x: auto; min-height: 110px; align-items: center; }

        .card { width: 72px; height: 108px; background: #25252b; border-radius: 5px; border: 2px solid #666; cursor: pointer; position: relative; overflow: hidden; flex-shrink: 0; }
        .card-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        .card-info-overlay { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; padding: 4px; background: rgba(0,0,0,0.4); }
        .card-code-label { font-size: 0.55rem; background: rgba(0,0,0,0.7); padding: 1px 2px; border-radius: 2px; text-align: center; }
        .card.A { border-color: var(--artist-color); }
        .card.S { border-color: var(--song-color); }
        .card.M { border-color: var(--magic-color); }
        .card.D { border-color: var(--direction-color); }
        .card.standby { transform: rotate(90deg); margin: 0 15px; }
        .song-overlay { position: absolute; bottom: 2px; left: 2px; right: 2px; background: rgba(0,0,0,0.8); color: var(--song-color); font-size: 0.5rem; padding: 1px; border-radius: 2px; text-align: center; z-index: 3; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); padding: 20px; border-radius: 8px; width: 90%; max-width: 350px; text-align: center; }
        .menu-btn { display: block; width: 100%; padding: 10px; background: #2a2a30; color: white; border: 1px solid #444; margin-bottom: 6px; border-radius: 4px; cursor: pointer; text-align: left; font-size: 0.85rem; }
        .menu-btn.cancel { background: #555; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- 1. メニュー画面 -->
    <div id="menu-screen" class="screen active">
        <h1>禊</h1>
        <div class="form-group">
            <label for="deck-code">デッキコード (スラッシュ「/」区切り または 改行区切り)</label>
            <textarea id="deck-code" placeholder="例: GA-13/GA-13/DA-34/JS-40..."></textarea>
            <div id="deck-count" style="font-size: 0.8rem; color: #888; text-align: right;">0 / 60 枚</div>
        </div>
        <div class="form-group">
            <label>対戦の手番</label>
            <div class="radio-group">
                <label><input type="radio" name="turn-order" value="first" checked> 先攻</label>
                <label><input type="radio" name="turn-order" value="second"> 後攻</label>
            </div>
        </div>
        <button class="btn" onclick="startGame()">対戦開始</button>
    </div>

    <!-- 2. 対戦画面 -->
    <div id="game-screen" class="screen">
        <div class="info-bar">
            <div>ターン: <span id="turn-count">1</span> (<span id="player-order-display">先攻</span>)</div>
            <div class="phase-indicator">フェーズ: <span id="current-phase">ドロー</span></div>
            <div>山札: <span id="deck-left">60</span>枚 / トラッシュ: <span id="trash-count">0</span>枚</div>
        </div>
        
        <!-- 左：テンポラリー領域 -->
        <div class="left-sidebar">
            <div class="temp-box">
                <div class="temp-title">テンポラリー</div>
                <div class="token-controls">
                    <button class="temp-btn" onclick="changeTemp('temporary', -1)">-</button>
                    <span class="temp-num" id="temp-temporary">0</span>
                    <button class="temp-btn" onclick="changeTemp('temporary', 1)">+</button>
                </div>
            </div>
            <div class="temp-box">
                <div class="temp-title">Direction</div>
                <div class="token-controls">
                    <button class="temp-btn" onclick="changeTemp('directionTemp', -1)">-</button>
                    <span class="temp-num" id="temp-directionTemp">0</span>
                    <button class="temp-btn" onclick="changeTemp('directionTemp', 1)">+</button>
                </div>
            </div>
        </div>
        <!-- 中央：プレイマット -->
        <div class="battlefield">
            <!-- ステージ枠（5マス） -->
            <div class="zone">
                <div class="zone-title">ステージ (Artist / Song)</div>
                <div class="slots-row">
                    <div class="card-slot" id="stage-slot-0"><button class="slot-btn" onclick="changeStageCard(0)">ﾁｪﾝｼﾞ</button></div>
                    <div class="card-slot" id="stage-slot-1"><button class="slot-btn" onclick="changeStageCard(1)">ﾁｪﾝｼﾞ</button></div>
                    <div class="card-slot" id="stage-slot-2"><button class="slot-btn" onclick="changeStageCard(2)">ﾁｪﾝｼﾞ</button></div>
                    <div class="card-slot" id="stage-slot-3"><button class="slot-btn" onclick="changeStageCard(3)">ﾁｪﾝｼﾞ</button></div>
                    <div class="card-slot" id="stage-slot-4"><button class="slot-btn" onclick="changeStageCard(4)">ﾁｪﾝｼﾞ</button></div>
                </div>
            </div>
            <!-- Direction枠（5マス） -->
            <div class="zone">
                <div class="zone-title">Direction</div>
                <div class="slots-row">
                    <div class="card-slot" id="field-slot-0"></div>
                    <div class="card-slot" id="field-slot-1"></div>
                    <div class="card-slot" id="field-slot-2"></div>
                    <div class="card-slot" id="field-slot-3"></div>
                    <div class="card-slot" id="field-slot-4"></div>
                </div>
            </div>
        </div>
        <!-- 右：操作ボタン -->
        <div class="right-sidebar">
            <div class="sidebar-title">プレイマット</div>
            <button class="control-btn" onclick="shuffleDeck()">山札シャッフル</button>
            <button class="control-btn" onclick="alert('山札サーチ（未実装）')">山札からサーチ</button>
            <button class="control-btn" onclick="alert('VOL/ノイズサーチ（未実装）')">VOL/ノイズサーチ</button>
            <button class="control-btn" onclick="discardAllHand()">手札を全てトラッシュ</button>
            <button class="control-btn" onclick="executeMulligan(true)">マリガン</button>
            <button class="control-btn" onclick="if(confirm('リセットしますか？')) location.reload();">リセット</button>
            <button class="control-btn end-turn" onclick="nextPhase(); nextPhase();">ターンエンド</button>
            <button class="control-btn" onclick="rollDice()">ダイスを振る</button>
            <button class="control-btn" onclick="drawFromBottom()">山札の下から1枚</button>
            <button class="control-btn" onclick="alert('ソート（未実装）')">ソート</button>
        </div>

        <!-- 右端：トークンカウンター -->
        <div class="token-sidebar">
            <div class="token-container">
                <div class="token-icon vol-icon">VOL</div>
                <div class="token-controls">
                    <button class="token-btn" onclick="changeToken('vol', -1)">-</button>
                    <span class="token-value" id="token-vol">0</span>
                    <button class="token-btn" onclick="changeToken('vol', 1)">+</button>
                </div>
            </div>
            <div class="token-container">
                <div class="token-icon mana-icon">魔力</div>
                <div class="token-controls">
                    <button class="token-btn" onclick="changeToken('mana', -1)">-</button>
                    <span class="token-value" id="token-mana">0</span>
                    <button class="token-btn" onclick="changeToken('mana', 1)">+</button>
                </div>
            </div>
            <div class="token-container">
                <div class="token-icon noise-icon">ノイズ</div>
                <div class="token-controls">
                    <button class="token-btn" onclick="changeToken('noise', -1)">-</button>
                    <span class="token-value" id="token-noise">0</span>
                    <button class="token-btn" onclick="changeToken('noise', 1)">+</button>
                </div>
            </div>
            <div class="token-container">
                <div class="token-icon counter-icon">汎用</div>
                <div class="token-controls">
                    <button class="token-btn" onclick="changeToken('generic', -1)">-</button>
                    <span class="token-value" id="token-generic">0</span>
                    <button class="token-btn" onclick="changeToken('generic', 1)">+</button>
                </div>
            </div>
        </div>

        <!-- 下部：手札 -->
        <div class="hand-container">
            <div class="zone-title" style="font-size:0.7rem; color:#888; margin-bottom:4px;">手札</div>
            <div id="hand-row"></div>
        </div>
    </div>

    <!-- ポップアップ確認モーダル -->
    <div id="mulligan-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom:15px; font-size:1rem;">マリガンをしますか？</h3>
            <button class="btn" onclick="executeMulligan(true)" style="background:#333; margin-bottom:10px;">マリガンする</button>
            <button class="btn" onclick="executeMulligan(false)">このまま開始</button>
        </div>
    </div>

    <div id="action-modal" class="modal">
        <div class="modal-content">
            <h3 id="action-card-title" style="margin-bottom:15px; font-size:1.1rem;">カード名</h3>
            <div id="action-buttons-container"></div>
            <button class="menu-btn cancel" onclick="closeActionModal()">閉じる</button>
        </div>
    </div>
    <script>
        let gameState = {
            deck: [], hand: [],
            stage: [null, null, null, null, null],
            field: [null, null, null, null, null],
            trash: [], temporary: 0, directionTemp: 0,
            turn: 1, isFirstPlayer: true, phaseIndex: 0,
            phases: ['ドロー', 'アクト', 'エンド'],
            tokens: { vol: 0, mana: 0, noise: 0, generic: 0 }
        };
        let selectedCardInfo = null;

        document.getElementById('deck-code').addEventListener('input', function() {
            const rawText = this.value;
            const cards = rawText.split(/[\/\n]/).map(c => c.trim()).filter(c => c !== '');
            document.getElementById('deck-count').innerText = `${cards.length} / 60 枚`;
        });

        function changeToken(type, amount) {
            gameState.tokens[type] += amount;
            if (gameState.tokens[type] < 0) gameState.tokens[type] = 0;
            if (type === 'noise' && gameState.tokens.noise > 5) gameState.tokens.noise = 5;
            document.getElementById(`token-${type}`).innerText = gameState.tokens[type];
        }

        function changeTemp(type, amount) {
            gameState[type] += amount;
            if (gameState[type] < 0) gameState[type] = 0;
            document.getElementById(`temp-${type}`).innerText = gameState[type];
        }

        function rollDice() {
            alert(`🎲 ダイスの出目: ${Math.floor(Math.random() * 6) + 1}`);
        }

        function shuffleDeck() {
            for (let i = gameState.deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [gameState.deck[i], gameState.deck[j]] = [gameState.deck[j], gameState.deck[i]];
            }
            alert("山札をシャッフルしました。");
            renderGame();
        }
        function parseCardCode(code) {
            const cleanCode = code.trim();
            const parts = cleanCode.split('-');
            let typeChar = 'M';
            if (parts.length >= 2) {
                const rightPart = parts;
                if (rightPart && rightPart.length > 0) typeChar = rightPart.charAt(0).toUpperCase();
            } else {
                if (cleanCode.includes('A')) typeChar = 'A';
                else if (cleanCode.includes('S')) typeChar = 'S';
                else if (cleanCode.includes('D')) typeChar = 'D';
            }
            const typeMap = { 'A': 'A', 'S': 'S', 'M': 'M', 'D': 'D' };
            return { code: cleanCode, type: typeMap[typeChar] || 'M', img: `images/${cleanCode}.png` };
        }

        function startGame() {
            const codeText = document.getElementById('deck-code').value;
            const lines = codeText.split(/[\/\n]/).map(line => line.trim()).filter(line => line !== '');
            if (lines.length !== 60) {
                alert(`枚数が60枚ではありません。（現在: ${lines.length}枚）`);
                return;
            }
            gameState.deck = lines.map(line => parseCardCode(line));
            gameState.hand = [];
            gameState.stage = [null, null, null, null, null];
            gameState.field = [null, null, null, null, null];
            gameState.trash = []; gameState.temporary = 0; gameState.directionTemp = 0;
            gameState.tokens = { vol: 0, mana: 0, noise: 0, generic: 0 };
            gameState.turn = 1;
            gameState.isFirstPlayer = document.querySelector('input[name="turn-order"]:checked').value === 'first';
            
            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            document.getElementById('player-order-display').innerText = gameState.isFirstPlayer ? "先攻" : "後攻";

            shuffleDeck(); drawCards(7); openModal('mulligan-modal'); renderGame();
        }

        function drawCards(count) {
            for (let i = 0; i < count; i++) {
                if (gameState.deck.length > 0) gameState.hand.push(gameState.deck.pop());
            }
        }

        function drawFromBottom() {
            if (gameState.deck.length > 0) {
                gameState.hand.push(gameState.deck.shift());
                alert("山札の下から1枚ドローしました。"); renderGame();
            } else { alert("山札がありません。"); }
        }

        function executeMulligan(wantMulligan) {
            closeModal('mulligan-modal');
            if (wantMulligan) {
                gameState.deck.push(...gameState.hand); gameState.hand = [];
                shuffleDeck(); drawCards(7);
            }
            gameState.phaseIndex = 0;
            if (gameState.turn === 1 && gameState.isFirstPlayer) {
                alert("先攻1ターン目のためドローはスキップされます。");
            } else { drawCards(1); }
            renderGame();
        }
        function discardAllHand() {
            if(confirm("手札をすべてトラッシュしますか？")) {
                gameState.trash.push(...gameState.hand); gameState.hand = []; renderGame();
            }
        }

        function nextPhase() {
            gameState.phaseIndex++;
            if (gameState.phaseIndex >= gameState.phases.length) {
                gameState.stage.forEach(item => {
                    if (item) {
                        item.attachedSongs = [];
                        if (item.status === 'Standby') item.status = 'Active';
                    }
                });
                gameState.turn++; gameState.phaseIndex = 0; drawCards(1);
            }
            document.getElementById('current-phase').innerText = gameState.phases[gameState.phaseIndex];
            renderGame();
        }

        function renderGame() {
            document.getElementById('turn-count').innerText = gameState.turn;
            document.getElementById('deck-left').innerText = gameState.deck.length;
            document.getElementById('trash-count').innerText = gameState.trash.length;

            for (let i = 0; i < 5; i++) {
                const slot = document.getElementById(`stage-slot-${i}`);
                slot.innerHTML = `<button class="slot-btn" onclick="changeStageCard(${i})">ﾁｪﾝｼﾞ</button>`;
                const item = gameState.stage[i];
                if (item) {
                    const cardDom = createCardDOM(item.card, 'stage', i, item.status);
                    if (item.attachedSongs.length > 0) {
                        const songText = document.createElement('div');
                        songText.className = 'song-overlay';
                        songText.innerText = '♪ ' + item.attachedSongs.map(s => s.code).join(', ');
                        cardDom.appendChild(songText);
                    }
                    slot.appendChild(cardDom);
                }
            }

            for (let i = 0; i < 5; i++) {
                const slot = document.getElementById(`field-slot-${i}`); slot.innerHTML = '';
                const card = gameState.field[i];
                if (card) slot.appendChild(createCardDOM(card, 'field', i));
            }

            const handRow = document.getElementById('hand-row'); handRow.innerHTML = '';
            gameState.hand.forEach((card, index) => { handRow.appendChild(createCardDOM(card, 'hand', index)); });
        }

        function createCardDOM(card, zone, index, status = 'Active') {
            const cardDiv = document.createElement('div'); cardDiv.className = `card ${card.type}`;
            if (status === 'Standby') cardDiv.classList.add('standby');
            const imgEl = document.createElement('img'); imgEl.src = card.img; imgEl.className = 'card-img';
            imgEl.onerror = () => { imgEl.style.display = 'none'; }; cardDiv.appendChild(imgEl);
            const overlay = document.createElement('div'); overlay.className = 'card-info-overlay';
            overlay.innerHTML = `<div class="card-code-label">${card.code}</div>`; cardDiv.appendChild(overlay);
            cardDiv.onclick = (e) => { e.stopPropagation(); handleCardClick(zone, index, card, status); };
            return cardDiv;
        }

        function handleCardClick(zone, index, card, status) {
            selectedCardInfo = { zone, index, card, status };
            const container = document.getElementById('action-buttons-container'); container.innerHTML = '';
            document.getElementById('action-card-title').innerText = card.code;

            if (zone === 'hand') {
                if (card.type === 'A') {
                    createMenuBtn(container, 'ステージの空き枠に出す', () => {
                        const emptyIdx = gameState.stage.findIndex(slot => slot === null);
                        if (emptyIdx === -1) { alert("ステージに空き枠がありません！"); return; }
                        gameState.stage[emptyIdx] = { card: card, status: 'Active', attachedSongs: [] };
                        gameState.hand.splice(index, 1); closeActionModal();
                    });
                } else if (card.type === 'S') {
                    gameState.stage.forEach((item, sIdx) => {
                        if (item) {
                            createMenuBtn(container, `枠 [${sIdx+1}] のArtistにSongを使用`, () => {
                                item.attachedSongs.push(card); gameState.hand.splice(index, 1); closeActionModal();
                            });
                        }
                    });
                } else if (card.type === 'D') {
                    createMenuBtn(container, 'Direction枠の空きに出す', () => {
                        const emptyIdx = gameState.field.findIndex(slot => slot === null);
                        if (emptyIdx === -1) { alert("Direction枠に空きがありません！"); return; }
                        gameState.field[emptyIdx] = card; gameState.hand.splice(index, 1); closeActionModal();
                    });
                } else if (card.type === 'M') {
                    createMenuBtn(container, 'Magicを使用 (トラッシュへ)', () => {
                        gameState.trash.push(card); gameState.hand.splice(index, 1); closeActionModal();
                    });
                }
                createMenuBtn(container, 'トラッシュに捨てる', () => {
                    gameState.trash.push(card); gameState.hand.splice(index, 1); closeActionModal();
                });
            } else if (zone === 'stage') {
                createMenuBtn(container, status === 'Active' ? 'Standby(横置)にする' : 'Active(縦置)にする', () => {
                    gameState.stage[index].status = status === 'Active' ? 'Standby' : 'Active'; closeActionModal();
                });
                createMenuBtn(container, 'トラッシュへ送る', () => {
                    gameState.trash.push(gameState.stage[index].card); gameState.trash.push(...gameState.stage[index].attachedSongs);
                    gameState.stage[index] = null; closeActionModal();
                });
            } else if (zone === 'field') {
                createMenuBtn(container, 'トラッシュへ送る', () => {
                    gameState.trash.push(gameState.field[index]); gameState.field[index] = null; closeActionModal();
                });
            }
            openModal('action-modal');
        }

        function changeStageCard(index) {
            if(gameState.stage[index] === null) { alert("この枠にはカードがありません。"); return; }
            if(confirm(`枠 [${index+1}] のカードを手札に戻しますか？（チェンジ）`)) {
                gameState.hand.push(gameState.stage[index].card); gameState.trash.push(...gameState.stage[index].attachedSongs);
                gameState.stage[index] = null; renderGame();
            }
        }

        function createMenuBtn(parent, text, onClickFn) {
            const btn = document.createElement('button'); btn.className = 'menu-btn'; btn.innerText = text;
            btn.onclick = () => { onClickFn(); renderGame(); }; parent.appendChild(btn);
        }
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function closeActionModal() { closeModal('action-modal'); }
    </script>
</body>
</html>

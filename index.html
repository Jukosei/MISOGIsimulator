<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>禊シミュレーター</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1a1a1a;
            --border-color: #333333;
            --btn-blue: #007bff;
            --btn-red: #dc3545;
            --btn-green: #28a745;
            --btn-accent: #e6002d;
            --text-color: #ffffff;
            --card-width: 120px;
            --card-height: 168px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: none;
            user-select: none;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            padding: 40px 20px;
            box-sizing: border-box;
            touch-action: auto;
        }

        .title {
            font-size: 54px;
            font-weight: bold;
            margin-bottom: 35px;
            letter-spacing: 6px;
        }

        .mode-selection {
            display: flex;
            gap: 10px;
            margin-bottom: 35px;
        }

        .mode-btn {
            background-color: #242424;
            color: #8a8a8a;
            border: 1px solid #3a3a3a;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .mode-btn.active {
            background-color: var(--btn-blue);
            color: #ffffff;
            border-color: var(--btn-blue);
        }

        .input-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .deck-code-area {
            width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .label-text {
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            align-self: center;
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            height: 160px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            padding: 15px;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
            outline: none;
        }

        .clear-btn {
            background-color: var(--btn-red);
            color: #ffffff;
            border: none;
            padding: 10px 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 12px;
        }

        .start-btn {
            background-color: var(--btn-accent);
            color: #ffffff;
            border: none;
            padding: 15px 100px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 45px;
            letter-spacing: 2px;
        }

        .game-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            background-color: #0d0d0d;
            box-sizing: border-box;
            padding: 10px;
            gap: 14px;
        }

        .left-panel {
            width: 160px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            box-sizing: border-box;
            padding-bottom: 15px;
        }

        .zone-box {
            background-color: var(--panel-bg);
            border: 2px dashed #444;
            border-radius: 6px;
            width: 150px;
            height: 225px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            position: relative;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .zone-box .count-display {
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0px 0px 4px #000, 0px 0px 4px #000;
        }

        .zone-label {
            font-size: 10px;
            color: #8a8a8a;
            margin-top: 5px;
            text-align: center;
            text-shadow: 0px 0px 4px #000, 0px 0px 4px #000;
        }

        .zone-box.drag-over {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: #fff;
        }

        .temporary-btn-green {
            width: 100%;
            background-color: var(--btn-green);
            color: white;
            font-size: 12px;
            font-weight: bold;
            border: none;
            padding: 10px 0;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            margin: auto 0;
        }

        .center-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 12px;
            flex: 1;
        }

        .field-section-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .stage-box {
            flex: 6.4;
            margin-bottom: 20px;
        }

        .direction-box {
            flex: 2.8;
        }

        .field-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .row-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .slot-column-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            gap: 8px;
            height: 380px;
        }

        .stage-placeholder-stack {
            position: relative;
            width: var(--card-width);
            height: 336px;
            margin-top: -6px;
        }

        .frame-layer {
            position: absolute;
            width: var(--card-width);
            height: var(--card-height);
            border-radius: 6px;
            box-sizing: border-box;
            z-index: 5;
        }

        .frame-layer.layer-1 { top: 0px; border: 2px dashed #1565c0; }
        .frame-layer.layer-2 { top: 84px; border: 2px dashed #f9a825; }
        .frame-layer.layer-3 { top: 168px; border: 2px dashed #6a1b9a; }

        .frame-layer.drag-over {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .direction-placeholder {
            width: var(--card-width);
            height: var(--card-height);
            border: 2px dashed #c62828;
            border-radius: 6px;
            box-sizing: border-box;
            position: relative;
        }

        .direction-placeholder.drag-over {
            background-color: rgba(198, 40, 40, 0.1);
        }

        .frame-layer .game-card, .direction-placeholder .game-card {
            position: absolute;
            top: 0;
            left: 0;
            margin: 0;
            width: 100%;
            height: 100%;
        }

        .slot-tag-btn {
            background-color: #222;
            color: #aaa;
            font-size: 11px;
            border: 1px solid #444;
            padding: 4px 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            z-index: 20;
        }

        .slot-tag-btn.selecting {
            background-color: var(--btn-accent);
            color: #fff;
            border-color: var(--btn-accent);
        }

        .hand-area {
            flex: 2.8;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-content: flex-start;
            touch-action: auto;
        }

        .game-card {
            width: var(--card-width);
            height: var(--card-height);
            background-color: #333;
            border: 1px solid #555;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: grab;
            box-sizing: border-box;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            text-shadow: 0px 0px 4px #000, 0px 0px 4px #000;
            touch-action: none;
        }

        .game-card.dragging {
            opacity: 0.8 !important;
            position: fixed !important;
            z-index: 9999 !important;
            pointer-events: none !important;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            transform: scale(1.05);
        }

        .control-panel {
            width: 170px;
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 6px;
            touch-action: auto;
        }

        .control-btn {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
        }

        .control-btn.orange { background-color: #ff9f00; }
        .control-btn.gray { background-color: #444; }

        .deck-zone {
    margin-top: auto;
    border: 2px dashed #444;
    background-color: #222;
    border-radius: 6px;

    /* 幅と高さをVOLノイズと同じサイズに強力固定 */
    width: 150px !important;
    height: 225px !important;
    box-sizing: border-box;

    /* 背景画像設定 */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-left: auto;
    margin-right: auto;
}

        .deck-count { font-size: 32px; font-weight: bold; }
        .deck-label { font-size: 10px; color: #888; margin-top: 4px; }

        .counter-panel {
            width: 140px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            padding: 20px 5px;
            box-sizing: border-box;
            justify-content: flex-start;
            gap: 22px;
            height: 100%;
            touch-action: auto;
        }

        .counter-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .counter-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }

        .icon-vol { background-color: #ffd700; color: #000; }
        .icon-alpha { background-color: #ff69b4; }
        .icon-beta { background-color: #1e90ff; }
        .icon-omega { background-color: #9400d3; }

        .counter-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .counter-btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .counter-value {
            font-size: 28px;
            font-weight: bold;
            width: 35px;
            text-align: center;
        }

        .turn-display {
            margin-top: auto;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            font-size: 13px;
            color: #aaa;
        }

        .turn-display span {
            display: block;
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
        }

        .search-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            justify-content: center;
            align-items: flex-start;
            padding-top: 25px;
            box-sizing: border-box;
        }

        .search-overlay.dragging-mode {
            background-color: rgba(0, 0, 0, 0.2);
        }

        .search-overlay.dragging-mode .search-modal {
            opacity: 0.3;
        }

        .search-modal {
            background-color: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            width: 85%;
            max-width: 900px;
            height: 62%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            pointer-events: auto;
        }

        .search-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .search-modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        .search-modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 28px;
            cursor: pointer;
            font-weight: bold;
            pointer-events: auto;
        }

        .search-modal-close:hover { color: #fff; }

        .search-card-grid {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            content-align: flex-start;
            padding: 5px;
            pointer-events: auto;
        }

        .search-modal .game-card {
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .search-modal .game-card:hover {
            transform: scale(1.03);
            border-color: #fff;
        }

        .action-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.6);
            z-index: 20000;
            justify-content: center;
            align-items: center;
        }

        .action-box {
            background-color: #1e1e1e;
            border: 2px solid #555;
            border-radius: 8px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            max-width: 320px;
            width: 80%;
        }

        .action-title {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            text-align: center;
            margin-bottom: 6px;
            word-break: break-all;
        }

        .action-btn {
            width: 100%;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .action-btn:hover {
            background-color: var(--btn-blue);
            border-color: var(--btn-blue);
        }

        .action-btn.cancel {
            background-color: #444;
            margin-top: 6px;
        }

        .action-btn.cancel:hover {
            background-color: var(--btn-red);
            border-color: var(--btn-red);
        }
    </style>
</head>
<body>
    <div class="menu-container" id="menuScreen">
        <div class="title">禊</div>
        <div class="mode-selection">
            <button class="mode-btn" id="btn1Deck" onclick="selectMode(1)">1デッキモード</button>
            <button class="mode-btn active" id="btn2Deck" onclick="selectMode(2)">2デッキ対戦モード</button>
        </div>
        <div class="input-section">
            <div class="deck-code-area" id="areaPlayer1">
                <div class="label-text" id="labelPlayer1">プレイヤー1のデッキ</div>
                <div class="textarea-container"><textarea id="deckInput1" oninput="saveData()"></textarea></div>
                <button class="clear-btn" onclick="clearInput(1)">クリア</button>
            </div>
            <div class="deck-code-area" id="areaPlayer2">
                <div class="label-text">プレイヤー2のデッキ</div>
                <div class="textarea-container"><textarea id="deckInput2" oninput="saveData()"></textarea></div>
                <button class="clear-btn" onclick="clearInput(2)">クリア</button>
            </div>
        </div>
        <button class="start-btn" onclick="startGame()">ゲーム開始</button>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="left-panel">
            <div class="zone-box" id="volNoiseZone" onclick="openVolNoiseModal()" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToVolNoise(event)" style="cursor: pointer;">
    <div class="count-display" id="volNoiseCount">0</div>
    <div class="zone-label">VOLノイズ（確認はクリック）</div>
</div>     
            
            <button class="temporary-btn-green" onclick="triggerAction('テンポラリー表示')">テンポラリー</button>
            <div class="zone-box" id="trashZone" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToTrash(event)">
                <div class="count-display" id="trashCount">0</div>
                <div class="zone-label">トラッシュ (確認はクリック)</div>
            </div>
        </div>

        <div class="center-panel">
            <div class="field-section-box stage-box">
                <div class="row-label">ステージ</div>
                <div class="field-row">
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-0" onclick="clickChangeBtn(0)">チェンジ</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1" id="frame-0-1" data-type="stage" data-col="0" data-layer="1" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,0,1)"></div>
                            <div class="frame-layer layer-2" id="frame-0-2" data-type="stage" data-col="0" data-layer="2" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,0,2)"></div>
                            <div class="frame-layer layer-3" id="frame-0-3" data-type="stage" data-col="0" data-layer="3" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,0,3)"></div>
                        </div>
                    </div>
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-1" onclick="clickChangeBtn(1)">チェンジ</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1" id="frame-1-1" data-type="stage" data-col="1" data-layer="1" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,1,1)"></div>
                            <div class="frame-layer layer-2" id="frame-1-2" data-type="stage" data-col="1" data-layer="2" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,1,2)"></div>
                            <div class="frame-layer layer-3" id="frame-1-3" data-type="stage" data-col="1" data-layer="3" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,1,3)"></div>
                        </div>
                    </div>
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-2" onclick="clickChangeBtn(2)">チェンジ</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1" id="frame-2-1" data-type="stage" data-col="2" data-layer="1" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,2,1)"></div>
                            <div class="frame-layer layer-2" id="frame-2-2" data-type="stage" data-col="2" data-layer="2" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,2,2)"></div>
                            <div class="frame-layer layer-3" id="frame-2-3" data-type="stage" data-col="2" data-layer="3" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,2,3)"></div>
                        </div>
                    </div>
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-3" onclick="clickChangeBtn(3)">チェンジ</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1" id="frame-3-1" data-type="stage" data-col="3" data-layer="1" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,3,1)"></div>
                            <div class="frame-layer layer-2" id="frame-3-2" data-type="stage" data-col="3" data-layer="2" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,3,2)"></div>
                            <div class="frame-layer layer-3" id="frame-3-3" data-type="stage" data-col="3" data-layer="3" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,3,3)"></div>
                        </div>
                    </div>
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-4" onclick="clickChangeBtn(4)">チェンジ</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1" id="frame-4-1" data-type="stage" data-col="4" data-layer="1" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,4,1)"></div>
                            <div class="frame-layer layer-2" id="frame-4-2" data-type="stage" data-col="4" data-layer="2" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,4,2)"></div>
                            <div class="frame-layer layer-3" id="frame-4-3" data-type="stage" data-col="4" data-layer="3" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,4,3)"></div>
                        </div>
                    </div>
                </div>
            </div><div class="field-section-box direction-box">
                <div class="field-row">
                    <div class="direction-placeholder" id="dir-slot-0" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToDirection(event,0)"></div>
                    <div class="direction-placeholder" id="dir-slot-1" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToDirection(event,1)"></div>
                    <div class="direction-placeholder" id="dir-slot-2" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToDirection(event,2)"></div>
                    <div class="direction-placeholder" id="dir-slot-3" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToDirection(event,3)"></div>
                    <div class="direction-placeholder" id="dir-slot-4" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToDirection(event,4)"></div>
                </div>
            </div>
            <div class="hand-area" id="handArea" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToHand(event)"></div>

function setupTrashAreaEvents() {
            let el = document.getElementById('trashZone');
            el.setAttribute('draggable', 'true');
            
            el.onclick = function(ev) {

            el.ondragend = function(ev) {

            }, { passive: true });

            el.addEventListener('touchend', function(ev) {
                if (!isTrashDragging) return;

                let touch = ev.changedTouches[0];

                    openSearchModal('trash');
                } else {
                    let dropT = document.elementFromPoint(touch.clientX, touch.clientY);

                            let cut = trashCards.pop();

        function startGame() {
            let t = document.getElementById('deckInput1').value;
            let e = t.split(/[\/\s\n,]+/).map(t => t.trim()).filter(t => t.length > 0);
            if (e.length === 0) return alert('デッキコードが入力されていません！');

            let a = [];
            e.forEach(codeStr => {
                let p = codeStr.split('-');
                if (p.length === 2) {
                    let letters = codeStr.toUpperCase();
                    let r = letters.slice(-1);
                    a.push({ name: codeStr, suffix: r, imagePath: `images/${codeStr}.png` });
                }
            });

            let o = { A: 1, S: 2, M: 3, D: 4 };
            a.sort((t, e) => (o[t.suffix] || 99) - (o[e.suffix] || 99));
            virtualDeck = a;

            updateDeckUI();
            updateVolNoiseUI();
            trashCards = [];
            updateTrashUI();
            volNoiseCards = [];
            document.getElementById('handArea').innerHTML = "";
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
        }

        function createGameCardToHand(t, e) {
            let a = document.getElementById('handArea');
            let n = document.createElement('div');
            n.className = 'game-card';
            n.id = `card-id-${cardIdCounter++}`;
            n.innerText = t;
            n.style.backgroundImage = `url('${e}')`;
            n.setAttribute('draggable', 'true');
            n.setAttribute('data-cardname', t);
            n.setAttribute('data-imagepath', e);

            n.ondragstart = function(ev) {
                ev.dataTransfer.setData('text/plain', ev.target.id);
                if (isSearchOpen) document.getElementById('searchOverlay').classList.add('dragging-mode');
            };

            n.ondragend = function(ev) {
                document.getElementById('searchOverlay').classList.remove('dragging-mode');
            };

            n.oncontextmenu = function(ev) {
                if (isSearchOpen) {
                    ev.preventDefault();
                    returnCardFromHand(n);
                }
            };

            n.addEventListener('touchstart', touchStartCard, { passive: false });
            n.addEventListener('touchmove', touchMoveCard, { passive: false });
            n.addEventListener('touchend', touchEndCard, { passive: false });
            a.appendChild(n);
        }

        function touchStartCard(t) {
            t.preventDefault();
            dragTarget = t.currentTarget;
            let e = t.touches;
            let a = dragTarget.getBoundingClientRect();
            startX = e[0].clientX - a.left;
            startY = e[0].clientY - a.top;
            dragTarget.classList.add('dragging');
            dragTarget.style.left = (e[0].clientX - startX) + 'px';
            dragTarget.style.top = (e[0].clientY - startY) + 'px';
            if (isSearchOpen) document.getElementById('searchOverlay').classList.add('dragging-mode');
        }

        function touchMoveCard(t) {
            if (dragTarget) {
                t.preventDefault();
                let e = t.touches;
                dragTarget.style.left = (e[0].clientX - startX) + 'px';
                dragTarget.style.top = (e[0].clientY - startY) + 'px';
            }
        }

        function openActionMenu(title, options, callback) {
            document.getElementById('actionMenuTitle').innerText = title;
            let container = document.getElementById('actionButtonsContainer');
            container.innerHTML = "";
            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.innerText = opt.label;
                btn.onclick = function() {
                    callback(opt.value);
                    closeActionMenu();
                };
                container.appendChild(btn);

            document.getElementById('actionOverlay').style.display = 'flex';
        }

            document.getElementById('actionOverlay').style.display = 'none';
            pendingActionData = null;
        }

        function touchEndCard(t) {
            if (!dragTarget) return;
            t.preventDefault();
            let e = t.changedTouches[0];
            dragTarget.style.display = 'none';
            if (isSearchOpen) document.getElementById('searchOverlay').classList.remove('dragging-mode');
            
            let a = document.elementFromPoint(e.clientX, e.clientY);
            dragTarget.style.display = '';
            dragTarget.classList.remove('dragging');
            dragTarget.style.left = '';
            dragTarget.style.top = '';

            if (a) {
                let mBox = a.closest('#searchModalEl') || a.closest('#searchOverlay');
                if (isSearchOpen && mBox && dragTarget.getAttribute('data-from-search') !== 'true') {
                    returnCardFromHand(dragTarget);
                    dragTarget = null;
                    return;
                }

                if (dragTarget.getAttribute('data-from-search') === 'true') {
                    let idx = parseInt(dragTarget.getAttribute('data-search-index'));
                    let targetList = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);
                    
                    if (a.closest('.hand-area')) {
                        let cut = targetList.splice(idx, 1)[0];
                        createGameCardToHand(cut.name, cut.imagePath);
                    } else if (a.closest('#trashZone') && currentSearchType !== 'trash') {
                        let cut = targetList.splice(idx, 1)[0];
                        trashCards.push({ name: cut.name, imagePath: cut.imagePath });
                    } else if (a.closest('.frame-layer')) {
                        let cut = targetList.splice(idx, 1)[0];
                        createGameCardToHand(cut.name, cut.imagePath);
                        let gen = document.getElementById(`card-id-${cardIdCounter - 1}`);
                        if (gen) {
                            let layerNum = parseInt(a.closest('.frame-layer').getAttribute('data-layer'));
                            executeCardPlacement(gen, a.closest('.frame-layer'), layerNum);
                        }
                    } else if (a.closest('.direction-placeholder')) {
                        let cut = targetList.splice(idx, 1)[0];
                        createGameCardToHand(cut.name, cut.imagePath);
                        let gen = document.getElementById(`card-id-${cardIdCounter - 1}`);
                        if (gen && a.closest('.direction-placeholder').children.length === 0) {
                            a.closest('.direction-placeholder').appendChild(gen);
                        }
                    }

                    updateDeckUI();
                    updateVolNoiseUI();
                    updateTrashUI();
                    dragTarget.remove();
                    dragTarget = null;
                    renderSearchList();
                    return;
                }

                if (a.closest('.deck-zone')) {
                    let cName = dragTarget.getAttribute('data-cardname');
                    let imgP = dragTarget.getAttribute('data-imagepath');
                    pendingActionData = { name: cName, imagePath: imgP, elementId: dragTarget.id, fromHand: true };
                    openActionMenu(`カード「${cName}」の戻し先`, [
                        { label: "山札の一番上に戻す", value: "top" },
                        { label: "山札の一番下に戻す", value: "bottom" }
                    ], handleDeckReturnChoice);
                    dragTarget = null;
                    return;
                }

                let n = a.closest('.frame-layer');
                if (n && n.hasAttribute('data-layer')) {
                    executeCardPlacement(dragTarget, n, parseInt(n.getAttribute('data-layer')));
                    dragTarget = null;
                    return;
                }

                let r = a.closest('.direction-placeholder');
                if (r && r.children.length === 0) {
                    r.appendChild(dragTarget);
                    dragTarget = null;
                    return;
                }

                if (a.closest('.hand-area')) {
                    document.getElementById('handArea').appendChild(dragTarget);
                    dragTarget = null;
                    return;

                if (a.closest('#trashZone')) {
                    trashCards.push({ name: dragTarget.getAttribute('data-cardname'), imagePath: dragTarget.getAttribute('data-imagepath') });

                    dragTarget = null;

            }

            if (dragTarget && dragTarget.getAttribute('data-from-search') === 'true') {
                dragTarget.remove();
                renderSearchList();
            }
            dragTarget = null;
        }

        let pendingDeckReturn = null;

        // ドラッグ許可設定
function allowDrop(ev) {
    ev.preventDefault();
    ev.currentTarget.classList.add('drag-over');
}

function dragLeave(ev) {
    ev.currentTarget.classList.remove('drag-over');
}

// 山札ドラッグ開始
function dragStartDeck(ev) {
    if (!virtualDeck || virtualDeck.length === 0) {
        ev.preventDefault();
        return;
    }
    ev.dataTransfer.setData('text/plain', 'deck-zone-drag');
    ev.dataTransfer.effectAllowed = 'move';
}

// 山札終了処理
function dragEndDeck(ev) {
    let overlay = document.getElementById('searchOverlay');
    if (overlay) overlay.classList.remove('dragging-mode');
}

// 山札へのドロップ処理（選択モーダルを開く）
function dropToDeck(ev) {
    ev.preventDefault();
    ev.currentTarget.classList.remove('drag-over');
    let dataText = ev.dataTransfer.getData('text/plain') || ev.dataTransfer.getData('text');

    // 自分自身へのドロップは無視
    if (dataText === 'deck-zone-drag') return;

    // トラッシュから山札に戻す場合
    if (dataText === 'trash-zone-drag' && trashCards.length > 0) {
        let cardObj = trashCards.slice(-1)[0];
        pendingDeckReturn = {
            type: 'trash',
            card: cardObj
        };
        openDeckReturnModal();
    } 
    // 手札やフィールドの実体カードから戻す場合
    else if (dataText) {
        let cardEl = document.getElementById(dataText);
        if (cardEl) {
            let name = cardEl.getAttribute('data-cardname');
            let imagePath = cardEl.getAttribute('data-imagepath');
            if (name && imagePath) {
                pendingDeckReturn = {
                    type: 'element',
                    elementId: dataText,
                    card: { name: name, imagePath: imagePath }
                };
                openDeckReturnModal();
            }
        }
    }
}

            // モーダル表示制御
function openDeckReturnModal() {
    let modal = document.getElementById('deckReturnModal');
    if (modal) modal.style.display = 'flex';
}

function closeDeckReturnModal() {
    let modal = document.getElementById('deckReturnModal');
    if (modal) modal.style.display = 'none';
    pendingDeckReturn = null;
}

// 戻し先の確定処理
function confirmDeckReturn(position) {
    if (!pendingDeckReturn) return;

    let card = pendingDeckReturn.card;

    // 1. 移動元データ・要素の削除処理
    if (pendingDeckReturn.type === 'trash') {
        trashCards.pop();
        updateTrashUI();
    } else if (pendingDeckReturn.type === 'element') {
        let el = document.getElementById(pendingDeckReturn.elementId);
        if (el) el.remove();
    }

    // 2. 山札への追加処理
    if (position === 'top') {
        virtualDeck.unshift(card); // 先頭（上）に追加
    } else if (position === 'bottom') {
        virtualDeck.push(card);    // 末尾（下）に追加
    } else if (position === 'shuffle') {
        virtualDeck.push(card);
        // Fisher-Yates シャッフル
        for (let i = virtualDeck.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [virtualDeck[i], virtualDeck[j]] = [virtualDeck[j], virtualDeck[i]];
        }
    }

    // 3. UIの更新と閉じる処理
    let deckCountEl = document.getElementById('deckCount');
    if (deckCountEl) deckCountEl.innerText = virtualDeck.length;

    closeDeckReturnModal();
}
        function dropToSpecificFrame(ev, colIndex, layerNum) {

                let cardObj = targetList.splice(idx, 1)[0];
                createGameCardToHand(cardObj.name, cardObj.imagePath);
                let genCard = document.getElementById(`card-id-${cardIdCounter - 1}`);
                if (genCard) { executeCardPlacement(genCard, ev.currentTarget, layerNum); }
                updateDeckUI();
                updateVolNoiseUI();
                updateTrashUI();
                renderSearchList();
                return;
            }

            if (dataText === 'trash-zone-drag' && trashCards.length > 0) {
                let cardObj = trashCards.pop();
                createGameCardToHand(cardObj.name, cardObj.imagePath);
                let genCard = document.getElementById(`card-id-${cardIdCounter - 1}`);
                if (genCard) { executeCardPlacement(genCard, ev.currentTarget, layerNum); }
                updateTrashUI();
                return;
            }

            if (dataText) {
                let r = document.getElementById(dataText);
                if (r) executeCardPlacement(r, ev.currentTarget, layerNum);
            }
        }

        function executeCardPlacement(t, e, a) {
            let n = e.children.length;
            if (a === 3) {
                if (n < 2) e.appendChild(t);
                else alert('紫色の枠にはこれ以上重ねられません！');
            } else {
                if (n === 0) e.appendChild(t);
                else alert('この枠には既にカードがあります！');
            }
        }

        function dropToDirection(ev, slotIdx) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            let dataText = ev.dataTransfer.getData('text/plain');

            if (dataText === 'search-drag') {
                let idx = parseInt(ev.dataTransfer.getData('search-index'));
                let targetList = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);
                if (ev.currentTarget.children.length === 0) {
                    let cardObj = targetList.splice(idx, 1)[0];
                    createGameCardToHand(cardObj.name, cardObj.imagePath);
                    let genCard = document.getElementById(`card-id-${cardIdCounter - 1}`);
                    if (genCard) { ev.currentTarget.appendChild(genCard); }
                    document.getElementById('deckCount').innerText = virtualDeck.length;
                    document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                    updateTrashUI();
                    renderSearchList();
                }
                return;
            }

            if (dataText === 'trash-zone-drag' && trashCards.length > 0) {
                if (ev.currentTarget.children.length === 0) {
                    let cardObj = trashCards.pop();
                    createGameCardToHand(cardObj.name, cardObj.imagePath);
                    let genCard = document.getElementById(`card-id-${cardIdCounter - 1}`);
                    if (genCard) { ev.currentTarget.appendChild(genCard); }
                    updateTrashUI();
                }
                return;
            }

            if (dataText) {
                let n = document.getElementById(dataText);
                if (n && ev.currentTarget.children.length === 0) ev.currentTarget.appendChild(n);
            }
        }

        function dropToHand(ev) {
    ev.preventDefault();
    ev.currentTarget.classList.remove('drag-over');
    let dataText = ev.dataTransfer.getData('text/plain');

    // 山札からのドラッグ＆ドロップを追加
    if (dataText === 'deck-zone-drag' && virtualDeck && virtualDeck.length > 0) {
        let topCard = virtualDeck.shift(); // 先頭1枚を取り出す
        createGameCardToHand(topCard.name, topCard.imagePath);
        updateDeckUI(); // 山札の枚数と背景画像を更新
    }
    else if (dataText === 'search-drag') {
        let idx = parseInt(ev.dataTransfer.getData('search-index'));
        let targetList = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);
        let cardObj = targetList.splice(idx, 1)[0];
        createGameCardToHand(cardObj.name, cardObj.imagePath);
        updateDeckUI();
        updateVolNoiseUI();
        updateTrashUI();
        renderSearchList();
    } else if (dataText === 'trash-zone-drag' && trashCards.length > 0) {
        let cardObj = trashCards.pop();
        createGameCardToHand(cardObj.name, cardObj.imagePath);
        updateTrashUI();
    } else if (dataText) {
        let a = document.getElementById(dataText);
        if (a) document.getElementById('handArea').appendChild(a);
    }
}

        // トラッシュへドロップ
function dropToTrash(ev) {
    ev.preventDefault();
    ev.currentTarget.classList.remove('drag-over');
    let dataText = ev.dataTransfer.getData('text/plain');

    // 山札からのドラッグ判定
    if (dataText === 'deck-zone-drag' && virtualDeck && virtualDeck.length > 0) {
        let topCard = virtualDeck.shift(); // 先頭を取得して除外
        trashCards.push({ name: topCard.name, imagePath: topCard.imagePath });
        
        document.getElementById('deckCount').innerText = virtualDeck.length;
        updateTrashUI();
    } 
    // その他のカード要素からのドラッグ
    else if (dataText && dataText !== 'trash-zone-drag' && dataText !== 'deck-zone-drag') {
        let a = document.getElementById(dataText);
        if (a) {
            trashCards.push({ name: a.getAttribute('data-cardname'), imagePath: a.getAttribute('data-imagepath') });
            updateTrashUI();
            a.remove();
        }
    }
}

function dropToVolNoise(ev) {
    ev.preventDefault();
    ev.currentTarget.classList.remove('drag-over');

    // 配列の存在確認と枚数チェック（5枚以上なら中断）
    if (!volNoiseCards) volNoiseCards = [];
    if (volNoiseCards.length >= 5) {
        alert('VOLノイズエリアは最大5枚までです。');
        return;
    }

    let dataText = ev.dataTransfer.getData('text/plain') || ev.dataTransfer.getData('text');

    if (dataText === 'deck-zone-drag' && virtualDeck && virtualDeck.length > 0) {
        let topCard = virtualDeck.shift();
        volNoiseCards.push({ name: topCard.name, imagePath: topCard.imagePath });
    } 
    else if (dataText === 'trash-zone-drag' && trashCards && trashCards.length > 0) {
        let cardObj = trashCards.pop();
        volNoiseCards.push({ name: cardObj.name, imagePath: cardObj.imagePath });
        updateTrashUI();
    } 
    else if (dataText && dataText !== 'deck-zone-drag') {
        let a = document.getElementById(dataText);
        if (a) {
            volNoiseCards.push({ 
                name: a.getAttribute('data-cardname'), 
                imagePath: a.getAttribute('data-imagepath') 
            });
            a.remove();
        }
    }

    // ★ 個別の innerText 更新を削除し、ここで一括UI更新
    updateDeckUI();
    updateVolNoiseUI();
}
        function dropToDeckZone(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            let dataText = ev.dataTransfer.getData('text/plain');

            if (dataText === 'trash-zone-drag' && trashCards.length > 0) {
                let cardObj = trashCards.pop();
                pendingActionData = { name: cardObj.name, imagePath: cardObj.imagePath, elementId: null, fromHand: false };
                updateTrashUI();
                openActionMenu(`カード「${cardObj.name}」の戻し先`, [
                    { label: "山札の一番上に戻す", value: "top" },
                    { label: "山札の一番下に戻す", value: "bottom" }
                ], handleDeckReturnChoice);
                return;
            }

            if (dataText && dataText !== 'search-drag') {
                let a = document.getElementById(dataText);
                if (a) {
                    let cName = a.getAttribute('data-cardname');
                    let imgP = a.getAttribute('data-imagepath');
                    pendingActionData = { name: cName, imagePath: imgP, elementId: a.id, fromHand: true };
                    openActionMenu(`カード「${cName}」の戻し先`, [
                        { label: "山札の一番上に戻す", value: "top" },
                        { label: "山札の一番下に戻す", value: "bottom" }
                    ], handleDeckReturnChoice);
                }
            }
        }

            // VOLノイズの裏面表示モーダルを開く
function openVolNoiseModal() {
    let listContainer = document.getElementById('volNoiseModalList'); // コンテナ要素を取得
    if (!listContainer) return;

    listContainer.innerHTML = ''; // 一度リセット

    if (!volNoiseCards || volNoiseCards.length === 0) {
        listContainer.innerHTML = '<p style="color:#ccc; text-align:center;">VOLノイズはありません</p>';
    } else {
        volNoiseCards.forEach((card, index) => {
            // 変数をちゃんと const や let で宣言する
            const cardEl = document.createElement('div');
            cardEl.className = 'modal-card-item';
            cardEl.style.cursor = 'pointer';

            // カード画像を表示（未設定の場合は名前）
            cardEl.innerHTML = `<img src="${card.imagePath}" alt="${card.name}" style="width: 120px; height: 180px; object-fit: cover; border-radius: 6px;">
                                <div style="text-align:center; font-size:12px; margin-top:4px;">${index + 1}枚目</div>`;

            // クリック時に手札へ移動する関数を呼び出し
            cardEl.onclick = function() {
                drawVolNoiseToHand(index);
            };

            listContainer.appendChild(cardEl);
        });
    }

    // モーダル要素自体を表示する処理（必要に応じて既存のID名に合わせてください）
    let modalEl = document.getElementById('volNoiseModal');
    if (modalEl) modalEl.style.display = 'flex';
}
            // 手札に送る側の処理関数
function drawVolNoiseToHand(index) {
    if (!volNoiseCards || volNoiseCards.length <= index) return;

    // 指定位置のカードを1枚抽出
    let cardObj = volNoiseCards.splice(index, 1)[0];

    // 手札へ生成＆UI更新
    createGameCardToHand(cardObj.name, cardObj.imagePath);
    updateVolNoiseUI();

    // カードが残っていればモーダル再描画、無くなったら閉じる
    if (volNoiseCards.length > 0) {
        openVolNoiseModal();
    } else {
        closeVolNoiseModal();
    }
}
            
// モーダルを閉じる
function closeVolNoiseModal() {
    let modal = document.getElementById('volNoiseViewModal');
    if (modal) modal.style.display = 'none';
}
            
        function drawCard() {
            if (virtualDeck.length > 0) {
                let t = virtualDeck.shift();
                document.getElementById('deckCount').innerText = virtualDeck.length;
                createGameCardToHand(t.name, t.imagePath);
            } else {
                alert('山札がなくなりました！');
            }
        }

        function shuffleDeckBtn() {
            if (virtualDeck.length === 0) return alert('山札が空のためシャッフルできません。');
            for (let t = virtualDeck.length - 1; t > 0; t--) {
                let e = Math.floor(Math.random() * (t + 1));
                [virtualDeck[t], virtualDeck[e]] = [virtualDeck[e], virtualDeck[t]];
            }
            alert('山札をシャッフルしました！');
        }

        function trashAllHandBtn() {
            let t = document.getElementById('handArea');
            if (t.children.length === 0) return alert('手札がありません。');
            let list = Array.from(t.children);
            list.forEach(a => {
                trashCards.push({ name: a.getAttribute('data-cardname'), imagePath: a.getAttribute('data-imagepath') });
                a.remove();
            });
            updateTrashUI();
        }

        function mulliganBtn() {
            let t = document.getElementById('handArea');
            let e = t.children.length;
            let list = Array.from(t.children);
            list.forEach(a => {
                trashCards.push({ name: a.getAttribute('data-cardname'), imagePath: a.getAttribute('data-imagepath') });
                a.remove();
            });
            updateTrashUI();

            for (let a = virtualDeck.length - 1; a > 0; a--) {
                let n = Math.floor(Math.random() * (a + 1));
                [virtualDeck[a], virtualDeck[n]] = [virtualDeck[n], virtualDeck[a]];
            }

            let r = Math.min(e, virtualDeck.length);
            for (let c = 0; c < r; c++) {
                let o = virtualDeck.shift();
                createGameCardToHand(o.name, o.imagePath);
            }
            document.getElementById('deckCount').innerText = virtualDeck.length;
            alert(`手札を引き直しました！（${r}枚ドロー）`);
        }

        function resetGameBtn() {
            if (confirm('ゲーム状態を完全にリセットして山札を再構築しますか？')) {
                startGame();
            }
        }

        function openSearchModal(t) {
            currentSearchType = t;
            isSearchOpen = true;
            renderSearchList();
            document.getElementById('searchOverlay').style.display = 'flex';
        }

        function renderSearchList() {
            let t = document.getElementById('searchModalTitle');
            let e = document.getElementById('searchCardGrid');
            e.innerHTML = "";
            let a = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);

            t.innerText = (currentSearchType === 'deck') 
                ? `山札からサーチ (残り: ${virtualDeck.length}枚)` 
                : (currentSearchType === 'noise' ? `VOLノイズからサーチ (現在: ${volNoiseCards.length}枚)` : `トラッシュ確認 (現在: ${trashCards.length}枚)`);

            if (a.length === 0) {
                e.innerHTML = "<div style='color:#666; font-size:14px; padding:20px;'>カードがありません</div>";
                return;
            }

            a.forEach((cardData, n) => {
                let r = document.createElement('div');
                r.className = 'game-card';
                r.innerText = cardData.name;
                r.style.backgroundImage = `url('${cardData.imagePath}')`;
                r.setAttribute('draggable', 'true');

                r.ondragstart = function(ev) {
                    ev.dataTransfer.setData('text/plain', 'search-drag');
                    ev.dataTransfer.setData('search-index', n);
                    document.getElementById('searchOverlay').classList.add('dragging-mode');
                };

                r.ondragend = function(ev) {
                    document.getElementById('searchOverlay').classList.remove('dragging-mode');
                };

                r.addEventListener('touchstart', function(ev) {
                    ev.preventDefault();
                    dragTarget = ev.currentTarget;
                    let touch = ev.touches[0];
                    let c = dragTarget.getBoundingClientRect();
                    startX = touch.clientX - c.left;
                    startY = touch.clientY - c.top;
                    dragTarget.classList.add('dragging');
                    dragTarget.setAttribute('data-from-search', 'true');
                    dragTarget.setAttribute('data-search-index', n);
                    dragTarget.style.backgroundImage = `url('${cardData.imagePath}')`;
                    dragTarget.innerText = cardData.name;
                    document.body.appendChild(dragTarget);
                    if (isSearchOpen) document.getElementById('searchOverlay').classList.add('dragging-mode');
                }, { passive: false });

                r.onclick = function(ev) {
                    ev.stopPropagation();
                    if (currentSearchType === 'trash') {
                        pendingActionData = { name: cardData.name, imagePath: cardData.imagePath, index: n, list: a };
                        openActionMenu(`トラッシュ：${cardData.name}`, [
                            { label: "手札に加える", value: "hand" },
                            { label: "山札の一番上に戻す", value: "top" },
                            { label: "山札の一番下に戻す", value: "bottom" }
                        ], handleTrashChoice);
                    } else {
                        let cut = a.splice(n, 1)[0];
                        createGameCardToHand(cut.name, cut.imagePath);
                        updateDeckUI();
                        updateVolNoiseUI();
                        updateTrashUI();
                        renderSearchList();
                    }
                };
                e.appendChild(r);
            });
        }

        function handleTrashChoice(value) {
            if (!pendingActionData) return;
            let idx = pendingActionData.index;
            let list = pendingActionData.list;
            let cut = list.splice(idx, 1)[0];
            let letters = cut.name.toUpperCase();
            let suff = letters.slice(-1);

            if (value === "hand") {
                createGameCardToHand(cut.name, cut.imagePath);
            } else if (value === "top") {
                virtualDeck.unshift({ name: cut.name, suffix: suff, imagePath: cut.imagePath });
            } else if (value === "bottom") {
                virtualDeck.push({ name: cut.name, suffix: suff, imagePath: cut.imagePath });
            }

            document.getElementById('deckCount').innerText = virtualDeck.length;
            document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
            updateTrashUI();
            closeActionMenu();
            renderSearchList();
        }

        function handleOverlayClick(t) {
            if (t.target.id === "searchOverlay" || t.target.id === "searchCardGrid") {
                closeSearchModal();
            }
        }

        function closeSearchModal() {
            let t = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);
            if (t.length > 0 && currentSearchType !== 'trash') {
                for (let e = t.length - 1; e > 0; e--) {
                    let a = Math.floor(Math.random() * (e + 1));
                    [t[e], t[a]] = [t[a], t[e]];
                }
                if (currentSearchType === 'deck') alert('サーチを終了したため、山札を自動シャッフルしました。');
                else alert('サーチを終了したため、VOLノイズエリアを自動シャッフルしました。');
            }
            isSearchOpen = false;
            document.getElementById('searchOverlay').style.display = 'none';
        }

        function dropReturnToSearch(t) {
            t.preventDefault();
            document.getElementById('searchOverlay').classList.remove('dragging-mode');
            let e = t.dataTransfer.getData('text/plain');
            if (e && e !== 'search-drag') {
                let a = document.getElementById(e);
                if (a) returnCardFromHand(a);
            }
        }

        function returnCardFromHand(t) {
            let e = t.getAttribute('data-cardname');
            let a = t.getAttribute('data-imagepath');
            let letters = e.toUpperCase();
            let r = letters.slice(-1);

            if (currentSearchType === 'deck') {
                virtualDeck.push({ name: e, suffix: r, imagePath: a });
                document.getElementById('deckCount').innerText = virtualDeck.length;
            } else if (currentSearchType === 'noise') {
                volNoiseCards.push({ name: e, imagePath: a });
                document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
            } else {
                trashCards.push({ name: e, imagePath: a });
                updateTrashUI();
            }
            t.remove();
            renderSearchList();
        }

        function clickChangeBtn(t) {
            let e = document.getElementById(`change-btn-${t}`);
            if (selectedColumnIndex === null) {
                selectedColumnIndex = t;
                e.classList.add('selecting');
            } else if (selectedColumnIndex === t) {
                e.classList.remove('selecting');
                selectedColumnIndex = null;
            } else {
                for (let a = 1; a <= 3; a++) {
                    let n = document.getElementById(`frame-${selectedColumnIndex}-${a}`);
                    let r = document.getElementById(`frame-${t}-${a}`);
                    let c = Array.from(n.children);
                    let o = Array.from(r.children);
                    n.innerHTML = "";
                    r.innerHTML = "";
                    c.forEach(item => r.appendChild(item));
                    o.forEach(item => n.appendChild(item));
                }
                document.getElementById(`change-btn-${selectedColumnIndex}`).classList.remove('selecting');
                selectedColumnIndex = null;
            }
        }

        function saveData() {
            localStorage.setItem('misogi_mode', currentMode);
            localStorage.setItem('misogi_deck1', document.getElementById('deckInput1').value);
            localStorage.setItem('misogi_deck2', document.getElementById('deckInput2').value);
        }

        function selectMode(t) {
            currentMode = t;
            let e = document.getElementById('areaPlayer2');
            if (t === 1) {
                document.getElementById('btn1Deck').classList.add('active');
                document.getElementById('btn2Deck').classList.remove('active');
                document.getElementById('areaPlayer1').querySelector('.label-text').innerText = 'デッキリストを入力してください';
                e.style.display = 'none';
            } else {
                document.getElementById('btn1Deck').classList.remove('active');
                document.getElementById('btn2Deck').classList.add('active');
                document.getElementById('areaPlayer1').querySelector('.label-text').innerText = 'プレイヤー1のデッキ';
                e.style.display = 'flex';
            }
            saveData();
        }

        function clearInput(t) {
            document.getElementById(`deckInput${t}`).value = '';
            saveData();
        }

        function backToMenu() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('menuScreen').style.flexDirection = 'column';
            document.getElementById('menuScreen').style.display = 'flex';
        }

        function changeCounter(t, e) {
            counters[t] = Math.max(0, counters[t] + e);
            document.getElementById(`val-${t}`).innerText = counters[t];
        }

        function nextTurn() {
            turn++;
            document.getElementById('turnCount').innerText = turn;
        }

        function rollDice() {
            alert(`ダイスの出目: ${Math.floor(Math.random() * 6) + 1}`);
        }

        function triggerAction(t) {
            alert(`「${t}」が実行されました`);
        }
        // --- 山札ドラッグ終了時のエラー回避処理 ---
        function dragEndDeck(ev) {
            let overlay = document.getElementById('searchOverlay');
            if (overlay) {
                overlay.classList.remove('dragging-mode');
    }
}
    </script>

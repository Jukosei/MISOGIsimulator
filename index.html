<html lang="ja">
<head>

    <style>
        * { touch-action: none; box-sizing: border-box; }
        body { margin: 0; background: #121212; color: #fff; font-family: sans-serif; overflow-y: auto; overflow-x: hidden; }
        #setup-screen { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 100vw; min-height: 100vh; padding: 40px 20px; background: #1a1a1a; position: absolute; top: 0; left: 0; z-index: 100; }
        .main-title { font-size: 56px; font-weight: 900; letter-spacing: 10px; margin-bottom: 30px; text-align: center; text-shadow: 0 0 20px rgba(255,255,255,0.1); }
        .mode-select-row { display: flex; gap: 10px; margin-bottom: 30px; }
        .mode-btn { background: #333; color: #888; border: 1px solid #444; padding: 12px 24px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .mode-btn.active { background: #007aff; color: #fff; border-color: #007aff; }
        .deck-input-block { width: 100%; max-width: 1200px; display: flex; flex-direction: column; margin-bottom: 25px; }
        .input-label { font-size: 14px; color: #fff; font-weight: bold; margin-bottom: 8px; text-align: center; letter-spacing: 1px; }
        .textarea-container { width: 100%; margin-bottom: 10px; }
        textarea { width: 100%; height: 140px; background: #252525; border: 1px solid #444; color: #fff; padding: 15px; border-radius: 6px; font-size: 13px; line-height: 1.6; resize: none; word-break: break-all; }
        .clear-btn { background: #dc3545; color: #fff; border: none; padding: 12px 28px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; align-self: flex-start; }
        .start-btn { background: #e11d48; color: #fff; border: none; width: 280px; padding: 18px; font-size: 20px; font-weight: bold; cursor: pointer; border-radius: 4px; margin: 20px auto 0 auto; text-align: center; box-shadow: 0 4px 16px rgba(225, 29, 72, 0.4); }
        /* 全体レイアウト：ゲーム画面を左75%、右25%のグリッドで分割 */
#game-screen {
    #game-screen {
    display: none; /* 最初は隠しておく */
    grid-template-columns: 1fr 3fr;
    height: 100vh;
    width: 100vw;
｝
    background: #0c0c0e; /* より深い神椿の漆黒 */
    color: #fff;
    font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
    padding: 10px;
    box-sizing: border-box;
}

/* メインプレイエリア（ステージ、Direction、手札を縦に並べる） */
.main-play-area {
    display: flex;
    flex-direction: column;
    gap: 15px;
    padding-right: 10px;
}

/* 各ゾーンの共通コンテナ */
.zone-container {
    background: rgba(20, 20, 25, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.05); /* 極細の枠線 */
    border-radius: 6px;
    padding: 10px;
    position: relative;
}

/* タイトル（ステージ、Directionなどの文字） */
.zone-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #666; /* 目立ちすぎないグレー */
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 4px;
}

/* カードを並べる列（ステージ、Direction用） */
.field-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr); /* 綺麗な5等分スロット */
    gap: 10px;
    min-height: 160px; /* カードの高さに合わせる */
}

/* カードの受け皿（点線の枠） */
.pile {
    border: 1px dashed rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.02);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}
.pile:hover {
    border-color: #0070ff; /* ホバー時に神椿ブルーに光る */
    background: rgba(0, 112, 255, 0.05);
}

/* チェンジなどの補助テキスト */
.zone-sub-title {
    font-size: 10px;
    color: #444;
}

/* 手札エリア */
.hand-zone {
    display: flex;
    gap: 8px;
    min-height: 140px;
    overflow-x: auto; /* 手札が増えたら横スクロール */
    padding: 5px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 4px;
}

/* 右側サイドパネル（ボタンやカウンター） */
.side-panel {
    display: flex;
    flex-direction: row; /* ボタン群とメーター群を横に並べる */
    gap: 10px;
    background: #121216;
    border-left: 1px solid rgba(255, 255, 255, 0.1);
    padding: 10px;
    border-radius: 6px;
}

        #top-bar { height: 50px; background: #222; display: flex; align-items: center; justify-content: space-around; padding: 5px; border-bottom: 2px solid #333; }
        .player-board { position: absolute; width: 100%; height: 100%; display: none; flex-direction: column; padding: 10px; gap: 8px; }
        .player-board.active { display: flex; }
}
        .hand-zone { background: #1a1a2e; border: 1px solid #335; border-radius: 6px; padding: 8px; height: 115px; display: flex; gap: 8px; overflow-x: auto; touch-action: pan-x; }
        .bottom-row { display: flex; gap: 10px; align-items: flex-end; }
        .pile-container { display: flex; flex-direction: column; gap: 5px; }
        #trashA, #trashB { border-color: #633; background: #221515; color: #f87171; }
        .card { width: 64px; height: 90px; background: #e0e0e0; color: #000; border-radius: 5px; position: absolute; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 4px; font-size: 9px; font-weight: bold; text-align: center; box-shadow: 2px 2px 6px rgba(0,0,0,0.5); user-select: none; z-index: 10; transition: transform 0.1s; }
        .hand-zone .card { position: relative; top: 0 !important; left: 0 !important; flex-shrink: 0; }
        .card.standby { transform: rotate(90deg); border: 2px solid #ffaa00; }
        .card.face-down { background: #333 !important; color: #333; border: 1px solid #fff; }
        .card.persist { transform: rotate(15deg); border: 2px solid #10b981; box-shadow: 0 0 10px rgba(16,185,129,0.5); }
        .card-menu { display: flex; gap: 2px; width: 100%; justify-content: center; z-index: 20; }
        .card-btn { background: rgba(0,0,0,0.8); color: white; border: none; font-size: 7px; padding: 1px 3px; border-radius: 2px; }
        .badge { font-size: 6px; padding: 1px 2px; border-radius: 2px; color: #fff; position: absolute; top: 2px; left: 2px; z-index: 15; }
        .badge.Artist { background: #e11d48; }
        .badge.Direction { background: #2563eb; }
        .badge.Song { background: #10b981; }
        .badge.Magic { background: #7c3aed; }
        .system-btn { background: #444; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .system-btn.active { background: #007aff; }
        .system-btn.turn-end { background: #dc3545; }
    </style>
</head>

      <!-- 左側：メインプレイエリア -->

  </div> <!-- 215行目：#game-screen の閉じタグ -->
    <script>
        let chosenMode = 1; let currentPlayer = 'A';
        let gameData = { A: { deck: [], hand: [], trash: [], allCards: {} }, B: { deck: [], hand: [], trash: [], allCards: {} } };
        function toggleModeSelection(mode) {
    chosenMode = mode;
    
    // ボタンのアクティブクラス切り替え
    const m1 = document.getElementById('mode1');
    const m2 = document.getElementById('mode2');
    if (m1) m1.classList.toggle('active', mode === 1);
    if (m2) m2.classList.toggle('active', mode === 2);
    
    // プレイヤー2の入力ブロックとプレイヤー1のラベルを取得
    const p2Block = document.getElementById('player2-input-block');
    const p1Label = document.getElementById('label-deck1');
    
    // エラーを防ぐための安全ガード付き切り替え処理
    if (p2Block) {
        p2Block.style.display = (mode === 2) ? 'flex' : 'none';
    }
    if (p1Label) {
        p1Label.innerText = (mode === 2) ? 'プレイヤー1のデッキ' : 'デッキリストを / 区切りで入力してください';
    }
}
        function clearText(targetNum) { document.getElementById(`deckCodeArea${targetNum}`).value = ''; }
        function backToMenu() { document.getElementById('game-screen').style.display = 'none'; document.getElementById('setup-screen').style.display = 'flex'; }
        function parseCardCode(code) {
         // 判定用として、一時的に大文字にしてハイフンで分割する
         const prefix = code.toUpperCase().split('-')[0];
    
         // 文字列の最後の1文字を取り出してタイプを判定
         const typeChar = prefix.slice(-1); 
    
         switch(typeChar) {
             case 'A': return 'Artist';    // 歌手
             case 'D': return 'Direction'; // 矢印
             case 'S': return 'Song';      // 楽曲
             case 'M': return 'Magic';     // 魔術（装備）
             default: return 'Other';
    }
}

        function buildDeckData(p, cardCodes) {
            let loadedDeck = cardCodes.map((code, index) => ({ id: `${p}-${index}-${Date.now()}`, code: code, type: parseCardCode(code), isStandby: false, isFaceDown: false, isPersist: false }));
            gameData[p].deck = loadedDeck; gameData[p].hand = []; gameData[p].trash = []; gameData[p].allCards = {}; loadedDeck.forEach(c => { gameData[p].allCards[c.id] = c; });
            document.getElementById(`hand${p}`).innerHTML = ''; document.getElementById(`field${p}`).innerHTML = ''; updateDeckCount(p); updateTrashCount(p);
        }
        function pressStart() {
    // 【重要】この1行を関数の先頭に必ず追加してください！
    const input = document.getElementById('deck-input');

    // もし input が取得できなかったときのための安全ガード
    if (!input) {
        alert("入力エリアが見つかりません。");
        return;
    }

    // これ以降の既存の処理（deckTextの取得など）
    let deckText = input.value;
    
    // 以前お伝えした画面切り替え処理がここにあるか確認
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'grid'; // gridレイアウトに切り替え
    
    // 元々あったゲームセットアップの関数（もしあれば呼び出す）
    if (typeof runGameSetup === "function") {
        runGameSetup();
    }
}
        function switchPlayer(p) { currentPlayer = p; document.getElementById('boardA').classList.toggle('active', p === 'A'); document.getElementById('boardB').classList.toggle('active', p === 'B'); document.getElementById('tabA').classList.toggle('active', p === 'A'); document.getElementById('tabB').classList.toggle('active', p === 'B'); }
        function shuffleDeck(p) { let deck = gameData[p].deck; for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; } }
        function updateDeckCount(p) { document.getElementById(`deckPile${p}`).innerHTML = `山札:<br>${gameData[p].deck.length}枚`; }
        function updateTrashCount(p) { document.getElementById(`trash${p}`).innerHTML = `トラッシュ<br>${gameData[p].trash.length}枚`; }
        function runGameSetup(p) { shuffleDeck(p); gameData[p].hand = gameData[p].deck.splice(0, 7); renderHand(p); setTimeout(() => { mulliganProcess(p); }, 200); }
        function mulliganProcess(p) { let hasArtist = gameData[p].hand.some(card => card.type === 'Artist'); if (!hasArtist) { let confirmMulligan = confirm(`【プレイヤー${p}】手札にArtistがありません！確認後にOKで引き直します。`); if (confirmMulligan) { gameData[p].deck = gameData[p].deck.concat(gameData[p].hand); gameData[p].hand = []; shuffleDeck(p); gameData[p].hand = gameData[p].deck.splice(0, 7); renderHand(p); setTimeout(() => { mulliganProcess(p); }, 200); } } }
        function renderHand(p) { const handEl = document.getElementById(`hand${p}`); handEl.innerHTML = ''; gameData[p].hand.forEach(cardData => { handEl.appendChild(createCardElement(cardData)); }); updateDeckCount(p); }
        function drawCard(p) { if (gameData[p].deck.length === 0) return; gameData[p].hand.push(gameData[p].deck.shift()); renderHand(p); }
        function createCardElement(data) {
    const card = document.createElement('div'); 
    card.className = `card ${data.isStandby ? 'standby' : ''} ${data.isFaceDown ? 'face-down' : ''} ${data.isPersist ? 'persist' : ''}`; 
    card.id = data.id;
    
    // 通常はカードの型番画像を、裏向きの時はback.pngを表示する
    const imageSrc = data.isFaceDown ? 'images/back.png' : `images/${data.code}.png`;
    
    let menuButtons = `<button class="card-btn" onclick="rotateCard(event, '${data.id}')">状態</button>`; 
    if (data.type === 'Song') { 
        menuButtons += `<button class="card-btn" onclick="togglePersistSong(event, '${data.id}')">持続</button>`; 
    }
    
    // 背景を透明にして、枠線いっぱいに画像が表示されるようにHTMLを書き換え
    card.style.background = 'transparent';
    card.style.boxShadow = 'none';
    card.innerHTML = `
        <img src="${imageSrc}" alt="${data.code}" style="width:100%; height:100%; object-fit:contain; pointer-events:none; border-radius:5px;" onerror="this.style.display='none'; this.parentElement.style.background='#e0e0e0'; this.parentElement.innerText='${data.code}';">
        <div class="card-menu" style="position:absolute; bottom:2px; left:0; width:100%; display:flex; justify-content:center; gap:2px; z-index:30;">
            <button class="card-btn" onclick="playCard(event, '${data.id}')">場へ</button>
            ${menuButtons}
        </div>
    `;
    
    if (!gameData[currentPlayer].hand.some(c => c.id === data.id)) { makeElementDraggable(card); } 
    return card;
}

        function playCard(e, id) { e.stopPropagation(); let p = currentPlayer; let cardIndex = gameData[p].hand.findIndex(c => c.id === id); if (cardIndex === -1) return; let cardData = gameData[p].hand[cardIndex]; if (cardData.type === 'Artist') cardData.isStandby = true; gameData[p].hand.splice(cardIndex, 1); let newCard = createCardElement(cardData); let zone = document.getElementById(`field${p}`); newCard.style.left = (15 + zone.children.length * 5) + 'px'; newCard.style.top = (35 + zone.children.length * 3) + 'px'; zone.appendChild(newCard); renderHand(p); }
        function togglePersistSong(e, id) { e.stopPropagation(); let p = currentPlayer; let cardData = gameData[p].allCards[id]; cardData.isPersist = !cardData.isPersist; const cardEl = document.getElementById(id); cardEl.classList.toggle('persist', cardData.isPersist); }
        function endTurn() {
            let p = currentPlayer; let zone = document.getElementById(`field${p}`); let cardsInField = Array.from(zone.getElementsByClassName('card'));
            let artists = cardsInField.filter(el => gameData[p].allCards[el.id].type === 'Artist').map(el => { return { id: el.id, left: parseInt(el.style.left), top: parseInt(el.style.top) }; });
            cardsInField.forEach(el => { let cardData = gameData[p].allCards[el.id]; if (cardData.type === 'Artist') { cardData.isStandby = false; el.classList.remove('standby'); return; } if (cardData.type === 'Song') { if (cardData.isPersist) { return; } let cardLeft = parseInt(el.style.left); let isAttached = artists.some(art => { return Math.abs(art.left - cardLeft) < 30; }); if (isAttached) { gameData[p].trash.push(cardData); el.remove(); } } });
            updateTrashCount(p); alert(`【プレイヤー${p}】ターン終了しました。\n通常のSongをトラッシュし、持続Song・装備Magicは維持したまま、ArtistをActiveに戻しました。`);
        }
        function rotateCard(e, id) { e.stopPropagation(); document.getElementById(id).classList.toggle('standby'); }
        function makeElementDraggable(el) {
            let startX = 0, startY = 0, initialX = 0, initialY = 0; el.addEventListener('mousedown', dragStart); el.addEventListener('touchstart', dragStart, { passive: false });
            function dragStart(e) { if (e.target.tagName === 'BUTTON') return; el.parentElement.appendChild(el); const clientX = e.type === 'touchstart' ? e.touches.clientX : e.clientX; const clientY = e.type === 'touchstart' ? e.touches.clientY : e.clientY; startX = clientX; startY = clientY; initialX = el.offsetLeft; initialY = el.offsetTop; if (e.type === 'touchstart') { document.addEventListener('touchmove', dragMove, { passive: false }); document.addEventListener('touchend', dragEnd); } else { document.addEventListener('mousemove', dragMove); document.addEventListener('mouseup', dragEnd); } }
            function dragMove(e) { e.preventDefault(); const clientX = e.type === 'touchmove' ? e.touches.clientX : e.clientX; const clientY = e.type === 'touchmove' ? e.touches.clientY : e.clientY; el.style.left = (initialX + (clientX - startX)) + 'px'; el.style.top = (initialY + (clientY - startY)) + 'px'; }
            function dragEnd() { document.removeEventListener('mousemove', dragMove); document.removeEventListener('mouseup', dragEnd); document.removeEventListener('touchmove', dragMove); document.removeEventListener('touchend', dragEnd); }
        }
        // VOLノイズカウンターの数値を増減させる関数
       function adjustCounter(player, type, amount) {
            const targetId = `counter${player}-${type}`;
            const element = document.getElementById(targetId);
       if (element) {
            let currentVal = parseInt(element.innerText) || 0;
            let newVal = currentVal + amount;
            if (newVal < 0) newVal = 0; // マイナスにならないようにガード
            element.innerText = newVal;
    }
}

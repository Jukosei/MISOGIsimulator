<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>禊シミュレーター</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1a1a1a;
            --border-color: #333333;
            --btn-blue: #007bff;
            --btn-red: #dc3545;
            --btn-green: #28a745;
            --btn-accent: #e6002d;
            --text-color: #ffffff;
            --card-width: 120px;
            --card-height: 168px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: none;
            user-select: none;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            padding: 40px 20px;
            box-sizing: border-box;
            touch-action: auto;
        }

        .title {
            font-size: 54px;
            font-weight: bold;
            margin-bottom: 35px;
            letter-spacing: 6px;
        }

        .mode-selection {
            display: flex;
            gap: 10px;
            margin-bottom: 35px;
        }

        .mode-btn {
            background-color: #242424;
            color: #8a8a8a;
            border: 1px solid #3a3a3a;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .mode-btn.active {
            background-color: var(--btn-blue);
            color: #ffffff;
            border-color: var(--btn-blue);
        }

        .input-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .deck-code-area {
            width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .label-text {
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            align-self: center;
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            height: 160px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            padding: 15px;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
            outline: none;
        }

        .clear-btn {
            background-color: var(--btn-red);
            color: #ffffff;
            border: none;
            padding: 10px 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 12px;
        }

        .start-btn {
            background-color: var(--btn-accent);
            color: #ffffff;
            border: none;
            padding: 15px 100px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 45px;
            letter-spacing: 2px;
        }

        .game-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            background-color: #0d0d0d;
            box-sizing: border-box;
            padding: 10px;
            gap: 14px;
        }

        .left-panel {
            width: 160px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            box-sizing: border-box;
            padding-bottom: 15px;
        }

        .zone-box {
            background-color: var(--panel-bg);
            border: 2px dashed #444;
            border-radius: 6px;
            width: 150px;
            height: 225px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            position: relative;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .zone-box .count-display {
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0px 0px 4px #000, 0px 0px 4px #000;
        }

        .zone-label {
            font-size: 10px;
            color: #8a8a8a;
            margin-top: 5px;
            text-align: center;
            text-shadow: 0px 0px 4px #000, 0px 0px 4px #000;
        }

        .zone-box.drag-over {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: #fff;
        }

        /* 中央パネル：画面全体の幅をしっかり使う */
.center-panel {
    display: flex;
    flex-direction: column;
    height: 100%;
    gap: 12px;
    flex: 1;
    width: 100%;
    max-width: none;
    margin: 0;
    box-sizing: border-box;
}
        
.field-section-box {
    background-color: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 12px 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
}

.stage-box {
    flex: none;
}

.direction-box {
    flex: none;
}

        /* ゾーンを並べる行：中央寄せて列同士の間隔（gap）だけを縮める */
.field-row {
    display: flex;
    justify-content: center; /* 中央に寄せつつ */
    gap: 100px;              /* 列同士の間隔を16pxに固定（数値で調整可能） */
    align-items: flex-start;
    width: 100%;
    margin: 0 auto;
}

.row-label {
    font-size: 12px;
    color: #888;
    margin-bottom: 6px;
    font-weight: bold;
}

.slot-column-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    gap: 6px;
}

/* 3枚のカード枠を縦に広げて重ねる基準 */
.stage-placeholder-stack {
    position: relative !important;
    width: var(--card-width);
    height: 320px;
    margin-top: -2px;
}

/* 各フレームレイヤーの基本設定 */
.frame-layer {
    position: absolute !important;
    left: 0;
    width: var(--card-width);
    height: var(--card-height);
    border-radius: 6px;
    box-sizing: border-box;
}

/* ★ 通常時（カードがない時）の重なり順：レイヤー2をレイヤー3より手前に配置 */
.frame-layer.layer-1 { top: 0px; border: 2px dashed #1565c0; z-index: 10; opacity: 0.7; }
.frame-layer.layer-2 { top: 70px; border: 2px dashed #f9a825; z-index: 20 !important; opacity: 1.0 !important; }
.frame-layer.layer-3 { top: 140px; border: 2px dashed #6a1b9a; z-index: 5; opacity: 0.7; }

/* 活性化枠設定 */
.frame-layer.layer-active {
    pointer-events: auto !important;
    opacity: 1.0 !important;
}

/* ★ レイヤー3にカードが置かれたとき（.has-card または子要素に .game-card がある時）だけレイヤー2より前に出す */
.frame-layer.layer-3:has(.game-card),
.frame-layer.layer-3.has-card {
    z-index: 30 !important; /* カードがある時だけレイヤー2(z-index:20)の上に重ねる */
}

/* 点線ハイライト */
.frame-layer.drag-over {
    background-color: rgba(255, 255, 255, 0.1) !important;
    border: 2px dashed #ffffff !important;
    box-shadow: none !important;
    z-index: 100 !important;
}

/* 枠内に置かれたカード要素の基本設定 */
.frame-layer .game-card {
    position: relative;
    pointer-events: auto !important;
    z-index: 200 !important;
}
        
.direction-placeholder {
    width: var(--card-width);
    height: var(--card-height);
    border: 2px dashed #c62828;
    z-index: 2;
    border-radius: 6px;
    box-sizing: border-box;
    position: relative;
}

.direction-placeholder.drag-over {
    background-color: rgba(198, 40, 40, 0.1);
}

.frame-layer .game-card, .direction-placeholder .game-card {
    position: absolute;
    top: 0;
    left: 0;
    margin: 0;
    width: 100%;
    height: 100%;
}

.slot-tag-btn {
    background-color: #222;
    color: #aaa;
    font-size: 11px;
    border: 1px solid #444;
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: bold;
    z-index: 20;
}

.slot-tag-btn.selecting {
    background-color: var(--btn-accent);
    color: #fff;
    border-color: var(--btn-accent);
}
        
.hand-area {
    flex: 1; /* 余った下の空間をすべて埋める */
    min-height: 160px;
    background-color: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 12px;
    box-sizing: border-box;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-content: flex-start;
    touch-action: auto;
    overflow-y: auto; /* カードが増えた場合はスクロール */
}

        .game-card {
            width: var(--card-width);
            height: var(--card-height);
            background-color: #333;
            border: 1px solid #555;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0 !important;
            color: transparent !important;
            font-weight: bold;
            cursor: grab;
            box-sizing: border-box;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            text-shadow: 0px 0px 4px #000, 0px 0px 4px #000;
            touch-action: none;
        }

        .game-card.dragging {
            opacity: 0.8 !important;
            position: fixed !important;
            z-index: 9999 !important;
            pointer-events: none !important;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            transform: scale(1.05);
        }

        .control-panel {
            width: 170px;
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 6px;
            touch-action: auto;
        }

        .control-btn {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
        }

        .control-btn.orange { background-color: #ff9f00; }
        .control-btn.gray { background-color: #444; }

        .deck-zone {
    margin-top: auto;
    border: 2px dashed #444;
    background-color: #222;
    border-radius: 6px;

    /* 幅と高さをVOLノイズと同じサイズに強力固定 */
    width: 150px !important;
    height: 225px !important;
    box-sizing: border-box;

    /* 背景画像設定 */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-left: auto;
    margin-right: auto;

    /* ★ ここから下の2行を追加 ★ */
    position: relative;
    z-index: 10000;
}

        .deck-count { font-size: 64px; font-weight: bold; }
        .deck-label { font-size: 10px; color: #888; margin-top: 4px; }

        .counter-panel {
            width: 140px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            padding: 20px 5px;
            box-sizing: border-box;
            justify-content: flex-start;
            gap: 22px;
            height: 100%;
            touch-action: auto;
        }

        .counter-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .counter-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }

        .icon-vol { background-color: #ffd700; color: #000; }
        .icon-alpha { background-color: #ff69b4; }
        .icon-beta { background-color: #1e90ff; }
        .icon-omega { background-color: #9400d3; }

        .counter-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .counter-btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .counter-value {
            font-size: 28px;
            font-weight: bold;
            width: 35px;
            text-align: center;
        }

        .turn-display {
            margin-top: auto;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            font-size: 13px;
            color: #aaa;
        }

        .turn-display span {
            display: block;
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
        }

        .search-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            justify-content: center;
            align-items: flex-start;
            padding-top: 25px;
            box-sizing: border-box;
        }

        .search-overlay.dragging-mode {
            background-color: rgba(0, 0, 0, 0.2);
        }

        .search-overlay.dragging-mode .search-modal {
            opacity: 0.3;
        }

        .search-modal {
            background-color: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            width: 85%;
            max-width: 900px;
            height: 62%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            pointer-events: auto;
        }

        .search-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .search-modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        .search-modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 28px;
            cursor: pointer;
            font-weight: bold;
            pointer-events: auto;
        }

        .search-modal-close:hover { color: #fff; }

        .search-card-grid {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            content-align: flex-start;
            padding: 5px;
            pointer-events: auto;
        }

        .search-modal .game-card {
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .search-modal .game-card:hover {
            transform: scale(1.03);
            border-color: #fff;
        }

        .action-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.6);
            z-index: 20000;
            justify-content: center;
            align-items: center;
        }

        .action-box {
            background-color: #1e1e1e;
            border: 2px solid #555;
            border-radius: 8px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            max-width: 320px;
            width: 80%;
        }

        .action-title {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            text-align: center;
            margin-bottom: 6px;
            word-break: break-all;
        }

        .action-btn {
            width: 100%;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .action-btn:hover {
            background-color: var(--btn-blue);
            border-color: var(--btn-blue);
        }

        .action-btn.cancel {
            background-color: #444;
            margin-top: 6px;
        }

        .action-btn.cancel:hover {
            background-color: var(--btn-red);
            border-color: var(--btn-red);
        }

       .card-rotate-horizontal {
    transform: rotate(90deg) !important;
    transition: transform 0.2s ease;
}

        /* ディレクションエリアでタップ（薄暗く）状態にするスタイル */
.card-dimmed {
    filter: brightness(0.5) !important;
    transition: filter 0.2s ease;
}

        /* 自動消滅トースト通知のスタイル */
.toast-message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: rgba(0, 0, 0, 0.85);
    color: #ffffff;
    padding: 16px 32px;
    border-radius: 8px;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 2px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    pointer-events: none; /* ゲーム操作を邪魔しない */
    opacity: 0;
    transition: opacity 0.2s ease-in-out;
    z-index: 9999;
}

.toast-message.show {
    opacity: 1;
}

        /* ドラッグ中にオーバーレイ背景のクリック判定を透過させる */
#searchOverlay.dragging-mode {
    pointer-events: none !important;
}

/* モーダル内部のカード自体はドラッグ可能にする */
#searchOverlay .game-card {
    pointer-events: auto !important;
}

        /* ドラッグ中のみモーダル全体のマウス判定をオフにする */
#searchOverlay.dragging-mode,
.modal.dragging-mode {
    pointer-events: none !important;
}

        .counter-icon-img {
    width: 36px;
    height: 36px;
    object-fit: contain;
    border-radius: 50%;
    display: block;
    margin: 0 auto 4px auto;
}
        
    </style>
</head>
<body>
    <div class="menu-container" id="menuScreen">
        <div class="title">禊</div>
        <div class="mode-selection">
            <button class="mode-btn" id="btn1Deck" onclick="selectMode(1)">1デッキモード</button>
            <button class="mode-btn active" id="btn2Deck" onclick="selectMode(2)">2デッキ対戦モード</button>
        </div>
        <div class="input-section">
            <div class="deck-code-area" id="areaPlayer1">
                <div class="label-text" id="labelPlayer1">プレイヤー1のデッキ</div>
                <div class="textarea-container"><textarea id="deckInput1" oninput="saveDeckInputs()"></textarea></div>
                <button class="clear-btn" onclick="clearInput(1)">クリア</button>
            </div>
            <div class="deck-code-area" id="areaPlayer2">
                <div class="label-text">プレイヤー2のデッキ</div>
                <div class="textarea-container"><textarea id="deckInput2" oninput="saveDeckInputs()"></textarea></div>
                <button class="clear-btn" onclick="clearInput(2)">クリア</button>
            </div>
        </div>
        <button class="start-btn" onclick="startGame()">ゲーム開始</button>
    </div>

    <div class="game-screen" id="gameScreen">
        <!-- 左パネル（ノイズ・トラッシュ） -->
        <div class="left-panel">
            <div class="zone-box" id="voiNoiseZone" onclick="openVolNoiseModal()" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToVolNoise(event)" style="cursor: pointer;">
                <div class="count-display" id="voisecount">0</div>
                <div class="zone-label">VOI.ノイズ（確認はクリック）</div>
            </div>

            <div class="zone-box" id="trashZone" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToTrash(event)" onclick="openTrashModal()" style="cursor: pointer;">
                <div class="count-display" id="trashCount">0</div>
                <div class="zone-label">トラッシュ（確認はクリック）</div>
            </div>
        </div>

        <!-- 中央パネル（メインゲームフィールド） -->
        <div class="center-panel">
            
            <!-- 1. ステージエリア -->
            <div class="field-section-box stage-box">
                <div class="row-label">ステージ</div>
                <div class="field-row">

                    <!-- 列 0 -->
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-0" onclick="clickChangeBtn(0)">チェンジ</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1" id="frame-0-1" data-type="stage" data-col="0" data-layer="1" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,0,1)"></div>
                            <div class="frame-layer layer-2" id="frame-0-2" data-type="stage" data-col="0" data-layer="2" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,0,2)"></div>
                            <div class="frame-layer layer-3" id="frame-0-3" data-type="stage" data-col="0" data-layer="3" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,0,3)"></div>
                        </div>
                    </div>

                    <!-- 列 1 -->
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-1" onclick="clickChangeBtn(1)">チェンジ</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1" id="frame-1-1" data-type="stage" data-col="1" data-layer="1" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,1,1)"></div>
                            <div class="frame-layer layer-2" id="frame-1-2" data-type="stage" data-col="1" data-layer="2" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,1,2)"></div>
                            <div class="frame-layer layer-3" id="frame-1-3" data-type="stage" data-col="1" data-layer="3" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,1,3)"></div>
                        </div>
                    </div>

                    <!-- 列 2 -->
                    <div class="slot-column-wrapper">

            // ゲーム開始時・再スタート時の状態リセット処理
function startGame() {
    // ★ 1. 盤面（ステージ・ディレクション・チェンジ・スロット等）のカード要素をすべて削除
    const boardCards = document.querySelectorAll('.stage-zone *, .direction-zone *, [class*="stage"] *, [class*="direction"] *, [class*="change"] *, [class*="slot"] *');
    boardCards.forEach(el => {
        if (el.classList.contains('card') || el.classList.contains('game-card') || el.tagName === 'IMG' || el.getAttribute('draggable') === 'true') {
            el.remove();
        }
    });

    // ★ 2. VOLノイズおよびトラッシュ枠内のカード表示DOM要素を直接削除（山札deckは除く）
    const specialZoneCards = document.querySelectorAll('#volNoise *, .vol-noise *, [class*="volnoise"] *, #trash *, .trash *, [class*="trash"] *');
    specialZoneCards.forEach(el => {
        if (el.classList.contains('card') || el.classList.contains('game-card') || el.tagName === 'IMG') {
            el.remove();
        }
    });

    // ★ 3. トラッシュ・VOLノイズの配列データを完全クリア
    trashCards = [];
    volNoiseCards = [];
    if (typeof trash !== 'undefined' && Array.isArray(trash)) trash.length = 0;
    if (typeof volNoise !== 'undefined' && Array.isArray(volNoise)) volNoise.length = 0;

    // トラッシュ・VOLノイズのテキストカウントを 0 に設定
    const countIds = ['trashCount', 'trash-count', 'val-trash', 'volNoiseCount', 'vol-noise-count', 'volnoiseCount', 'val-volnoise'];
    countIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerText = '0';
    });

    // ★ 4. UI描画関数の安全呼び出し（トラッシュ・VOLノイズの表示を完全リセット）
    if (typeof updateTrashUI === 'function') updateTrashUI();
    if (typeof updateVolNoiseUI === 'function') updateVolNoiseUI();

    // 5. ターン数のリセット
    turn = 1;
    const turnEl = document.getElementById('turnCount');
    if (turnEl) turnEl.innerText = '1';

    // 6. マリガン回数のリセット
    mulliganCount = 0;
    const mulliganEl = document.getElementById('mulliganCount');
    if (mulliganEl) mulliganEl.innerText = '0';

    // 7. ダイス結果のクリア
    const lastDiceEl = document.getElementById('lastDiceResult');
    if (lastDiceEl) lastDiceEl.innerText = '-';
    const diceContainer = document.getElementById('diceDisplayArea');
    if (diceContainer) diceContainer.innerHTML = '';

    // 8. 各種魔力カウンター（VOL, alpha, beta, omega）のリセット
    const counterTypes = ['vol', 'alpha', 'beta', 'omega'];
    counterTypes.forEach(type => {
        const el = document.getElementById('val-' + type);
        if (el) el.innerText = '0';

        if (typeof counters === 'object' && counters !== null && counters[type] !== undefined) {
            counters[type] = 0;
        }
    });

    // 9. ターンエンドボタンのリセット
    isTurnEnded = false;
    const turnBtn = document.getElementById('turnBtn');
    if (turnBtn) {
        turnBtn.innerText = 'ターンエンド';
        turnBtn.style.backgroundColor = '#ffa500';
    }

    // ★ 10. デッキコードの取得と山札の生成（改行・スラッシュの両区切りに対応）
    let inputEl = document.getElementById('deckInput1');
    if (!inputEl || !inputEl.value.trim()) {
        return alert('デッキコードを入力してください！');
    }

    let t = inputEl.value;
    // 改行 または スラッシュ(/) で分割
    let e = t.split(/[\r\n/]+/).map(str => str.trim()).filter(str => str.length > 0);

    let a = [];
    e.forEach(codeStr => {
        let p = codeStr.split('-');
        if (p.length >= 2) {

// ★ 選択したカードの抽出共通ヘルパー
// ----------------------------------------------------
function getAndRemoveSelectedTrashCards() {

    // インデックスを降順（大きい順）にソートして安全に配列から削除
    const sortedIndices = Array.from(selectedTrashIndices).sort((a, b) => b - a);
    const removedCards = [];

    sortedIndices.forEach(idx => {
        const card = trashCards.splice(idx, 1)[0];
        removedCards.push(card);
    });

    selectedTrashIndices.clear();
    return removedCards;
}

// ★ 1. 選択したカードを山札に戻してシャッフル
function actionTrashToDeckAndShuffle() {
    const cards = getAndRemoveSelectedTrashCards();
    if (!cards) return;

    if (typeof virtualDeck !== 'undefined') {
        virtualDeck.push(...cards);
        // 山札全体をシャッフル
        for (let i = virtualDeck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [virtualDeck[i], virtualDeck[j]] = [virtualDeck[j], virtualDeck[i]];
        }
    }

    finishTrashAction(`${cards.length}枚のカードを山札に戻してシャッフルしました`);
}

// ★ 2. 選択したカードを山札の下（ボトム）に戻す
function actionTrashToDeckBottom() {
    const cards = getAndRemoveSelectedTrashCards();
    if (!cards) return;

    if (typeof virtualDeck !== 'undefined') {
        // 選択されたカードをそのまま山札の末尾（ボトム）へ追加
        virtualDeck.push(...cards);
    }

    finishTrashAction(`${cards.length}枚のカードを山札の下に戻しました`);
}

// ★ 3. 選択したカードを手札に加える
function actionTrashToHand() {
    const cards = getAndRemoveSelectedTrashCards();
    if (!cards) return;

    cards.forEach(card => {
        if (typeof createGameCardToHand === 'function') {
            createGameCardToHand(card.name, card.imagePath);
        }
    });

    finishTrashAction(`${cards.length}枚のカードを手札に加えました`);
}

// 山札へのドロップ処理（選択モーダルを開く）
function dropToDeck(ev) {
    ev.preventDefault();
    ev.currentTarget.classList.remove('drag-over');

    let dataText = ev.dataTransfer.getData('text/plain') || ev.dataTransfer.getData('text');
    let jsonText = ev.dataTransfer.getData('application/json');
    let data = null;

    try {
        if (jsonText) data = JSON.parse(jsonText);
        else if (dataText && dataText.startsWith('{')) data = JSON.parse(dataText);
    } catch (e) {
        // パース失敗時は無視
    }

    // ★ 山札確認モーダルからの移動処理（このときのみ選択モーダルを出さずに一番上＝トップに戻す）
        if (data && data.type === 'deck-view-card') {
            if (typeof deckViewCards !== 'undefined' && data.viewIndex !== undefined) {
                let cardObj = deckViewCards.splice(data.viewIndex, 1)[0];
                if (typeof renderDeckViewCards === 'function') renderDeckViewCards();
                if (typeof updateDeckViewButtonUI === 'function') updateDeckViewButtonUI();

                // ★ 山札の一番上（先頭）に戻す
                if (typeof virtualDeck !== 'undefined' && cardObj) {
                    virtualDeck.unshift(cardObj);
                    const deckCountEl = document.getElementById('deckCount');
                    if (deckCountEl) deckCountEl.innerText = virtualDeck.length;
                }

                return; // ★ 山札確認モーダルからのドラッグ時のみここで終了（下の選択モーダルを開かない）
            }
        }

    // 自分自身へのドロップは無視

    // トラッシュから山札に戻す場合

        let cardObj = trashCards.slice(-1)[0];

            type: 'trash',
            card: cardObj
        };
        openDeckReturnModal();
    }
    // 手札やフィールドの実体カードから戻す場合
    else if (dataText) {
        let cardEl = document.getElementById(dataText);
        if (cardEl) {
            let name = cardEl.getAttribute('data-cardname');
            let imagePath = cardEl.getAttribute('data-imagepath');
            if (name && imagePath) {
                pendingDeckReturn = {
                    type: 'element',
                    elementId: dataText,
                    card: { name: name, imagePath: imagePath }
                };
                openDeckReturnModal();
            }
        }
    }

// 戻し先の確定処理
function confirmDeckReturn(position) {
    if (!pendingDeckReturn) return;

    let card = pendingDeckReturn.card;

    // 1. 移動元データ・要素の削除処理
    if (pendingDeckReturn.type === 'trash') {
        trashCards.pop();
        updateTrashUI();
    } else if (pendingDeckReturn.type === 'element') {
        let el = document.getElementById(pendingDeckReturn.elementId);
        if (el) el.remove();
    }

    // 2. 山札への追加処理
    if (position === 'top') {
        virtualDeck.unshift(card); // 先頭（上）に追加
    } else if (position === 'bottom') {
        virtualDeck.push(card);    // 末尾（下）に追加
    } else if (position === 'shuffle') {
        virtualDeck.push(card);
        // Fisher-Yates シャッフル
        for (let i = virtualDeck.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [virtualDeck[i], virtualDeck[j]] = [virtualDeck[j], virtualDeck[i]];
        }
    }

    // 3. UIの更新と閉じる処理
    let deckCountEl = document.getElementById('deckCount');
    if (deckCountEl) deckCountEl.innerText = virtualDeck.length;

    closeDeckReturnModal();
}

function dropToSpecificFrame(ev, colIndex, targetLayer) {
    ev.preventDefault();
    ev.currentTarget.classList.remove('drag-over');

    let targetFrame = ev.currentTarget;

    // すでにカードが置かれている場合は重複配置を防ぐ
    if (targetFrame.querySelector('.game-card')) return;

    let dataText = ev.dataTransfer.getData('text/plain');
    let jsonText = ev.dataTransfer.getData('application/json');
    let data = null;

    try {
        if (jsonText) data = JSON.parse(jsonText);
        else if (dataText && dataText.startsWith('{')) data = JSON.parse(dataText);
    } catch (e) {}

    // カードのプレフィックス（ハイフン前の文字 A/M/S/D）を取得する関数
    const getCardType = (cardInput) => {
        if (!cardInput) return '';
        let codeStr = '';
        if (typeof cardInput === 'string') {
            codeStr = cardInput;
        } else if (typeof cardInput === 'object') {
            codeStr = cardInput.suffix || cardInput.name || cardInput.code || '';
        }
        return codeStr.trim().split('-')[0].toUpperCase();
    };

    const requiredTypes = { 1: 'M', 2: 'A', 3: 'S' };
    const expectedType = requiredTypes[targetLayer];

    let cardElementToAppend = null;

    // 1. 山札確認モーダルからのドロップ
    if (data && data.type === 'deck-view-card') {
        if (typeof deckViewCards !== 'undefined' && data.viewIndex !== undefined) {
            let cardObj = deckViewCards[data.viewIndex];
            if (cardObj && expectedType && !getCardType(cardObj).endsWith(expectedType)) {
                console.log(`【配置不可】Layer ${targetLayer} には ${expectedType} カードしか置けません`);
                return;
            }

            cardObj = deckViewCards.splice(data.viewIndex, 1)[0];
            if (typeof renderDeckViewCards === 'function') renderDeckViewCards();

            if (cardObj && typeof createGameCardToHand === 'function') {
                createGameCardToHand(cardObj.name, cardObj.imagePath);
                cardElementToAppend = document.getElementById(`card-id-${cardIdCounter - 1}`);
            }
        }
    }
    // 2. サーチ・ノイズ・山札モーダルからのドロップ
    else if (dataText === 'search-drag') {
        let rawIdx = ev.dataTransfer.getData('search-index');
        let idx = parseInt(rawIdx);
        let targetList = (currentSearchType === 'deck')
            ? virtualDeck
            : ((currentSearchType === 'noise') ? volNoiseCards : trashCards);

        if (!isNaN(idx) && targetList[idx]) {
            let cardObj = targetList[idx];
            if (cardObj && expectedType && !getCardType(cardObj).endsWith(expectedType)) {
                console.log(`【配置不可】Layer ${targetLayer} には ${expectedType} カードしか置けません`);
                return;
            }

            cardObj = targetList.splice(idx, 1)[0];
            createGameCardToHand(cardObj.name, cardObj.imagePath);
            cardElementToAppend = document.getElementById(`card-id-${cardIdCounter - 1}`);

            if (document.getElementById('deckCount')) document.getElementById('deckCount').innerText = virtualDeck.length;
            if (document.getElementById('volNoiseCount')) document.getElementById('volNoiseCount').innerText = volNoiseCards.length;

            updateTrashUI();
            renderSearchList();
        }
    }
    // 3. トラッシュゾーンからのドロップ
    else if (dataText === 'trash-zone-drag' && trashCards.length > 0) {
        let cardObj = trashCards[trashCards.length - 1];
        if (cardObj && expectedType && !getCardType(cardObj).endsWith(expectedType)) {
            console.log(`【配置不可】Layer ${targetLayer} には ${expectedType} カードしか置けません`);
            return;
        }

        cardObj = trashCards.pop();
        createGameCardToHand(cardObj.name, cardObj.imagePath);
        cardElementToAppend = document.getElementById(`card-id-${cardIdCounter - 1}`);
        updateTrashUI();
    }
    // 4. 手札・他ゾーンからの通常ドラッグ
    else if (dataText) {
        let n = document.getElementById(dataText);
        if (n) {
            let cardName = n.getAttribute('data-cardname') || n.getAttribute('data-cardcode') || n.innerText || '';
            let cardType = getCardType(cardName);

            if (expectedType && !cardType.endsWith(expectedType)) {
                console.log(`【配置不可】Layer ${targetLayer} には ${expectedType} カードしか置けません (ドラッグされた型: ${cardType})`);
                return;
            }

            cardElementToAppend = n;
        }
    }

    // ★ カードをレイヤー枠へ配置し、属性・回転・イベントを設定
    if (cardElementToAppend) {
        targetFrame.appendChild(cardElementToAppend);

        // 再ドラッグ可能にする
        cardElementToAppend.setAttribute('draggable', 'true');
        cardElementToAppend.ondragstart = function(e) {
            e.dataTransfer.setData('text/plain', cardElementToAppend.id);
        };

        // レイヤーごとの回転制御
        if (targetLayer === 2) {
            // ★ レイヤー2 (Aゾーン) のみ横回転を付与＆クリックで回転切り替え可能
            cardElementToAppend.classList.add('card-rotate-horizontal');
            
            cardElementToAppend.onclick = function(e) {
                e.stopPropagation();
                this.classList.toggle('card-rotate-horizontal');
            };

            // 同一列の Layer 1(M) ・ Layer 3(S) を解放
            let columnWrapper = targetFrame.closest('.slot-column-wrapper');
            if (columnWrapper) {
                let layer1 = columnWrapper.querySelector('.layer-1');
                let layer3 = columnWrapper.querySelector('.layer-3');

                if (layer1) layer1.classList.add('layer-active');
                if (layer3) layer3.classList.add('layer-active');
            } else {
                let frame1 = document.getElementById(`frame-${colIndex}-1`);
                let frame3 = document.getElementById(`frame-${colIndex}-3`);
                if (frame1) frame1.classList.add('layer-active');
                if (frame3) frame3.classList.add('layer-active');
            }
        } else {
            // ★ レイヤー1および3は常に縦向き固定（横回転を強制解除＆クリック回転無効化）
            cardElementToAppend.classList.remove('card-rotate-horizontal');
            cardElementToAppend.onclick = null;
        }
    }
}
            
       function dropToDirection(ev, slotIdx) {

        const prefix = codeStr.trim().split('-')[0].toUpperCase();
        return prefix === 'D' || prefix.endsWith('D');
    };

    // 1. 山札確認モーダルからのドロップ受け取り処理

    if (dataText === 'search-drag') {
        let rawIdx = ev.dataTransfer.getData('search-index');
        let idx = parseInt(rawIdx);
        let targetList = (currentSearchType === 'deck')
            ? virtualDeck
            : ((currentSearchType === 'noise') ? volNoiseCards : trashCards);

        let targetZone = ev.currentTarget;
        let existingCard = targetZone.querySelector('.game-card');

        if (!existingCard && !isNaN(idx) && targetList[idx]) {
            let cardObj = targetList[idx];

            if (cardObj && !isDCard(cardObj)) {
                console.log("【配置不可】ディレクション枠にはDカードしか置けません");
                return;
            }

            cardObj = targetList.splice(idx, 1)[0];
            createGameCardToHand(cardObj.name, cardObj.imagePath);

            let genCard = document.getElementById(`card-id-${cardIdCounter - 1}`);

            updateTrashUI();

    // 3. トラッシュゾーンからのドラッグ処理

    // 4. 通常のカード移動（手札エリアからのドラッグ）
    if (dataText) {

        let existingCard = targetZone.querySelector('.game-card');

        if (n && !existingCard) {
            let cardName = n.getAttribute('data-cardname') || n.getAttribute('data-cardcode') || n.innerText || '';

            // ★ ディレクションエリア（Dゾーン）へ置く時のみ Dカードチェック
            if (!isDCard(cardName)) {
                console.log("【配置不可】ディレクション枠にはDカードしか置けません");

function nextTime() {

    if (!t) return;

        updateTrashUI();

    let drawCount = 0;

        if (typeof virtualDeck !== 'undefined' && virtualDeck.length > 0) {

                }

                updateDeckUI();
                updateVolNoiseUI();
                updateTrashUI();
                renderSearchList();
            }
        };

        e.appendChild(r);
    });
}

        function handleTrashChoice(value) {
            if (!pendingActionData) return;
            let idx = pendingActionData.index;
            let list = pendingActionData.list;
            let cut = list.splice(idx, 1)[0];
            let letters = cut.name.toUpperCase();
            let suff = letters.slice(-1);

            if (value === "hand") {
                createGameCardToHand(cut.name, cut.imagePath);
            } else if (value === "top") {
                virtualDeck.unshift({ name: cut.name, suffix: suff, imagePath: cut.imagePath });
            } else if (value === "bottom") {
                virtualDeck.push({ name: cut.name, suffix: suff, imagePath: cut.imagePath });
            }

            document.getElementById('deckCount').innerText = virtualDeck.length;
            document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
            updateTrashUI();
            closeActionMenu();
            renderSearchList();
        }

        function handleOverlayClick(t) {
            if (t.target.id === "searchOverlay" || t.target.id === "searchCardGrid") {
                closeSearchModal();
            }
        }

        function closeSearchModal() {
    let t = (currentSearchType === 'deck') ? virtualDeck : ((currentSearchType === 'noise') ? volNoiseCards : trashCards);
    
    // 山札（deck）からサーチしていた場合のみ自動シャッフルを実施
    if (t && t.length > 0 && currentSearchType === 'deck') {
        for (let e = t.length - 1; e > 0; e--) {
            let a = Math.floor(Math.random() * (e + 1));
            [t[e], t[a]] = [t[a], t[e]];
        }
        showToast('SHUFFLE');
    }
    
    isSearchOpen = false;
    let overlay = document.getElementById('searchOverlay');
    if (overlay) overlay.style.display = 'none';
}
            
        function dropReturnToSearch(t) {
            t.preventDefault();
            document.getElementById('searchOverlay').classList.remove('dragging-mode');

            }
        }

        function returnCardFromHand(t) {
            let e = t.getAttribute('data-cardname');
            let a = t.getAttribute('data-imagepath');
            let letters = e.toUpperCase();
            let r = letters.slice(-1);

            if (currentSearchType === 'deck') {
                virtualDeck.push({ name: e, suffix: r, imagePath: a });
                document.getElementById('deckCount').innerText = virtualDeck.length;
            } else if (currentSearchType === 'noise') {
                volNoiseCards.push({ name: e, imagePath: a });
                document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
            } else {
                trashCards.push({ name: e, imagePath: a });
                updateTrashUI();
            }
            t.remove();
            renderSearchList();
        }

        function changeCounter(t, e) {
    // 1. タイプごとの最大値を定義
    const maxLimits = { vol: 10, alpha: 5, beta: 5, omega: 5 };
    const max = maxLimits[t] !== undefined ? maxLimits[t] : 99;

    // 2. DOM（画面の要素）から直接現在の数値を取得して計算
    const el = document.getElementById(`val-${t}`);
    let current = 0;

    if (el) {
        current = parseInt(el.innerText, 10) || 0;
    } else if (typeof counters === 'object' && counters !== null && counters[t] !== undefined) {
        current = counters[t];
    }

    // 3. 0以上、最大値以下に制限
    let newValue = Math.min(max, Math.max(0, current + e));

    // 4. 内部変数と画面の両方を即時更新
    if (typeof counters === 'object' && counters !== null) {
        counters[t] = newValue;
    }
    if (el) {
        el.innerText = newValue;
    }
}
            
        function nextTurn() {
    // 1. ターン数の加算
    turn++;
    const turnCountEl = document.getElementById('turnCount');
    if (turnCountEl) {
        turnCountEl.innerText = turn;
    }

    // 2. 横向きになっているカードを縦向きに戻す（.card-rotate-horizontal を解除）
    document.querySelectorAll('.game-card.card-rotate-horizontal').forEach(card => {
        card.classList.remove('card-rotate-horizontal');
    });

    // 3. 暗くなっているディレクションカード（または各カード）を明るく戻す
    document.querySelectorAll('.game-card.tapped, .game-card.exhausted, .direction-card.disabled').forEach(card => {
        card.classList.remove('tapped', 'exhausted', 'disabled');
        card.style.filter = ''; // スタイルで直接暗くしている場合のリセット
        card.style.opacity = '';
    });

    // 4. 紫色エリア（.layer-3）のカードをトラッシュに送る
    document.querySelectorAll('.layer-3').forEach(zone => {
        const cardsInLayer3 = Array.from(zone.querySelectorAll('.game-card'));
        cardsInLayer3.forEach(card => {
            const cardName = card.getAttribute('data-cardname') || card.getAttribute('data-name');
            const imagePath = card.getAttribute('data-imagepath') || card.getAttribute('data-image-path');

            // トラッシュ配列（trashCards）へ追加
            if (cardName) {
                trashCards.push({ name: cardName, imagePath: imagePath });
            }

            // 画面（DOM）から削除
            card.remove();
        });
    });

    // 5. トラッシュUIの更新
    if (typeof updateTrashUI === 'function') {
        updateTrashUI();
    }

    // 通知表示（任意）
    if (typeof showToast === 'function') {
        showToast(`ターン ${turn} が開始しました`);
    }
        }

function handleTurnBtnClick() {
    // 既存のボタンを取得（要素を増やさず、このテキストを書き換えます）
    const btn = document.getElementById('turnBtn');

    if (!isTurnEnded) {
        // --- 1. ターンエンド処理 ---
        isTurnEnded = true;

        if (btn) {
            btn.innerText = 'ターンスタート';
            btn.style.backgroundColor = '#28a745'; // 緑色に変更
        }

        // 横向きカードを縦向きに戻す
        document.querySelectorAll('.game-card.card-rotate-horizontal').forEach(card => {
            card.classList.remove('card-rotate-horizontal');
        });

        // 暗くなっているカード（ディレクション等）を明るく戻す
        document.querySelectorAll('.game-card.tapped, .game-card.exhausted, .direction-card.disabled').forEach(card => {
            card.classList.remove('tapped', 'exhausted', 'disabled');
            card.style.filter = '';
            card.style.opacity = '';
        });

        // 紫色エリア（.layer-3）のカードをトラッシュへ送る
        document.querySelectorAll('.layer-3').forEach(zone => {
            const cardsInLayer3 = Array.from(zone.querySelectorAll('.game-card'));
            cardsInLayer3.forEach(card => {
                const cardName = card.getAttribute('data-cardname') || card.getAttribute('data-name');
                const imagePath = card.getAttribute('data-imagepath') || card.getAttribute('data-image-path');

                if (cardName) {
                    trashCards.push({ name: cardName, imagePath: imagePath });
                }
                card.remove();
            });
        });

        if (typeof updateTrashUI === 'function') {
            updateTrashUI();
        }

    } else {
        // --- 2. ターンスタート処理 ---
        isTurnEnded = false;

        if (btn) {
            btn.innerText = 'ターンエンド';
            btn.style.backgroundColor = '#ffa500'; // オレンジ色に戻す
        }

        // ① ターン数加算
        turn++;
        const turnCountEl = document.getElementById('turnCount');
        if (turnCountEl) {
            turnCountEl.innerText = turn;
        }

        // ② 山札から1枚ドロー
        if (virtualDeck.length > 0) {
            const drawnCard = virtualDeck.shift();
            createGameCardToHand(drawnCard.name, drawnCard.imagePath);

            const deckCountEl = document.getElementById('deckCount');
            if (deckCountEl) {
                deckCountEl.innerText = virtualDeck.length;
            }
        }
    }
}

};

function rollDice() {
    const rollResult = Math.floor(Math.random() * 6) + 1;

    // ★ 1. 右側カウンターの表示を更新
    const lastDiceEl = document.getElementById('lastDiceResult');
    if (lastDiceEl) {
        lastDiceEl.innerText = rollResult;
    }

    // ★ 2. 画面中央へのダイス表示ポップアップ処理
    let container = document.getElementById('diceDisplayArea');
    if (!container) {
        container = document.createElement('div');
        container.id = 'diceDisplayArea';
        container.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 15px; z-index: 10000; pointer-events: none;';
        document.body.appendChild(container);
    }

    while (container.children.length >= 5) {
        container.removeChild(container.firstChild);
    }

    const diceEl = document.createElement('div');
    diceEl.style.cssText = `
        width: 100px;
        height: 100px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        border: 3px solid #ccc;
        opacity: 1;
    `;

    diceEl.innerHTML = `<svg width="85" height="85" viewBox="0 0 50 50">${diceSvgDots[rollResult]}</svg>`;
    container.appendChild(diceEl);

    setTimeout(() => {
        if (diceEl.parentElement) {
            diceEl.parentElement.removeChild(diceEl);
        }
    }, 2000);
}
            
        function drawBottomCard() {
    // 1. 山札が空でないか確認
    if (!virtualDeck || virtualDeck.length === 0) {
        if (typeof showToast === 'function') {
            showToast('山札にカードがありません');
        }
        return;
    }

    // 2. 配列の末尾（山札の一番下）から1枚取り出す
    const bottomCard = virtualDeck.pop();

    // 3. 手札へ追加
    if (typeof createGameCardToHand === 'function') {
        createGameCardToHand(bottomCard.name, bottomCard.imagePath);
    }

    // 4. 山札枚数表示（UI）を更新
    const deckCountEl = document.getElementById('deckCount');
    if (deckCountEl) {
        deckCountEl.innerText = virtualDeck.length;
    }
    if (typeof updateDeckCount === 'function') {
        updateDeckCount();
    }
}
            
            // モーダル管理用配列・状態フラグ
let deckViewCards = [];
let isDeckViewOpen = false;

// ★ 1. モーダルを開く（または再開する）
function openDeckViewModal() {
    // 完全に新規で開く場合（カードがまだない場合）のみ配列をリセット
    if (!isDeckViewOpen && deckViewCards.length === 0) {
        deckViewCards = [];
        const container = document.getElementById('deckViewContainer');
        if (container) container.innerHTML = '';
    }

    isDeckViewOpen = true;
    const modal = document.getElementById('deckViewModal');
    if (modal) modal.style.display = 'flex';

    updateDeckViewButtonUI();

}

// ★ 一時的に閉じる（×ボタン・背景クリック時）
function hideDeckViewModal() {
    isDeckViewOpen = false;
    const modal = document.getElementById('deckViewModal');
    if (modal) modal.style.display = 'none';

    updateDeckViewButtonUI();
}

// ★ 「山札の上を見る」ボタンの表記を動的に更新
function updateDeckViewButtonUI() {
    const btn = document.getElementById('peekDeckBtn') || document.querySelector("button[onclick*='openDeckViewModal']");
    if (btn) {
        if (!isDeckViewOpen && deckViewCards.length > 0) {
            btn.innerText = `山札確認中 (${deckViewCards.length}枚)`;
            btn.style.backgroundColor = '#e67e22'; // わかりやすいようオレンジ色に強調
        } else {
            btn.innerText = '山札の上を見る';
            btn.style.backgroundColor = '';
        }
    }
}

            // ★ 2. 山札クリック時にモーダルへ1枚追加
function peekDeckToModal() {
    if (!virtualDeck || virtualDeck.length === 0) {
        if (typeof showToast === 'function') showToast('山札にカードがありません');
        return true;
    }

    // 山札の先頭から1枚取得してモーダル用配列へ追加
    const card = virtualDeck.shift();
    deckViewCards.push(card);

    // 山札枚数UI更新
    const deckCountEl = document.getElementById('deckCount');
    if (deckCountEl) deckCountEl.innerText = virtualDeck.length;

    // モーダル内のカードを描画＆ボタンUI更新
    renderDeckViewCards();
    if (typeof updateDeckViewButtonUI === 'function') updateDeckViewButtonUI();
    return true;
}

// モーダル内のカード描画（ドラッグ＆ドロップ対応）
function renderDeckViewCards() {
    const container = document.getElementById('deckViewContainer');
    if (!container) return;
    container.innerHTML = '';

    deckViewCards.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card';
        cardEl.style.width = '100px';
        cardEl.style.height = '140px';
        cardEl.style.backgroundImage = `url('${card.imagePath || card.image || card}')`;
        cardEl.style.backgroundSize = 'cover';
        cardEl.style.borderRadius = '6px';
        cardEl.setAttribute('draggable', 'true');

        // ドラッグ開始時に情報をセット
        cardEl.ondragstart = function(ev) {
            const cardData = {
                type: 'deck-view-card',
                name: card.name,
                cardName: card.name,
                imagePath: card.imagePath,
                src: card.imagePath,
                viewIndex: index
            };
            ev.dataTransfer.setData('text/plain', JSON.stringify(cardData));
            ev.dataTransfer.setData('application/json', JSON.stringify(cardData));
        };

        container.appendChild(cardEl);
    });
}

            // ★ 3. 処理完了時のモーダルクローズ & 返却操作
function closeDeckView(actionType) {
    if (deckViewCards.length > 0) {
        if (actionType === 'shuffle') {
            // モーダル内のカードを山札へ戻して全体シャッフル
            virtualDeck.push(...deckViewCards);
            if (typeof shuffleDeckBtn === 'function') shuffleDeckBtn();
        } else if (actionType === 'top') {
            // ★ モーダル内のカードを山札の一番上（先頭）に戻す
            virtualDeck.unshift(...deckViewCards);
        } else if (actionType === 'bottom') {
            // モーダル内のカードを山札の一番下（末尾）に戻す
            virtualDeck.push(...deckViewCards);
        } else if (actionType === 'shuffleBottom') {
            // 残ったカード内だけでシャッフルしてからボトムへ追加
            for (let i = deckViewCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deckViewCards[i], deckViewCards[j]] = [deckViewCards[j], deckViewCards[i]];
            }
            virtualDeck.push(...deckViewCards);
        }
    }

    deckViewCards = [];
    isDeckViewOpen = false;

    // 表示更新とモーダル非表示
    const deckCountEl = document.getElementById('deckCount');
    if (deckCountEl) deckCountEl.innerText = virtualDeck.length;

    const modal = document.getElementById('deckViewModal');
    if (modal) modal.style.display = 'none';

    if (typeof updateDeckViewButtonUI === 'function') updateDeckViewButtonUI();
}

window.hideDeckViewModal = hideDeckViewModal;
window.drawBottomCard = drawBottomCard;
window.peekDeckToModal = peekDeckToModal;

if (typeof selectMode === 'function') window.selectMode = selectMode;

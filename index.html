<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>神椿TCG 自由配置シミュレーター</title>
    
    <style>
        /* ========================================================
           1. 画面全体の基本スタイル（スマホのスクロールを防止）
           ======================================================== */
        * { 
            touch-action: none; 
            box-sizing: border-box; 
        }
        body { 
            margin: 0; 
            background: #121212; 
            color: #fff; 
            font-family: sans-serif; 
            overflow: hidden; 
        }
        
        /* ========================================================
           2. 最上部コントロールバー（メニューとデッキコード入力）
           ======================================================== */
        #top-bar { 
            height: auto; 
            min-height: 50px; 
            background: #222; 
            display: flex; 
            flex-direction: column; 
            padding: 5px; 
            gap: 5px; 
            border-bottom: 2px solid #333; 
        }
        .bar-row { 
            display: flex; 
            width: 100%; 
            justify-content: space-around; 
            align-items: center; 
            gap: 5px; 
        }
        .code-input-area { 
            display: flex; 
            width: 100%; 
            padding: 0 5px; 
            gap: 5px; 
        }
        input[type="text"] { 
            flex: 1; 
            background: #333; 
            border: 1px solid #555; 
            color: #fff; 
            padding: 6px; 
            border-radius: 4px; 
            font-size: 11px; 
        }
        
        /* ボタン全般のスタイル */
        button { 
            background: #444; 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            cursor: pointer; 
            border-radius: 4px; 
            font-size: 11px; 
            font-weight: bold; 
        }
        button.active { background: #007aff; }      /* 選択中のプレイヤー */
        button.action-btn { background: #28a745; }  /* ゲーム開始 */
        button.turn-end-btn { background: #dc3545; }/* ターン終了 */

        /* ========================================================
           3. プレイ盤面（メインフィールド・手札・山札）
           ======================================================== */
        #table { 
            position: relative; 
            height: calc(100vh - 85px); 
            width: 100vw; 
        }
        .player-board { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            display: none; 
            flex-direction: column; 
            padding: 10px; 
            gap: 8px; 
        }
        .player-board.active { 
            display: flex; 
        }
        
        /* ゾーンのタイトル文字 */
        .zone-title { 
            font-size: 10px; 
            color: #888; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 2px; 
        }
        
        /* 自由配置メインフィールド */
        .field-zone { 
            background: rgba(255,255,255,0.03); 
            border: 1px dashed #444; 
            border-radius: 6px; 
            padding: 5px; 
            min-height: 240px; 
            position: relative; 
        }
        
        /* 手札置き場（カードが増えると横スクロール可能） */
        .hand-zone { 
            background: #1a1a2e; 
            border: 1px solid #335; 
            border-radius: 6px; 
            padding: 8px; 
            height: 115px; 
            display: flex; 
            gap: 8px; 
            overflow-x: auto; 
            touch-action: pan-x; 
        }
        
        /* 山札とトラッシュが並ぶ下部エリア */
        .bottom-row { 
            display: flex; 
            gap: 10px; 
            align-items: flex-end; 
        }
        .pile-container { 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
        }
        .pile { 
            width: 64px; 
            height: 90px; 
            border: 2px dashed #555; 
            border-radius: 6px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 10px; 
            color: #aaa; 
            background: #151515; 
            text-align: center; 
            position: relative; 
        }
        #trashA, #trashB { 
            border-color: #633; 
            background: #221515; 
            color: #f87171; 
        }

        /* ========================================================
           4. カードの見た目と状態デザイン
           ======================================================== */
        .card {
            width: 64px; 
            height: 90px; 
            background: #e0e0e0; 
            color: #000;
            border-radius: 5px; 
            position: absolute;
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center;
            padding: 4px; 
            font-size: 9px; 
            font-weight: bold; 
            text-align: center;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.5); 
            user-select: none; 
            z-index: 10;
            transition: transform 0.1s;
        }
        /* 手札の中にあるときは、絶対配置（重ね合わせ）を解除して横並びにする */
        .hand-zone .card { 
            position: relative; 
            top: 0 !important; 
            left: 0 !important; 
            flex-shrink: 0; 
        }
        
        /* カードの状態変化（横向き・裏返し・持続） */
        .card.standby { transform: rotate(90deg); border: 2px solid #ffaa00; }  /* Standby状態（横向き） */
        .card.face-down { background: #333 !important; color: #333; border: 1px solid #fff; } /* 裏向き */
        .card.persist { transform: rotate(15deg); border: 2px solid #10b981; box-shadow: 0 0 10px rgba(16,185,129,0.5); } /* 持続Song状態 */
        
        /* カード内のミニメニューボタン */
        .card-menu { 
            display: flex; 
            gap: 2px; 
            width: 100%; 
            justify-content: center; 
            z-index: 20; 
        }
        .card-btn { 
            background: rgba(0,0,0,0.8); 
            color: white; 
            border: none; 
            font-size: 7px; 
            padding: 1px 3px; 
            border-radius: 2px; 
        }
        
        /* カードタイプ別の色付きバッジ */
        .badge { 
            font-size: 6px; 
            padding: 1px 2px; 
            border-radius: 2px; 
            color: #fff; 
            position: absolute; 
            top: 2px; 
            left: 2px; 
            z-index: 15; 
        }
        .badge.Artist { background: #e11d48; }    /* 赤 */
        .badge.Direction { background: #2563eb; } /* 青 */
        .badge.Song { background: #10b981; }      /* 緑 */
        .badge.Magic { background: #7c3aed; }     /* 紫 */
    </style>
</head>
<body>

    <!-- 最上部メニュー -->
    <div id="top-bar">
        <div class="bar-row">
            <button id="tabA" class="active" onclick="switchPlayer('A')">プレイヤーA</button>
            <button id="tabB" onclick="switchPlayer('B')">プレイヤーB</button>
            <button class="action-btn" onclick="startGame()">ゲーム開始</button>
            <button class="turn-end-btn" onclick="endTurn()">ターン終了</button>
        </div>
        <div class="code-input-area">
            <input type="text" id="deckCodeInput" placeholder="型番コードを入力（例: AA-01/AM-02/AS-01/AD-01...）">
            <button onclick="loadDeckFromCode()">コード読込</button>
        </div>
    </div>

    <div id="table">
        <!-- プレイヤーAの盤面 -->
        <div id="boardA" class="player-board active">
            <div>
                <div class="zone-title">メインフィールド (カードを自由にドラッグして重ねてください)</div>
                <div id="fieldA" class="field-zone"></div>
            </div>
            
            <div class="bottom-row">
                <div class="pile-container">
                    <div class="zone-title">トラッシュ</div>
                    <div id="trashA" class="pile">トラッシュ<br>0枚</div>
                </div>
                <div class="pile-container">
                    <div class="zone-title">山札</div>
                    <div id="deckPileA" class="pile" onclick="drawCard('A')">山札:<br>0枚</div>
                </div>
                <div style="flex: 1;">
                    <div class="zone-title">手札</div>
                    <div id="handA" class="hand-zone"></div>
                </div>
            </div>
        </div>

        <!-- プレイヤーBの盤面 -->
        <div id="boardB" class="player-board">
            <div>
                <div class="zone-title">メインフィールド (カードを自由にドラッグして重ねてください)</div>
                <div id="fieldB" class="field-zone"></div>
            </div>
            
            <div class="bottom-row">
                <div class="pile-container">
                    <div class="zone-title">トラッシュ</div>
                    <div id="trashB" class="pile">トラッシュ<br>0枚</div>
                </div>
                <div class="pile-container">
                    <div class="zone-title">山札</div>
                    <div id="deckPileB" class="pile" onclick="drawCard('B')">山札:<br>0枚</div>
                </div>
                <div style="flex: 1;">
                    <div class="zone-title">手札</div>
                    <div id="handB" class="hand-zone"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================================
         5. シミュレーター制御プログラム（JavaScript）
         ======================================================== -->
    <script>
        // グローバルデータ管理
        let currentPlayer = 'A';
        let gameData = {
            A: { deck: [], hand: [], trash: [], allCards: {} },
            B: { deck: [], hand: [], trash: [], allCards: {} }
        };

        // 【ルール機能】型番の2文字目からカードタイプを判別する
        function parseCardCode(code) {
            const typeChar = code.charAt(1).toUpperCase(); 
switch(typeChar) {case 'A':return 'Artist';    // 歌手case 'D':return 'Direction'; // 矢印case 'S':return 'Song';      // 楽曲case 'M':return 'Magic';     // 魔術（装備）default:return 'Other';}}// デッキコード（型番）をテキストボックスから読み込むfunction loadDeckFromCode() {const input = document.getElementById('deckCodeInput').value.trim();if (!input) { alert("デッキコードを入力してください。"); return; }// スラッシュで分割して大文字に統一const cardCodes = input.split('/').map(c => c.trim().toUpperCase()).filter(c => c.length > 0);if (cardCodes.length !== 60) { alert(デッキは60枚である必要があります。（現在: ${cardCodes.length}枚）); return; }let p = currentPlayer;let loadedDeck = cardCodes.map((code, index) => ({id: ${p}-${index}-${Date.now()},code: code,type: parseCardCode(code),isStandby: false,isFaceDown: false,isPersist: false}));// 各種データの初期化gameData[p].deck = loadedDeck;gameData[p].hand = [];gameData[p].trash = [];gameData[p].allCards = {};// あとから全カードを参照できるようにマップへ登録loadedDeck.forEach(c => { gameData[p].allCards[c.id] = c; });// 画面表示をまっさらにリセットdocument.getElementById(hand${p}).innerHTML = '';document.getElementById(field${p}).innerHTML = '';updateDeckCount(p);updateTrashCount(p);alert(【プレイヤー${p}】デッキコードを読み込みました！);}// 表示するプレイヤー（A/B面）を切り替えるボタンfunction switchPlayer(p) {currentPlayer = p;document.getElementById('boardA').classList.toggle('active', p === 'A');document.getElementById('boardB').classList.toggle('active', p === 'B');document.getElementById('tabA').classList.toggle('active', p === 'A');document.getElementById('tabB').classList.toggle('active', p === 'B');}// 山札をシャッフルするfunction shuffleDeck(p) {let deck = gameData[p].deck;for (let i = deck.length - 1; i > 0; i--) {const j = Math.floor(Math.random() * (i + 1));[deck[i], deck[j]] = [deck[j], deck[i]];}}// 枚数カウンター表示の書き換えfunction updateDeckCount(p) { document.getElementById(deckPile${p}).innerHTML = 山札:<br>${gameData[p].deck.length}枚; }function updateTrashCount(p) { document.getElementById(trash${p}).innerHTML = トラッシュ<br>${gameData[p].trash.length}枚; }// ゲームの開始（初期ドロー7枚とマリガン確認）function startGame() {let p = currentPlayer;if (gameData[p].deck.length !== 60) { alert(先にデッキコードを読み込んでください。); return; }shuffleDeck(p);gameData[p].hand = gameData[p].deck.splice(0, 7); // 7枚引くrenderHand(p);// 描画後にマリガンダイアログを起動setTimeout(() => { mulliganProcess(p); }, 100);}// 【ルール機能】手動マリガン（Artistの有無を確認させる）function mulliganProcess(p) {let hasArtist = gameData[p].hand.some(card => card.type === 'Artist');if (!hasArtist) {let confirmMulligan = confirm(【プレイヤー${p}】手札にArtistがありません！\n画面共有などで相手に手札を確認してもらった後、OKを押して引き直してください。);if (confirmMulligan) {gameData[p].deck = gameData[p].deck.concat(gameData[p].hand); // 手札を山札に戻すgameData[p].hand = [];shuffleDeck(p);gameData[p].hand = gameData[p].deck.splice(0, 7); // 再度7枚引くrenderHand(p);setTimeout(() => { mulliganProcess(p); }, 100);}}}// 手札エリアにカードを描画function renderHand(p) {const handEl = document.getElementById(hand${p});handEl.innerHTML = '';gameData[p].hand.forEach(cardData => { handEl.appendChild(createCardElement(cardData)); });updateDeckCount(p);}// 山札をクリックしたときの1枚通常ドローfunction drawCard(p) {if (gameData[p].deck.length === 0) return;gameData[p].hand.push(gameData[p].deck.shift());renderHand(p);}// カード要素（HTML部品）を作る共通関数function createCardElement(data) {const card = document.createElement('div');card.className = card ${data.isStandby ? 'standby' : ''} ${data.isFaceDown ? 'face-down' : ''} ${data.isPersist ? 'persist' : ''};card.id = data.id;// メメニューボタンの動的生成（Songの場合だけ持続ボタンを配置）let menuButtons = <button class="card-btn" onclick="rotateCard(event, '${data.id}')">状態</button>;if (data.type === 'Song') {menuButtons += <button class="card-btn" onclick="togglePersistSong(event, '${data.id}')">持続</button>;}card.innerHTML = <span class="badge ${data.type}">${data.type}</span> <div style="font-size:11px; margin-top:14px;">${data.code}</div> <div class="card-menu"> <button class="card-btn" onclick="playCard(event, '${data.id}')">場へ</button> ${menuButtons} </div>;// すでに場に出ているカードにのみ、マウス/タッチのドラッグ移動機能を組み込むif (!gameData[currentPlayer].hand.some(c => c.id === data.id)) { makeElementDraggable(card); }return card;}// 手札の「場へ」を押したときの処理（フィールド左上に生成）function playCard(e, id) {e.stopPropagation();let p = currentPlayer;let cardIndex = gameData[p].hand.findIndex(c => c.id === id);if (cardIndex === -1) return;let cardData = gameData[p].hand[cardIndex];if (cardData.type === 'Artist') cardData.isStandby = true; // アーティストは初期横向きgameData[p].hand.splice(cardIndex, 1); // 手札データから除外let newCard = createCardElement(cardData);// 重なりを防ぐため、少しずつずらして左上にポンと置くlet zone = document.getElementById(field${p});newCard.style.left = (15 + zone.children.length * 5) + 'px';newCard.style.top = (35 + zone.children.length * 3) + 'px';zone.appendChild(newCard);renderHand(p);}// Songカード用の「持続フラグ」切り替えfunction togglePersistSong(e, id) {e.stopPropagation();let p = currentPlayer;let cardData = gameData[p].allCards[id];cardData.isPersist = !cardData.isPersist;const cardEl = document.getElementById(id);cardEl.classList.toggle('persist', cardData.isPersist);}// 【ルール機能】ターン終了時の一括自動判定トラッシュfunction endTurn() {let p = currentPlayer;let zone = document.getElementById(field${p});let cardsInField = Array.from(zone.getElementsByClassName('card'));// 1. まず場に存在する全Artistカードの位置（座標）を割り出すlet artists = cardsInField.filter(el => gameData[p].allCards[el.id].type === 'Artist').map(el => {return { id: el.id, left: parseInt(el.style.left), top: parseInt(el.style.top) };});// 2. 場の全カードをスキャンして自動回収・状態復旧を行うcardsInField.forEach(el => {let cardData = gameData[p].allCards[el.id];// Artistは横向き（Standby）を解除してActiveに縦起こしif (cardData.type === 'Artist') {cardData.isStandby = false;el.classList.remove('standby');return;}// 通常のSongのみを回収（持続SongやMagicはそのまま場に維持）if (cardData.type === 'Song') {if (cardData.isPersist) { return; } // 「持続」がONならスキップlet cardLeft = parseInt(el.style.left);// 横軸（左右）のズレが30px以内のArtistがいれば、そのArtistに重ねられたSongとみなすlet isAttached = artists.some(art => { return Math.abs(art.left - cardLeft) < 30; });if (isAttached) {gameData[p].trash.push(cardData); // トラッシュデータへ蓄積el.remove();                      // 画面から消去}}});updateTrashCount(p);alert(【プレイヤー${p}】ターン終了しました。\n通常のSongをトラッシュし、持続Song・装備Magicは維持したまま、ArtistをActiveに戻しました。);}// カードの「状態」ボタン（手動でのタップ/アンタップ切り替え用）function rotateCard(e, id) {e.stopPropagation();document.getElementById(id).classList.toggle('standby');}// ========================================================// 6. 高級ドラッグ＆ドロップエンジン（PCマウス・スマホタッチ両対応）// ========================================================function makeElementDraggable(el) {let startX = 0, startY = 0, initialX = 0, initialY = 0;el.addEventListener('mousedown', dragStart);el.addEventListener('touchstart', dragStart, { passive: false });function dragStart(e) {if (e.target.tagName === 'BUTTON') return; // メニューボタンを押した時はドラッグしないel.parentElement.appendChild(el); // ドラッグしたカードを最前面へ持ってくるconst clientX = e.type === 'touchstart' ? e.touches.clientX : e.clientX;const clientY = e.type === 'touchstart' ? e.touches.clientY : e.clientY;startX = clientX;startY = clientY;initialX = el.offsetLeft;initialY = el.offsetTop;if (e.type === 'touchstart') {document.addEventListener('touchmove', dragMove, { passive: false });document.addEventListener('touchend', dragEnd);} else {document.addEventListener('mousemove', dragMove);document.addEventListener('mouseup', dragEnd);}}function dragMove(e) {e.preventDefault(); // スマホ全体の画面引っ張りスクロールを完全防御const clientX = e.type === 'touchmove' ? e.touches.clientX : e.clientX;const clientY = e.type === 'touchmove' ? e.touches.clientY : e.clientY;// カード移動の計算el.style.left = (initialX + (clientX - startX)) + 'px';el.style.top = (initialY + (clientY - startY)) + 'px';}function dragEnd() {// 各種ドラッグ用リスナーを解除document.removeEventListener('mousemove', dragMove);document.removeEventListener('mouseup', dragEnd);document.removeEventListener('touchmove', dragMove);document.removeEventListener('touchend', dragEnd);}}

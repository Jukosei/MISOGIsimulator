<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: sans-serif;
            background-color: #222;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 山札エリアのドラッグ許可 */
        .deck-zone {
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #menuScreen, #gameScreen {
            display: flex;
            width: 100%;
            height: 100vh;
        }
        #gameScreen { display: none; }
        
        .drag-over {
            outline: 2px dashed #ff0;
        }

        .dragging-mode {
            pointer-events: auto !important;
        }

        .game-card.dragging {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.8;
        }

        .action-overlay, .search-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 900;
            justify-content: center;
            align-items: center;
        }

        .action-box, .search-modal {
            background: #333;
            padding: 20px;
            border-radius: 8px;
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
        }

        .control-btn.selecting {
            background-color: #ff9800 !important;
        }
    </style>
</head>
<body>

    <div id="menuScreen" style="display:flex; flex-direction:column; padding:20px;">
        <h2>デッキ設定</h2>
        <div id="areaPlayer1">
            <span class="label-text">プレイヤー1のデッキ</span>
            <textarea id="deckInput1" style="width:100%; height:80px;"></textarea>
            <button onclick="clearInput(1)">クリア</button>
        </div>
        <div id="areaPlayer2" style="margin-top:10px;">
            <span class="label-text">プレイヤー2のデッキ</span>
            <textarea id="deckInput2" style="width:100%; height:80px;"></textarea>
            <button onclick="clearInput(2)">クリア</button>
        </div>
        <div style="margin-top:10px;">
            <button id="btn1Deck" onclick="selectMode(1)">1人プレイ</button>
            <button id="btn2Deck" onclick="selectMode(2)">2人プレイ</button>
        </div>
        <button onclick="startGame()" style="margin-top:20px; padding:10px; font-size:16px;">ゲーム開始</button>
    </div>

    <div id="gameScreen">
        <div class="field-main">
            <div class="field-section-box direction-box">
                <div class="field-row">
                    <div class="direction-placeholder" id="dir-slot-0" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToDirection(event,0)"></div>
                    <div class="direction-placeholder" id="dir-slot-1" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToDirection(event,1)"></div>
                    <div class="direction-placeholder" id="dir-slot-2" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToDirection(event,2)"></div>
                    <div class="direction-placeholder" id="dir-slot-3" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToDirection(event,3)"></div>
                    <div class="direction-placeholder" id="dir-slot-4" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToDirection(event,4)"></div>
                </div>
            </div>
            <div class="hand-area" id="handArea" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToHand(event)"></div>
        </div>

        <div class="control-panel">
            <button class="control-btn" onclick="shuffleDeckBtn()">山札シャッフル</button>
            <button class="control-btn" onclick="openSearchModal('deck')">山札からサーチ</button>
            <button class="control-btn" onclick="openSearchModal('noise')">VOLノイズからサーチ</button>
            <button class="control-btn" onclick="trashAllHandBtn()">手札を全てトラッシュ</button>
            <button class="control-btn" onclick="mulliganBtn()">マリガン</button>
            <button class="control-btn" onclick="resetGameBtn()">リセット</button>
            <button class="control-btn orange" onclick="nextTurn()">ターンエンド</button>
            <button class="control-btn" onclick="rollDice()">ダイスを振る</button>
            <button class="control-btn" onclick="triggerAction('山札の下から1枚ドロー')">山札の下から1枚ドロー</button>
            <button class="control-btn gray" style="margin-top:10px;" onclick="backToMenu()">メニュー戻る</button>

            <!-- 山札ゾーン -->
            <div class="deck-zone" draggable="true" id="deckZone" ondragstart="dragStartDeck(event)" ondragend="dragEndDeck(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToDeckZone(event)" onclick="drawCard()">
                <div class="deck-count" id="deckCount">0</div>
                <div class="deck-label">山札 (クリックドロー/ドラッグ移動・戻し)</div>
            </div>

            <!-- トラッシュ / VOLノイズ ゾーン -->
            <div id="trashZone" style="width:100px; height:60px; border:1px solid #fff; margin-top:10px;" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToTrash(event)">
                トラッシュ (<span id="trashCount">0</span>)
            </div>
            <div id="volNoiseZone" style="width:100px; height:60px; border:1px solid #fff; margin-top:10px;" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToVolNoise(event)">
                VOLノイズ (<span id="volNoiseCount">0</span>)
            </div>
        </div>

        <div class="counter-panel">
            <div class="counter-item">
                <div class="counter-icon icon-vol">VOL</div>
                <div class="counter-controls">
                    <button class="counter-btn" onclick="changeCounter('vol',-1)">-</button>
                    <div class="counter-value" id="val-vol">0</div>
                    <button class="counter-btn" onclick="changeCounter('vol',1)">+</button>
                </div>
            </div>
            <div class="counter-item">
                <div class="counter-icon icon-alpha">α</div>
                <div class="counter-controls">
                    <button class="counter-btn" onclick="changeCounter('alpha',-1)">-</button>
                    <div class="counter-value" id="val-alpha">0</div>
                    <button class="counter-btn" onclick="changeCounter('alpha',1)">+</button>
                </div>
            </div>
            <div class="counter-item">
                <div class="counter-icon icon-beta">β</div>
                <div class="counter-controls">
                    <button class="counter-btn" onclick="changeCounter('beta',-1)">-</button>
                    <div class="counter-value" id="val-beta">0</div>
                    <button class="counter-btn" onclick="changeCounter('beta',1)">+</button>
                </div>
            </div>
            <div class="counter-item">
                <div class="counter-icon icon-omega">Ω</div>
                <div class="counter-controls">
                    <button class="counter-btn" onclick="changeCounter('omega',-1)">-</button>
                    <div class="counter-value" id="val-omega">0</div>
                    <button class="counter-btn" onclick="changeCounter('omega',1)">+</button>
                </div>
            </div>
            <div class="turn-display">TURN<span id="turnCount">1</span></div>
        </div>
    </div>

    <div class="search-overlay" id="searchOverlay" onclick="handleOverlayClick(event)" ondragover="allowDrop(event)" ondrop="dropReturnToSearch(event)">
        <div class="search-modal" id="searchModalEl" ondragover="allowDrop(event)" ondrop="dropReturnToSearch(event)">
            <div class="search-modal-header">
                <div class="search-modal-title" id="searchModalTitle">カードをサーチ</div>
                <button class="search-modal-close" onclick="closeSearchModal()">×</button>
            </div>
            <div class="search-card-grid" id="searchCardGrid" ondragover="allowDrop(event)" ondrop="dropReturnToSearch(event)"></div>
        </div>
    </div>

    <div class="action-overlay" id="actionOverlay">
        <div class="action-box" id="actionBoxEl">
            <div class="action-title" id="actionMenuTitle">カードの移動先</div>
            <div id="actionButtonsContainer" style="width:100%; display:flex; flex-direction:column; gap:8px;"></div>
            <button class="action-btn cancel" onclick="closeActionMenu()">キャンセル</button>
        </div>
    </div>

    <script>
        let currentMode = 2;
        let turn = 1;
        let counters = { vol: 0, alpha: 0, beta: 0, omega: 0 };
        let selectedColumnIndex = null;
        let cardIdCounter = 0;
        let virtualDeck = [];
        let dragTarget = null;
        let startX = 0;
        let startY = 0;
        let volNoiseCards = [];
        let trashCards = [];
        let currentSearchType = "";
        let isSearchOpen = false;
        let pendingActionData = null;
        let isTrashDragging = false;
        let trashDragStartX = 0;
        let trashDragStartY = 0;

        let isDeckDragging = false;
        let deckDragStartX = 0;
        let deckDragStartY = 0;

        window.onload = function() {
            document.getElementById('deckInput1').value = localStorage.getItem('misogi_deck1') || "";
            document.getElementById('deckInput2').value = localStorage.getItem('misogi_deck2') || "";
            selectMode(parseInt(localStorage.getItem('misogi_mode')) || 2);
            setupTrashAreaEvents();
            setupDeckAreaEvents();
        };

        function dragStartDeck(ev) {
            if (virtualDeck.length === 0) {
                ev.preventDefault();
                return;
            }
            ev.dataTransfer.setData('text/plain', 'deck-zone-drag');
            if (isSearchOpen) document.getElementById('searchOverlay').classList.add('dragging-mode');
        }

        function dragEndDeck(ev) {
            document.getElementById('searchOverlay').classList.remove('dragging-mode');
        }

        function setupDeckAreaEvents() {
            let el = document.getElementById('deckZone');
            if (!el) return;

            el.addEventListener('touchstart', function(ev) {
                if (virtualDeck.length === 0) return;
                isDeckDragging = true;
                let touch = ev.touches[0];
                deckDragStartX = touch.clientX;
                deckDragStartY = touch.clientY;
            }, { passive: true });

            el.addEventListener('touchend', function(ev) {
                if (!isDeckDragging) return;
                isDeckDragging = false;
                let touch = ev.changedTouches[0];

                if (Math.abs(touch.clientX - deckDragStartX) < 6 && Math.abs(touch.clientY - deckDragStartY) < 6) {
                    return; 
                }

                let dropT = document.elementFromPoint(touch.clientX, touch.clientY);
                if (dropT && virtualDeck.length > 0) {
                    if (dropT.closest('.hand-area')) {
                        drawCard();
                    } else if (dropT.closest('#trashZone')) {
                        let cardObj = virtualDeck.shift();
                        trashCards.push({ name: cardObj.name, imagePath: cardObj.imagePath });
                        document.getElementById('deckCount').innerText = virtualDeck.length;
                        updateTrashUI();
                    } else if (dropT.closest('#volNoiseZone')) {
                        let cardObj = virtualDeck.shift();
                        volNoiseCards.push({ name: cardObj.name, imagePath: cardObj.imagePath });
                        document.getElementById('deckCount').innerText = virtualDeck.length;
                        document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                    }
                }
            }, { passive: true });
        }

        function setupTrashAreaEvents() {
            let el = document.getElementById('trashZone');
            if (!el) return;
            el.setAttribute('draggable', 'true');
            
            el.onclick = function(ev) {
                if (!isTrashDragging) { openSearchModal('trash'); }
            };

            el.ondragstart = function(ev) {
                if (trashCards.length === 0) { ev.preventDefault(); return; }
                ev.dataTransfer.setData('text/plain', 'trash-zone-drag');
                if (isSearchOpen) document.getElementById('searchOverlay').classList.add('dragging-mode');
            };

            el.ondragend = function(ev) {
                document.getElementById('searchOverlay').classList.remove('dragging-mode');
            };

            el.addEventListener('touchstart', function(ev) {
                if (trashCards.length === 0) return;
                isTrashDragging = true;
                let touch = ev.touches[0];
                trashDragStartX = touch.clientX;
                trashDragStartY = touch.clientY;
            }, { passive: true });

            el.addEventListener('touchend', function(ev) {
                if (!isTrashDragging) return;
                isTrashDragging = false;
                let touch = ev.changedTouches[0];
                if (Math.abs(touch.clientX - trashDragStartX) < 6 && Math.abs(touch.clientY - trashDragStartY) < 6) {
                    openSearchModal('trash');
                } else {
                    let dropT = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (dropT) {
                        if (dropT.closest('.hand-area')) {
                            let cut = trashCards.pop();
                            createGameCardToHand(cut.name, cut.imagePath);
                            updateTrashUI();
                        } else if (dropT.closest('.frame-layer')) {
                            let cut = trashCards.pop();
                            createGameCardToHand(cut.name, cut.imagePath);
                            let gen = document.getElementById(`card-id-${cardIdCounter - 1}`);
                            if (gen) {
                                let num = parseInt(dropT.closest('.frame-layer').getAttribute('data-layer'));
                                executeCardPlacement(gen, dropT.closest('.frame-layer'), num);
                            }
                            updateTrashUI();
                        } else if (dropT.closest('.direction-placeholder')) {
                            let cut = trashCards.pop();
                            createGameCardToHand(cut.name, cut.imagePath);
                            let gen = document.getElementById(`card-id-${cardIdCounter - 1}`);
                            if (gen && dropT.closest('.direction-placeholder').children.length === 0) {
                                dropT.closest('.direction-placeholder').appendChild(gen);
                            }
                            updateTrashUI();
                        }
                    }
                }
            }, { passive: true });
        }

        function updateTrashUI() {
            let el = document.getElementById('trashZone');
            if (!el) return;
            if (trashCards.length > 0) {
                let lastCard = trashCards[trashCards.length - 1];
                el.style.backgroundImage = `url('${lastCard.imagePath}')`;
            } else {
                el.style.backgroundImage = 'none';
            }
            document.getElementById('trashCount').innerText = trashCards.length;
        }

        function startGame() {
            let t = document.getElementById('deckInput1').value;
            let e = t.split(/[\/\s\n,]+/).map(t => t.trim()).filter(t => t.length > 0);
            if (e.length === 0) return alert('デッキコードが入力されていません！');

            let a = [];
            e.forEach(codeStr => {
                let p = codeStr.split('-');
                if (p.length === 2) {
                    let letters = codeStr.toUpperCase();
                    let r = letters.slice(-1);
                    a.push({ name: codeStr, suffix: r, imagePath: `images/${codeStr}.png` });
                }
            });

            let o = { A: 1, S: 2, M: 3, D: 4 };
            a.sort((t, e) => (o[t.suffix] || 99) - (o[e.suffix] || 99));
            virtualDeck = a;

            document.getElementById('deckCount').innerText = virtualDeck.length;
            trashCards = [];
            updateTrashUI();
            volNoiseCards = [];
            document.getElementById('volNoiseCount').innerText = 0;
            document.getElementById('handArea').innerHTML = "";
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';

            setupDeckAreaEvents();
            setupTrashAreaEvents();
        }

        function createGameCardToHand(t, e) {
            let a = document.getElementById('handArea');
            let n = document.createElement('div');
            n.className = 'game-card';
            n.id = `card-id-${cardIdCounter++}`;
            n.innerText = t;
            n.style.backgroundImage = `url('${e}')`;
            n.setAttribute('draggable', 'true');
            n.setAttribute('data-cardname', t);
            n.setAttribute('data-imagepath', e);

            n.ondragstart = function(ev) {
                ev.dataTransfer.setData('text/plain', ev.target.id);
                if (isSearchOpen) document.getElementById('searchOverlay').classList.add('dragging-mode');
            };

            n.ondragend = function(ev) {
                document.getElementById('searchOverlay').classList.remove('dragging-mode');
            };

            n.oncontextmenu = function(ev) {
                if (isSearchOpen) {
                    ev.preventDefault();
                    returnCardFromHand(n);
                }
            };

            n.addEventListener('touchstart', touchStartCard, { passive: false });
            n.addEventListener('touchmove', touchMoveCard, { passive: false });
            n.addEventListener('touchend', touchEndCard, { passive: false });
            a.appendChild(n);
        }

        function touchStartCard(t) {
            t.preventDefault();
            dragTarget = t.currentTarget;
            let e = t.touches;
            let a = dragTarget.getBoundingClientRect();
            startX = e[0].clientX - a.left;
            startY = e[0].clientY - a.top;
            dragTarget.classList.add('dragging');
            dragTarget.style.left = (e[0].clientX - startX) + 'px';
            dragTarget.style.top = (e[0].clientY - startY) + 'px';
            if (isSearchOpen) document.getElementById('searchOverlay').classList.add('dragging-mode');
        }

        function touchMoveCard(t) {
            if (dragTarget) {
                t.preventDefault();
                let e = t.touches;
                dragTarget.style.left = (e[0].clientX - startX) + 'px';
                dragTarget.style.top = (e[0].clientY - startY) + 'px';
            }
        }

        function openActionMenu(title, options, callback) {
            document.getElementById('actionMenuTitle').innerText = title;
            let container = document.getElementById('actionButtonsContainer');
            container.innerHTML = "";
            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.innerText = opt.label;
                btn.onclick = function() {
                    callback(opt.value);
                    closeActionMenu();
                };
                container.appendChild(btn);
            });
            document.getElementById('actionOverlay').style.display = 'flex';
        }

        function closeActionMenu() {
            document.getElementById('actionOverlay').style.display = 'none';
            pendingActionData = null;
        }

        function touchEndCard(t) {
            if (!dragTarget) return;
            t.preventDefault();
            let e = t.changedTouches[0];
            dragTarget.style.display = 'none';
            if (isSearchOpen) document.getElementById('searchOverlay').classList.remove('dragging-mode');
            
            let a = document.elementFromPoint(e.clientX, e.clientY);
            dragTarget.style.display = '';
            dragTarget.classList.remove('dragging');
            dragTarget.style.left = '';
            dragTarget.style.top = '';

            if (a) {
                let mBox = a.closest('#searchModalEl') || a.closest('#searchOverlay');
                if (isSearchOpen && mBox && dragTarget.getAttribute('data-from-search') !== 'true') {
                    returnCardFromHand(dragTarget);
                    dragTarget = null;
                    return;
                }

                if (dragTarget.getAttribute('data-from-search') === 'true') {
                    let idx = parseInt(dragTarget.getAttribute('data-search-index'));
                    let targetList = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);
                    
                    if (a.closest('.hand-area')) {
                        let cut = targetList.splice(idx, 1)[0];
                        createGameCardToHand(cut.name, cut.imagePath);
                    } else if (a.closest('#trashZone') && currentSearchType !== 'trash') {
                        let cut = targetList.splice(idx, 1)[0];
                        trashCards.push({ name: cut.name, imagePath: cut.imagePath });
                    } else if (a.closest('.frame-layer')) {
                        let cut = targetList.splice(idx, 1)[0];
                        createGameCardToHand(cut.name, cut.imagePath);
                        let gen = document.getElementById(`card-id-${cardIdCounter - 1}`);
                        if (gen) {
                            let layerNum = parseInt(a.closest('.frame-layer').getAttribute('data-layer'));
                            executeCardPlacement(gen, a.closest('.frame-layer'), layerNum);
                        }
                    } else if (a.closest('.direction-placeholder')) {
                        let cut = targetList.splice(idx, 1)[0];
                        createGameCardToHand(cut.name, cut.imagePath);
                        let gen = document.getElementById(`card-id-${cardIdCounter - 1}`);
                        if (gen && a.closest('.direction-placeholder').children.length === 0) {
                            a.closest('.direction-placeholder').appendChild(gen);
                        }
                    }

                    document.getElementById('deckCount').innerText = virtualDeck.length;
                    document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                    updateTrashUI();
                    dragTarget.remove();
                    dragTarget = null;
                    renderSearchList();
                    return;
                }

                if (a.closest('.deck-zone')) {
                    let cName = dragTarget.getAttribute('data-cardname');
                    let imgP = dragTarget.getAttribute('data-imagepath');
                    pendingActionData = { name: cName, imagePath: imgP, elementId: dragTarget.id, fromHand: true };
                    openActionMenu(`カード「${cName}」の戻し先`, [
                        { label: "山札の一番上に戻す", value: "top" },
                        { label: "山札の一番下に戻す", value: "bottom" }
                    ], handleDeckReturnChoice);
                    dragTarget = null;
                    return;
                }

                let n = a.closest('.frame-layer');
                if (n && n.hasAttribute('data-layer')) {
                    executeCardPlacement(dragTarget, n, parseInt(n.getAttribute('data-layer')));
                    dragTarget = null;
                    return;
                }

                let r = a.closest('.direction-placeholder');
                if (r && r.children.length === 0) {
                    r.appendChild(dragTarget);
                    dragTarget = null;
                    return;
                }

                if (a.closest('.hand-area')) {
                    document.getElementById('handArea').appendChild(dragTarget);
                    dragTarget = null;
                    return;
                }

                if (a.closest('#trashZone')) {
                    trashCards.push({ name: dragTarget.getAttribute('data-cardname'), imagePath: dragTarget.getAttribute('data-imagepath') });
                    updateTrashUI();
                    dragTarget.remove();
                    dragTarget = null;
                    return;
                }

                if (a.closest('#volNoiseZone')) {
                    volNoiseCards.push({ name: dragTarget.getAttribute('data-cardname'), imagePath: dragTarget.getAttribute('data-imagepath') });
                    document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                    dragTarget.remove();
                    dragTarget = null;
                    return;
                }
            }

            if (dragTarget && dragTarget.getAttribute('data-from-search') === 'true') {
                dragTarget.remove();
                renderSearchList();
            }
            dragTarget = null;
        }

        function handleDeckReturnChoice(value) {
            if (!pendingActionData) return;
            let cName = pendingActionData.name;
            let imgP = pendingActionData.imagePath;
            let letters = cName.toUpperCase();
            let r = letters.slice(-1);

            if (value === "top") {
                virtualDeck.unshift({ name: cName, suffix: r, imagePath: imgP });
            } else if (value === "bottom") {
                virtualDeck.push({ name: cName, suffix: r, imagePath: imgP });
            }

            document.getElementById('deckCount').innerText = virtualDeck.length;

            if (pendingActionData.fromHand && pendingActionData.elementId) {
                let el = document.getElementById(pendingActionData.elementId);
                if (el) el.remove();
            }
            closeActionMenu();
        }

        function allowDrop(t) {
            t.preventDefault();
            t.currentTarget.classList.add('drag-over');
        }

        function dragLeave(t) {
            t.currentTarget.classList.remove('drag-over');
        }

        function dropToSpecificFrame(ev, colIndex, layerNum) {
            ev.preventDefault();
            ev.stopPropagation();
            ev.currentTarget.classList.remove('drag-over');
            let dataText = ev.dataTransfer.getData('text/plain');

            if (dataText === 'search-drag') {
                let idx = parseInt(ev.dataTransfer.getData('search-index'));
                let targetList = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);
                let cardObj = targetList.splice(idx, 1)[0];
                createGameCardToHand(cardObj.name, cardObj.imagePath);
                let genCard = document.getElementById(`card-id-${cardIdCounter - 1}`);
                if (genCard) { executeCardPlacement(genCard, ev.currentTarget, layerNum); }
                document.getElementById('deckCount').innerText = virtualDeck.length;
                document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                updateTrashUI();
                renderSearchList();
                return;
            }

            if (dataText === 'trash-zone-drag' && trashCards.length > 0) {
                let cardObj = trashCards.pop();
                createGameCardToHand(cardObj.name, cardObj.imagePath);
                let genCard = document.getElementById(`card-id-${cardIdCounter - 1}`);
                if (genCard) { executeCardPlacement(genCard, ev.currentTarget, layerNum); }
                updateTrashUI();
                return;
            }

            if (dataText) {
                let r = document.getElementById(dataText);
                if (r) executeCardPlacement(r, ev.currentTarget, layerNum);
            }
        }

        function executeCardPlacement(t, e, a) {
            let n = e.children.length;
            if (a === 3) {
                if (n < 2) e.appendChild(t);
                else alert('紫色の枠にはこれ以上重ねられません！');
            } else {
                if (n === 0) e.appendChild(t);
                else alert('この枠には既にカードがあります！');
            }
        }

        function dropToDirection(ev, slotIdx) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            let dataText = ev.dataTransfer.getData('text/plain');

            if (dataText === 'search-drag') {
                let idx = parseInt(ev.dataTransfer.getData('search-index'));
                let targetList = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);
                if (ev.currentTarget.children.length === 0) {
                    let cardObj = targetList.splice(idx, 1)[0];
                    createGameCardToHand(cardObj.name, cardObj.imagePath);
                    let genCard = document.getElementById(`card-id-${cardIdCounter - 1}`);
                    if (genCard) { ev.currentTarget.appendChild(genCard); }
                    document.getElementById('deckCount').innerText = virtualDeck.length;
                    document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                    updateTrashUI();
                    renderSearchList();
                }
                return;
            }

            if (dataText === 'trash-zone-drag' && trashCards.length > 0) {
                if (ev.currentTarget.children.length === 0) {
                    let cardObj = trashCards.pop();
                    createGameCardToHand(cardObj.name, cardObj.imagePath);
                    let genCard = document.getElementById(`card-id-${cardIdCounter - 1}`);
                    if (genCard) { ev.currentTarget.appendChild(genCard); }
                    updateTrashUI();
                }
                return;
            }

            if (dataText) {
                let n = document.getElementById(dataText);
                if (n && ev.currentTarget.children.length === 0) ev.currentTarget.appendChild(n);
            }
        }

        function dropToHand(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            let dataText = ev.dataTransfer.getData('text/plain');

            if (dataText === 'deck-zone-drag' && virtualDeck.length > 0) {
                drawCard();
            } else if (dataText === 'search-drag') {
                let idx = parseInt(ev.dataTransfer.getData('search-index'));
                let targetList = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);
                let cardObj = targetList.splice(idx, 1)[0];
                createGameCardToHand(cardObj.name, cardObj.imagePath);
                document.getElementById('deckCount').innerText = virtualDeck.length;
                document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                updateTrashUI();
                renderSearchList();
            } else if (dataText === 'trash-zone-drag' && trashCards.length > 0) {
                let cardObj = trashCards.pop();
                createGameCardToHand(cardObj.name, cardObj.imagePath);
                updateTrashUI();
            } else if (dataText) {
                let a = document.getElementById(dataText);
                if (a) document.getElementById('handArea').appendChild(a);
            }
        }

        function dropToTrash(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            let dataText = ev.dataTransfer.getData('text/plain');

            if (dataText === 'deck-zone-drag' && virtualDeck.length > 0) {
                let cardObj = virtualDeck.shift();
                trashCards.push({ name: cardObj.name, imagePath: cardObj.imagePath });
                document.getElementById('deckCount').innerText = virtualDeck.length;
                updateTrashUI();
            } else if (dataText === 'search-drag') {
                let idx = parseInt(ev.dataTransfer.getData('search-index'));
                let targetList = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);
                let cardObj = targetList.splice(idx, 1)[0];
                trashCards.push({ name: cardObj.name, imagePath: cardObj.imagePath });
                document.getElementById('deckCount').innerText = virtualDeck.length;
                document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                updateTrashUI();
                renderSearchList();
            } else if (dataText && dataText !== 'trash-zone-drag') {
                let a = document.getElementById(dataText);
                if (a) {
                    trashCards.push({ name: a.getAttribute('data-cardname'), imagePath: a.getAttribute('data-imagepath') });
                    updateTrashUI();
                    a.remove();
                }
            }
        }

        function dropToVolNoise(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            let dataText = ev.dataTransfer.getData('text/plain');

            if (dataText === 'deck-zone-drag' && virtualDeck.length > 0) {
                let cardObj = virtualDeck.shift();
                volNoiseCards.push({ name: cardObj.name, imagePath: cardObj.imagePath });
                document.getElementById('deckCount').innerText = virtualDeck.length;
                document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
            } else if (dataText === 'trash-zone-drag' && trashCards.length > 0) {
                let cardObj = trashCards.pop();
                volNoiseCards.push({ name: cardObj.name, imagePath: cardObj.imagePath });
                document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                updateTrashUI();
            } else if (dataText) {
                let a = document.getElementById(dataText);
                if (a) {
                    volNoiseCards.push({ name: a.getAttribute('data-cardname'), imagePath: a.getAttribute('data-imagepath') });
                    document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                    a.remove();
                }
            }
        }

        function dropToDeckZone(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            let dataText = ev.dataTransfer.getData('text/plain');

            if (dataText === 'trash-zone-drag' && trashCards.length > 0) {
                let cardObj = trashCards.pop();
                pendingActionData = { name: cardObj.name, imagePath: cardObj.imagePath, elementId: null, fromHand: false };
                updateTrashUI();
                openActionMenu(`カード「${cardObj.name}」の戻し先`, [
                    { label: "山札の一番上に戻す", value: "top" },
                    { label: "山札の一番下に戻す", value: "bottom" }
                ], handleDeckReturnChoice);
                return;
            }

            if (dataText && dataText !== 'search-drag' && dataText !== 'deck-zone-drag') {
                let a = document.getElementById(dataText);
                if (a) {
                    let cName = a.getAttribute('data-cardname');
                    let imgP = a.getAttribute('data-imagepath');
                    pendingActionData = { name: cName, imagePath: imgP, elementId: a.id, fromHand: true };
                    openActionMenu(`カード「${cName}」の戻し先`, [
                        { label: "山札の一番上に戻す", value: "top" },
                        { label: "山札の一番下に戻す", value: "bottom" }
                    ], handleDeckReturnChoice);
                }
            }
        }

        function drawCard() {
            if (virtualDeck.length > 0) {
                let t = virtualDeck.shift();
                document.getElementById('deckCount').innerText = virtualDeck.length;
                createGameCardToHand(t.name, t.imagePath);
            } else {
                alert('山札がなくなりました！');
            }
        }

        function shuffleDeckBtn() {
            if (virtualDeck.length === 0) return alert('山札が空のためシャッフルできません。');
            for (let t = virtualDeck.length - 1; t > 0; t--) {
                let e = Math.floor(Math.random() * (t + 1));
                [virtualDeck[t], virtualDeck[e]] = [virtualDeck[e], virtualDeck[t]];
            }
            alert('山札をシャッフルしました！');
        }

        function trashAllHandBtn() {
            let t = document.getElementById('handArea');
            if (t.children.length === 0) return alert('手札がありません。');
            let list = Array.from(t.children);
            list.forEach(a => {
                trashCards.push({ name: a.getAttribute('data-cardname'), imagePath: a.getAttribute('data-imagepath') });
                a.remove();
            });
            updateTrashUI();
        }

        function mulliganBtn() {
            let t = document.getElementById('handArea');
            let e = t.children.length;
            let list = Array.from(t.children);
            list.forEach(a => {
                trashCards.push({ name: a.getAttribute('data-cardname'), imagePath: a.getAttribute('data-imagepath') });
                a.remove();
            });
            updateTrashUI();

            for (let a = virtualDeck.length - 1; a > 0; a--) {
                let n = Math.floor(Math.random() * (a + 1));
                [virtualDeck[a], virtualDeck[n]] = [virtualDeck[n], virtualDeck[a]];
            }

            let r = Math.min(e, virtualDeck.length);
            for (let c = 0; c < r; c++) {
                let o = virtualDeck.shift();
                createGameCardToHand(o.name, o.imagePath);
            }
            document.getElementById('deckCount').innerText = virtualDeck.length;
            alert(`手札を引き直しました！（${r}枚ドロー）`);
        }

        function resetGameBtn() {
            if (confirm('ゲーム状態を完全にリセットして山札を再構築しますか？')) {
                startGame();
            }
        }

        function openSearchModal(t) {
            currentSearchType = t;
            isSearchOpen = true;
            renderSearchList();
            document.getElementById('searchOverlay').style.display = 'flex';
        }

        function renderSearchList() {
            let t = document.getElementById('searchModalTitle');
            let e = document.getElementById('searchCardGrid');
            e.innerHTML = "";
            let a = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);

            t.innerText = (currentSearchType === 'deck') 
                ? `山札からサーチ (残り: ${virtualDeck.length}枚)` 
                : (currentSearchType === 'noise' ? `VOLノイズからサーチ (現在: ${volNoiseCards.length}枚)` : `トラッシュ確認 (現在: ${trashCards.length}枚)`);

            if (a.length === 0) {
                e.innerHTML = "<div style='color:#666; font-size:14px; padding:20px;'>カードがありません</div>";
                return;
            }

            a.forEach((cardData, n) => {
                let r = document.createElement('div');
                r.className = 'game-card';
                r.innerText = cardData.name;
                r.style.backgroundImage = `url('${cardData.imagePath}')`;
                r.setAttribute('draggable', 'true');

                r.ondragstart = function(ev) {
                    ev.dataTransfer.setData('text/plain', 'search-drag');
                    ev.dataTransfer.setData('search-index', n);
                    document.getElementById('searchOverlay').classList.add('dragging-mode');
                };

                r.ondragend = function(ev) {
                    document.getElementById('searchOverlay').classList.remove('dragging-mode');
                };

                r.addEventListener('touchstart', function(ev) {
                    ev.preventDefault();
                    dragTarget = ev.currentTarget;
                    let touch = ev.touches[0];
                    let c = dragTarget.getBoundingClientRect();
                    startX = touch.clientX - c.left;
                    startY = touch.clientY - c.top;
                    dragTarget.classList.add('dragging');
                    dragTarget.setAttribute('data-from-search', 'true');
                    dragTarget.setAttribute('data-search-index', n);
                    dragTarget.style.backgroundImage = `url('${cardData.imagePath}')`;
                    dragTarget.innerText = cardData.name;
                    document.body.appendChild(dragTarget);
                    if (isSearchOpen) document.getElementById('searchOverlay').classList.add('dragging-mode');
                }, { passive: false });

                r.onclick = function(ev) {
                    ev.stopPropagation();
                    if (currentSearchType === 'trash') {
                        pendingActionData = { name: cardData.name, imagePath: cardData.imagePath, index: n, list: a };
                        openActionMenu(`トラッシュ：${cardData.name}`, [
                            { label: "手札に加える", value: "hand" },
                            { label: "山札の一番上に戻す", value: "top" },
                            { label: "山札の一番下に戻す", value: "bottom" }
                        ], handleTrashChoice);
                    } else {
                        let cut = a.splice(n, 1)[0];
                        createGameCardToHand(cut.name, cut.imagePath);
                        document.getElementById('deckCount').innerText = virtualDeck.length;
                        document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
                        updateTrashUI();
                        renderSearchList();
                    }
                };
                e.appendChild(r);
            });
        }

        function handleTrashChoice(value) {
            if (!pendingActionData) return;
            let idx = pendingActionData.index;
            let list = pendingActionData.list;
            let cut = list.splice(idx, 1)[0];
            let letters = cut.name.toUpperCase();
            let suff = letters.slice(-1);

            if (value === "hand") {
                createGameCardToHand(cut.name, cut.imagePath);
            } else if (value === "top") {
                virtualDeck.unshift({ name: cut.name, suffix: suff, imagePath: cut.imagePath });
            } else if (value === "bottom") {
                virtualDeck.push({ name: cut.name, suffix: suff, imagePath: cut.imagePath });
            }

            document.getElementById('deckCount').innerText = virtualDeck.length;
            document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
            updateTrashUI();
            closeActionMenu();
            renderSearchList();
        }

        function handleOverlayClick(t) {
            if (t.target.id === "searchOverlay" || t.target.id === "searchCardGrid") {
                closeSearchModal();
            }
        }

        function closeSearchModal() {
            let t = (currentSearchType === 'deck') ? virtualDeck : (currentSearchType === 'noise' ? volNoiseCards : trashCards);
            if (t.length > 0 && currentSearchType !== 'trash') {
                for (let e = t.length - 1; e > 0; e--) {
                    let a = Math.floor(Math.random() * (e + 1));
                    [t[e], t[a]] = [t[a], t[e]];
                }
                if (currentSearchType === 'deck') alert('サーチを終了したため、山札を自動シャッフルしました。');
                else alert('サーチを終了したため、VOLノイズエリアを自動シャッフルしました。');
            }
            isSearchOpen = false;
            document.getElementById('searchOverlay').style.display = 'none';
        }

        function dropReturnToSearch(t) {
            t.preventDefault();
            document.getElementById('searchOverlay').classList.remove('dragging-mode');
            let e = t.dataTransfer.getData('text/plain');
            if (e && e !== 'search-drag' && e !== 'deck-zone-drag') {
                let a = document.getElementById(e);
                if (a) returnCardFromHand(a);
            }
        }

        function returnCardFromHand(t) {
            let e = t.getAttribute('data-cardname');
            let a = t.getAttribute('data-imagepath');
            let letters = e.toUpperCase();
            let r = letters.slice(-1);

            if (currentSearchType === 'deck') {
                virtualDeck.push({ name: e, suffix: r, imagePath: a });
                document.getElementById('deckCount').innerText = virtualDeck.length;
            } else if (currentSearchType === 'noise') {
                volNoiseCards.push({ name: e, imagePath: a });
                document.getElementById('volNoiseCount').innerText = volNoiseCards.length;
            } else {
                trashCards.push({ name: e, imagePath: a });
                updateTrashUI();
            }
            t.remove();
            renderSearchList();
        }

        function clickChangeBtn(t) {
            let e = document.getElementById(`change-btn-${t}`);
            if (selectedColumnIndex === null) {
                selectedColumnIndex = t;
                e.classList.add('selecting');
            } else if (selectedColumnIndex === t) {
                e.classList.remove('selecting');
                selectedColumnIndex = null;
            } else {
                for (let a = 1; a <= 3; a++) {
                    let n = document.getElementById(`frame-${selectedColumnIndex}-${a}`);
                    let r = document.getElementById(`frame-${t}-${a}`);
                    let c = Array.from(n.children);
                    let o = Array.from(r.children);
                    n.innerHTML = "";
                    r.innerHTML = "";
                    c.forEach(item => r.appendChild(item));
                    o.forEach(item => n.appendChild(item));
                }
                document.getElementById(`change-btn-${selectedColumnIndex}`).classList.remove('selecting');
                selectedColumnIndex = null;
            }
        }

        function saveData() {
            localStorage.setItem('misogi_mode', currentMode);
            localStorage.setItem('misogi_deck1', document.getElementById('deckInput1').value);
            localStorage.setItem('misogi_deck2', document.getElementById('deckInput2').value);
        }

        function selectMode(t) {
            currentMode = t;
            let e = document.getElementById('areaPlayer2');
            if (t === 1) {
                document.getElementById('btn1Deck').classList.add('active');
                document.getElementById('btn2Deck').classList.remove('active');
                document.getElementById('areaPlayer1').querySelector('.label-text').innerText = 'デッキリストを入力してください';
                e.style.display = 'none';
            } else {
                document.getElementById('btn1Deck').classList.remove('active');
                document.getElementById('btn2Deck').classList.add('active');
                document.getElementById('areaPlayer1').querySelector('.label-text').innerText = 'プレイヤー1のデッキ';
                e.style.display = 'flex';
            }
            saveData();
        }

        function clearInput(t) {
            document.getElementById(`deckInput${t}`).value = '';
            saveData();
        }

        function backToMenu() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('menuScreen').style.flexDirection = 'column';
            document.getElementById('menuScreen').style.display = 'flex';
        }

        function changeCounter(t, e) {
            counters[t] = Math.max(0, counters[t] + e);
            document.getElementById(`val-${t}`).innerText = counters[t];
        }

        function nextTurn() {
            turn++;
            document.getElementById('turnCount').innerText = turn;
        }

        function rollDice() {
            alert(`ダイスの出目: ${Math.floor(Math.random() * 6) + 1}`);
        }

        function triggerAction(t) {
            alert(`「${t}」が実行されました`);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- タブに表示される名前を設定 -->
    <title>禊シミュレーター</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212; /* 暗めの背景色 */
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* メインメニュー画面のコンテナ */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 大きく表示される「禊」タイトル */
        .title {
            font-size: 54px;
            font-weight: bold;
            margin-bottom: 35px;
            letter-spacing: 6px;
        }

        /* モード選択ボタンのエリア */
        .mode-selection {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .mode-btn {
            background-color: #242424;
            color: #8a8a8a;
            border: 1px solid #3a3a3a;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        /* 選択されているモードのスタイル（1デッキモードの青色） */
        .mode-btn.active {
            background-color: #007bff;
            color: #ffffff;
            border-color: #007bff;
        }

        /* デッキコード入力エリア */
        .deck-code-area {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        .label-text {
            color: #ffffff;
            font-size: 15px;
            align-self: center;
            margin-bottom: 5px;
        }

        .textarea-container {
            width: 100%;
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 6px;
            color: #ffffff;
            padding: 15px;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
            outline: none;
        }

        /* クリアボタン（赤色） */
        .clear-btn {
            background-color: #dc3545;
            color: #ffffff;
            border: none;
            padding: 10px 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 5px;
            transition: background-color 0.2s ease;
        }

        .clear-btn:hover {
            background-color: #c82333;
        }

        /* ゲーム開始ボタンのコンテナ */
        .start-btn-container {
            margin-top: 50px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* ゲーム開始ボタン（ピンク・赤色） */
        .start-btn {
            background-color: #e6002d;
            color: #ffffff;
            border: none;
            padding: 15px 80px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 2px;
            transition: background-color 0.2s ease;
        }

        .start-btn:hover {
            background-color: #cc0028;
        }

        /* 対戦画面（最初は非表示） */
        .game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            background-color: #1a1a1a;
        }

        .game-screen h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .back-btn {
            background-color: #444444;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- メインメニュー画面 -->
    <div class="container" id="menuScreen">
        <div class="title">禊</div>

        <!-- 1デッキ / 2デッキの切り替えボタン -->
        <div class="mode-selection">
            <button class="mode-btn active" id="btn1Deck" onclick="selectMode(1)">1デッキモード</button>
            <button class="mode-btn" id="btn2Deck" onclick="selectMode(2)">2デッキ対戦モード</button>
        </div>

        <!-- デッキコード入力部分 -->
        <div class="deck-code-area">
            <div class="label-text" id="labelText">デッキリストを / 区切りで入力してください</div>
            <div class="textarea-container">
                <textarea id="deckInput" placeholder="ここにデッキコードを入力してください"></textarea>
            </div>
            <button class="clear-btn" onclick="clearInput()">クリア</button>
        </div>

        <!-- ゲーム開始ボタン -->
        <div class="start-btn-container">
            <button class="start-btn" onclick="startGame()">ゲーム開始</button>
        </div>
    </div>

    <!-- 対戦画面 -->
    <div class="game-screen" id="gameScreen">
        <h2>対戦画面</h2>
        <p id="gameInfoText" style="color: #aaa; text-align: center; line-height: 1.6;"></p>
        <button class="back-btn" onclick="backToMenu()">メニューに戻る</button>
    </div>

    <script>
        let currentMode = 1;

        // モードを切り替える関数
        function selectMode(mode) {
            currentMode = mode;
            const btn1 = document.getElementById('btn1Deck');
            const btn2 = document.getElementById('btn2Deck');
            const labelText = document.getElementById('labelText');
            const deckInput = document.getElementById('deckInput');

            if (mode === 1) {
                btn1.classList.add('active');
                btn2.classList.remove('active');
                labelText.innerText = 'デッキリストを / 区切りで入力してください';
            } else {
                btn1.classList.remove('active');
                btn2.classList.add('active');
                labelText.innerText = '2つのデッキリストを入力してください';
            }
        }

        // 入力欄をクリアする関数
        function clearInput() {
            document.getElementById('deckInput').value = '';
        }

        // ゲーム開始ボタンを押した時の処理（対戦画面へ移行）
        function startGame() {
            const deckCode = document.getElementById('deckInput').value;
            
            // メニューを非表示にし、対戦画面を表示
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';

            // デバッグ用に選択したモードと入力文字数を表示
            const infoText = document.getElementById('gameInfoText');
            infoText.innerHTML = `モード: ${currentMode}デッキモード<br>入力されたデータ: ${deckCode ? deckCode : '空欄'}`;
        }

        // メニュー画面に戻る関数
        function backToMenu() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('menuScreen').style.display = 'flex';
        }
    </script>
</body>
</html>

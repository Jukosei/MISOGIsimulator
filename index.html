<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISOGISimulator - 対戦画面</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* Main Container */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      background-color: #1a1a1a;
    }

    /* Left Sidebar */
    .left-sidebar {
      width: 140px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid #2a2a2a;
      background-color: #141414;
      flex-shrink: 0;
    }

    .vol-noise-box {
      border: 1px dashed #444;
      border-radius: 8px;
      height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #1c1c1c;
    }

    .vol-noise-box .count {
      font-size: 42px;
      font-weight: bold;
    }

    .vol-noise-box .label {
      font-size: 11px;
      color: #aaa;
      margin-top: 5px;
    }

    .btn-temporary {
      background-color: #10b981;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      width: 100%;
    }

    .card-preview-container {
      width: 100%;
      height: 180px;
      border-radius: 6px;
      overflow: hidden;
      background-color: #222;
      border: 1px solid #333;
    }

    /* Center Main Board */
    .main-board {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 10px;
      overflow: hidden;
    }

    /* Stage & Direction Sections */
    .stage-section {
      flex: 1.2;
      background-color: #222222;
      border-radius: 8px;
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
    }

    .direction-section {
      flex: 1;
      background-color: #222222;
      border-radius: 8px;
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
    }

    .section-title {
      font-size: 13px;
      color: #ccc;
      margin-bottom: 5px;
    }

    .grid-5-cols {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      height: 100%;
      align-items: center;
      justify-items: center;
    }

    /* Column in Stage */
    .stage-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 110px;
      height: 100%;
      justify-content: space-between;
    }

    .column-header {
      font-size: 11px;
      background-color: #2a2a2a;
      border: 1px dashed #555;
      padding: 2px 12px;
      border-radius: 10px;
      color: #ccc;
      margin-bottom: 4px;
    }

    .slot-card {
      width: 100%;
      height: 28%;
      border-radius: 8px;
      border: 2px dashed;
      background-color: rgba(0, 0, 0, 0.2);
    }

    .slot-blue { border-color: #1d4ed8; }
    .slot-yellow { border-color: #d97706; }
    .slot-purple { border-color: #6b21a8; }
    .slot-red { border-color: #dc2626; width: 100%; max-width: 110px; height: 80%; }

    /* Bottom Hand & Deck Bar */
    .bottom-bar {
      height: 150px;
      display: flex;
      gap: 10px;
    }

    .hand-area {
      flex: 1;
      background-color: #222222;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      align-items: center;
    }

    .deck-area {
      width: 180px;
      background-color: #222222;
      border: 2px dashed #444;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .deck-count {
      font-size: 40px;
      font-weight: bold;
    }

    .deck-label {
      font-size: 10px;
      color: #aaa;
      margin-top: 4px;
    }

    /* Right Action Sidebar */
    .right-sidebar {
      width: 170px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: #141414;
      border-left: 1px solid #2a2a2a;
      flex-shrink: 0;
    }

    .btn-action {
      width: 100%;
      padding: 9px 5px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      color: white;
      text-align: center;
    }

    .btn-blue { background-color: #0066cc; }
    .btn-orange { background-color: #ff9900; color: #111; font-weight: 800; }
    .btn-gray { background-color: #444444; color: #ccc; margin-top: auto; }

    /* Far Right Counters Bar */
    .counter-sidebar {
      width: 100px;
      padding: 10px 8px;
      background-color: #101010;
      border-left: 1px solid #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .counter-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    .counter-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
      color: #111;
    }

    .bg-yellow { background-color: #ffcc00; }
    .bg-pink { background-color: #ff6699; }
    .bg-blue { background-color: #3399ff; }
    .bg-purple { background-color: #cc66ff; }

    .counter-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background-color: #1a1a1a;
      border-radius: 4px;
      padding: 2px;
    }

    .btn-counter {
      background-color: #2a2a2a;
      border: 1px solid #333;
      color: white;
      width: 22px;
      height: 24px;
      border-radius: 3px;
      font-weight: bold;
      cursor: pointer;
    }

    .counter-value {
      font-size: 14px;
      font-weight: bold;
    }

    .turn-box {
      margin-top: auto;
      text-align: center;
      width: 100%;
    }

    .turn-label {
      font-size: 10px;
      color: #888;
      letter-spacing: 1px;
    }

    .turn-number {
      font-size: 28px;
      font-weight: bold;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- Left Sidebar -->
    <div class="left-sidebar">
      <div class="vol-noise-box">
        <div class="count">0</div>
        <div class="label">VOLノイズ</div>
      </div>

      <button class="btn-temporary">テンポラリー</button>

      <div class="card-preview-container">
        <svg width="100%" height="100%" viewBox="0 0 100 140" style="background:#1d2951;">
          <rect x="5" y="5" width="90" height="130" fill="none" stroke="#3b82f6" stroke-width="2"/>
          <text x="50" y="30" fill="#fff" font-size="10" text-anchor="middle">降臨</text>
          <text x="50" y="70" fill="#888" font-size="8" text-anchor="middle">[カードプレビュー]</text>
        </svg>
      </div>
    </div>

    <!-- Main Board -->
    <div class="main-board">

      <!-- Stage Area (5 Columns) -->
      <div class="stage-section">
        <div class="section-title">ステージ</div>
        <div class="grid-5-cols">
          <div class="stage-column">
            <div class="column-header">チェンジ</div>
            <div class="slot-card slot-blue"></div>
            <div class="slot-card slot-yellow"></div>
            <div class="slot-card slot-purple"></div>
          </div>
          <div class="stage-column">
            <div class="column-header">チェンジ</div>
            <div class="slot-card slot-blue"></div>
            <div class="slot-card slot-yellow"></div>
            <div class="slot-card slot-purple"></div>
          </div>
          <div class="stage-column">
            <div class="column-header">チェンジ</div>
            <div class="slot-card slot-blue"></div>
            <div class="slot-card slot-yellow"></div>
            <div class="slot-card slot-purple"></div>
          </div>
          <div class="stage-column">
            <div class="column-header">チェンジ</div>
            <div class="slot-card slot-blue"></div>
            <div class="slot-card slot-yellow"></div>
            <div class="slot-card slot-purple"></div>
          </div>
          <div class="stage-column">
            <div class="column-header">チェンジ</div>
            <div class="slot-card slot-blue"></div>
            <div class="slot-card slot-yellow"></div>
            <div class="slot-card slot-purple"></div>
          </div>
        </div>
      </div>

      <!-- Direction Area (5 Columns) -->
      <div class="direction-section">
        <div class="grid-5-cols">
          <div class="slot-card slot-red"></div>
          <div class="slot-card slot-red"></div>
          <div class="slot-card slot-red"></div>
          <div class="slot-card slot-red"></div>
          <div class="slot-card slot-red"></div>
        </div>
      </div>

      <!-- Bottom Bar: Hand + Deck -->
      <div class="bottom-bar">
        <div class="hand-area"></div>
        <div class="deck-area">
          <div class="deck-count">59</div>
          <div class="deck-label">山札 (クリックドロー/ドラッグ戻し)</div>
        </div>
      </div>

    </div>

    <!-- Right Sidebar (Action Buttons) -->
    <div class="right-sidebar">
      <button class="btn-action btn-blue">山札シャッフル</button>
      <button class="btn-action btn-blue">山札からサーチ</button>
      <button class="btn-action btn-blue">VOLノイズからサーチ</button>
      <button class="btn-action btn-blue">手札を全てトラッシュ</button>
      <button class="btn-action btn-blue">マリガン</button>
      <button class="btn-action btn-blue">リセット</button>
      <button class="btn-action btn-orange">ターンエンド</button>
      <button class="btn-action btn-blue">ダイスを振る</button>
      <button class="btn-action btn-blue">山札の下から1枚ドロー</button>
      <button class="btn-action btn-gray">メニューに戻る</button>
    </div>

    <!-- Far Right Counters -->
    <div class="counter-sidebar">
      <div class="counter-group">
        <div class="counter-badge bg-yellow">VOL</div>
        <div class="counter-controls">
          <button class="btn-counter">-</button>
          <span class="counter-value">0</span>
          <button class="btn-counter">+</button>
        </div>
      </div>

      <div class="counter-group">
        <div class="counter-badge bg-pink">α</div>
        <div class="counter-controls">
          <button class="btn-counter">-</button>
          <span class="counter-value">0</span>
          <button class="btn-counter">+</button>
        </div>
      </div>

      <div class="counter-group">
        <div class="counter-badge bg-blue">β</div>
        <div class="counter-controls">
          <button class="btn-counter">-</button>
          <span class="counter-value">0</span>
          <button class="btn-counter">+</button>
        </div>
      </div>

      <div class="counter-group">
        <div class="counter-badge bg-purple">Ω</div>
        <div class="counter-controls">
          <button class="btn-counter">-</button>
          <span class="counter-value">0</span>
          <button class="btn-counter">+</button>
        </div>
      </div>

      <div class="turn-box">
        <div class="turn-label">TURN</div>
        <div class="turn-number">1</div>
      </div>
    </div>

  </div>

</body>
</html>

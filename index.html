<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禊シミュレーター</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .title {
            font-size: 54px;
            font-weight: bold;
            margin-bottom: 35px;
            letter-spacing: 6px;
        }

        .mode-selection {
            display: flex;
            gap: 10px;
            margin-bottom: 35px;
        }

        .mode-btn {
            background-color: #242424;
            color: #8a8a8a;
            border: 1px solid #3a3a3a;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background-color: #007bff;
            color: #ffffff;
            border-color: #007bff;
        }

        .input-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .deck-code-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .label-text {
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            align-self: center;
            margin-bottom: 12px;
        }

        .textarea-container {
            width: 100%;
        }

        textarea {
            width: 100%;
            height: 160px;
            background-color: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 6px;
            color: #ffffff;
            padding: 15px;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
            outline: none;
        }

        .clear-btn {
            background-color: #dc3545;
            color: #ffffff;
            border: none;
            padding: 10px 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 12px;
            transition: background-color 0.2s ease;
        }

        .clear-btn:hover {
            background-color: #c82333;
        }

        .start-btn-container {
            margin-top: 45px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .start-btn {
            background-color: #e6002d;
            color: #ffffff;
            border: none;
            padding: 15px 100px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 2px;
            transition: background-color 0.2s ease;
        }

        .start-btn:hover {
            background-color: #cc0028;
        }

        .game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            background-color: #1a1a1a;
        }

        .game-screen h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .back-btn {
            background-color: #444444;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container" id="menuScreen">
        <div class="title">禊</div>

        <div class="mode-selection">
            <button class="mode-btn" id="btn1Deck" onclick="selectMode(1)">1デッキモード</button>
            <button class="mode-btn" id="btn2Deck" onclick="selectMode(2)">2デッキ対戦モード</button>
        </div>

        <div class="input-section">
            <div class="deck-code-area" id="areaPlayer1">
                <div class="label-text" id="labelPlayer1">プレイヤー1のデッキ</div>
                <div class="textarea-container">
                    <!-- 入力するたびに自動保存するイベント(oninput)を追加 -->
                    <textarea id="deckInput1" oninput="saveData()" placeholder="ここにデッキコードを入力してください"></textarea>
                </div>
                <button class="clear-btn" onclick="clearInput(1)">クリア</button>
            </div>

            <div class="deck-code-area" id="areaPlayer2">
                <div class="label-text">プレイヤー2のデッキ</div>
                <div class="textarea-container">
                    <!-- 入力するたびに自動保存するイベント(oninput)を追加 -->
                    <textarea id="deckInput2" oninput="saveData()" placeholder="ここにデッキコードを入力してください"></textarea>
                </div>
                <button class="clear-btn" onclick="clearInput(2)">クリア</button>
            </div>
        </div>

        <div class="start-btn-container">
            <button class="start-btn" onclick="startGame()">ゲーム開始</button>
        </div>
    </div>

    <div class="game-screen" id="gameScreen">
        <h2>対戦画面</h2>
        <p id="gameInfoText" style="color: #aaa; text-align: center; line-height: 1.6;"></p>
        <button class="back-btn" onclick="backToMenu()">メニューに戻る</button>
    </div>

    <script>
        let currentMode = 2; // デフォルトは2デッキモード

        // 🟢 画面が読み込まれた時に、保存されているデータを復元する
        window.onload = function() {
            // 保存されたモードを読み込み（なければ2にする）
            const savedMode = localStorage.getItem('misogi_mode');
            currentMode = savedMode ? parseInt(savedMode) : 2;

            // 保存されたデッキコードを読み込み
            const savedDeck1 = localStorage.getItem('misogi_deck1');
            const savedDeck2 = localStorage.getItem('misogi_deck2');

            if (savedDeck1) document.getElementById('deckInput1').value = savedDeck1;
            if (savedDeck2) document.getElementById('deckInput2').value = savedDeck2;

            // 読み込んだモードの見た目を画面に反映
            selectMode(currentMode);
        };

        // 🟢 データをブラウザに保存する共通関数
        function saveData() {
            const deck1 = document.getElementById('deckInput1').value;
            const deck2 = document.getElementById('deckInput2').value;

            localStorage.setItem('misogi_mode', currentMode);
            localStorage.setItem('misogi_deck1', deck1);
            localStorage.setItem('misogi_deck2', deck2);
        }

        // モードを切り替える関数
        function selectMode(mode) {
            currentMode = mode;
            const btn1 = document.getElementById('btn1Deck');
            const btn2 = document.getElementById('btn2Deck');
            const label1 = document.getElementById('labelPlayer1');
            const area2 = document.getElementById('areaPlayer2');

            if (mode === 1) {
                btn1.classList.add('active');
                btn2.classList.remove('active');
                label1.innerText = 'デッキリストを / 区切りで入力してください';
                area2.style.display = 'none';
            } else {
                btn1.classList.remove('active');
                btn2.classList.add('active');
                label1.innerText = 'プレイヤー1のデッキ';
                area2.style.display = 'flex';
            }

            // モードを切り替えた時も状態を保存
            saveData();
        }

        // 指定された入力欄をクリアする関数
        function clearInput(targetNum) {
            document.getElementById(`deckInput${targetNum}`).value = '';
            saveData(); // クリアした状態を保存
        }

        // ゲーム開始ボタンの処理
        function startGame() {
            const deck1 = document.getElementById('deckInput1').value;
            const deck2 = document.getElementById('deckInput2').value;
            
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';

            const infoText = document.getElementById('gameInfoText');
            if (currentMode === 1) {
                infoText.innerHTML = `モード: 1デッキモード<br>デッキ: ${deck1 ? deck1 : '空欄'}`;
            } else {
                infoText.innerHTML = `モード: 2デッキ対戦モード<br>P1デッキ: ${deck1 ? deck1 : '空欄'}<br>P2デッキ: ${deck2 ? deck2 : '空欄'}`;
            }
        }

        function backToMenu() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('menuScreen').style.display = 'flex';
        }
    </script>
</body>
</html>

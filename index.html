<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禊シミュレーター</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --text-color: #ffffff;
            --accent-color: #ff0055;
            --artist-color: #22a6b3;
            --song-color: #be2edd;
            --magic-color: #f0932b;
            --direction-color: #6ab04c;
            --slot-border: #33333a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .screen {
            display: none !important;
            min-height: 100vh;
            padding: 15px;
        }

        .screen.active {
            display: flex !important;
            flex-direction: column;
        }

        #menu-screen {
            justify-content: center;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 6px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            width: 100%;
            font-weight: 900;
        }
        .form-group {
            width: 100%;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: var(--card-bg);
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            padding: 10px;
            font-family: monospace;
            resize: none;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 6px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        #game-screen {
            padding: 10px;
            gap: 10px;
            height: 100vh;
            max-height: 100vh;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .game-main-layout {
            display: flex;
            flex: 1;
            gap: 10px;
            overflow: hidden;
            margin: 5px 0;
        }

        /* 左右のサイドバー */
        .side-panel {
            width: 180px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }

        .side-btn {
            background: #2e2e38;
            color: #fff;
            border: 1px solid #444;
            padding: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }
        .side-btn:hover { background: #3e3e4d; }

        .counter-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 6px;
            border-radius: 6px;
            gap: 4px;
            font-size: 0.75rem;
        }
        .counter-ctrl {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .count-btn {
            background: #444;
            color: white;
            border: none;
            padding: 1px 8px;
            border-radius: 3px;
            cursor: pointer;
        }

        .battlefield {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }
        .zone {
            background-color: rgba(255, 255, 255, 0.01);
            border: 1px solid #2a2a30;
            border-radius: 8px;
            padding: 8px;
        }

        .zone-title {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 6px;
            font-weight: bold;
        }

        /* 画像のような5連固定カードスロット */
        .card-slots-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .empty-slot {
            aspect-ratio: 72 / 108;
            border: 2px dashed var(--slot-border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 0.65rem;
            font-weight: bold;
            background: rgba(0,0,0,0.1);
        }

        .hand-container {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 8px;
        }

        #hand {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            min-height: 112px;
        }

        /* カードの基本設定 */
        .card {
            width: 100%;
            aspect-ratio: 72 / 108;
            background-color: #2a2a30;
            border-radius: 6px;
            border: 2px solid #666;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .card-img {
            width: 100%; height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0; z-index: 1;
        }

        .card-info-overlay {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0; z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            background: rgba(0,0,0,0.35);
        }

        .card.A { border-color: var(--artist-color); }
        .card.S { border-color: var(--song-color); }
        .card.M { border-color: var(--magic-color); }
        .card.D { border-color: var(--direction-color); }

        .card-type-tag {
            font-size: 0.45rem;
            padding: 1px 2px;
            border-radius: 2px;
            color: #fff;
            font-weight: bold;
            align-self: flex-start;
        }
        .card.A .card-type-tag { background-color: var(--artist-color); }
        .card.S .card-type-tag { background-color: var(--song-color); }
        .card.M .card-type-tag { background-color: var(--magic-color); }
        .card.D .card-type-tag { background-color: var(--direction-color); }

        .card.standby { transform: rotate(90deg); }

        .card-status {
            position: absolute;
            bottom: 2px; right: 2px;
            background: rgba(0,0,0,0.8);
            padding: 1px 3px;
            border-radius: 3px;
            font-size: 0.45rem; z-index: 3;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center; align-items: center;
            z-index: 1000; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background-color: var(--card-bg);
            padding: 20px; border-radius: 8px;
            width: 100%; max-width: 400px; text-align: center;
        }

        .menu-btn {
            display: block; width: 100%; padding: 12px;
            background: #2a2a30; color: white; border: 1px solid #444;
            margin-bottom: 8px; border-radius: 6px; cursor: pointer;
            text-align: left; font-size: 0.9rem;
        }
        .menu-btn:hover { background: #3a3a42; }
        .menu-btn.cancel { background: #555; text-align: center; margin-top: 10px;}

        @media (max-width: 767px) {
            .game-main-layout { flex-direction: column; }
            .side-panel { width: 100%; flex-direction: row; flex-wrap: wrap; }
            .counter-group { flex: 1; min-width: 70px; }
        }
    </style>
</head>
<body>

    <!-- 1. メニュー画面 -->
    <div id="menu-screen" class="screen active">
        <h1>禊</h1>
        <div class="form-group">
            <label for="deck-code">デッキコード (スラッシュ「/」区切り または 改行区切り)</label>
            <textarea id="deck-code" placeholder="例: GA-13/GA-13/DA-34/JS-40/exD-1..."></textarea>
            <div id="deck-count" style="font-size: 0.8rem; color: #888; text-align: right;">0 / 60 枚</div>
        </div>
        <div class="form-group">
            <label>対戦の手番</label>
            <div class="radio-group">
                <label><input type="radio" name="turn-order" value="first" checked> 先攻</label>
                <label><input type="radio" name="turn-order" value="second"> 後攻</label>
            </div>
        </div>
        <button class="btn" onclick="startGame()">対戦開始</button>
    </div>
        <!-- 右側：プレイマット操作コントロール -->
        <div class="sidebar">
            <div class="sidebar-title">プレイマット</div>
            <button class="control-btn" onclick="shuffleDeck()">山札シャッフル</button>
            <button class="control-btn" onclick="alert('山札からサーチします（未実装）')">山札からサーチ</button>
            <button class="control-btn" onclick="alert('VOL/ノイズからサーチします（未実装）')">VOL/ノイズからサーチ</button>
            <button class="control-btn" onclick="discardAllHand()">手札を全てトラッシュ</button>
            <button class="control-btn" onclick="executeMulligan(true)">マリガン</button>
            <button class="control-btn" onclick="if(confirm('リセットしますか？')) location.reload();">リセット</button>
            <button class="control-btn end-turn" onclick="nextPhase(); nextPhase();">ターンエンド</button>
            <button class="control-btn" onclick="rollDice()">ダイスを振る</button>
            <button class="control-btn" onclick="drawFromBottom()">山札の下から1枚ドロー</button>
            <button class="control-btn" onclick="alert('手札をソートしました（未実装）')">ソート</button>
        </div>

        <!-- 右端：縦並びトークンカウンターエリア -->
        <div class="token-sidebar">
            <!-- VOL -->
            <div class="token-container">
                <div class="token-icon vol-icon">VOL</div>
                <div class="token-controls">
                    <button class="token-btn" onclick="changeToken('vol', -1)">-</button>
                    <span class="token-value" id="token-vol">0</span>
                    <button class="token-btn" onclick="changeToken('vol', 1)">+</button>
                </div>
            </div>
            <!-- 魔力 -->
            <div class="token-container">
                <div class="token-icon mana-icon">魔力</div>
                <div class="token-controls">
                    <button class="token-btn" onclick="changeToken('mana', -1)">-</button>
                    <span class="token-value" id="token-mana">0</span>
                    <button class="token-btn" onclick="changeToken('mana', 1)">+</button>
                </div>
            </div>
            <!-- ノイズ -->
            <div class="token-container">
                <div class="token-icon noise-icon">ノイズ</div>
                <div class="token-controls">
                    <button class="token-btn" onclick="changeToken('noise', -1)">-</button>
                    <span class="token-value" id="token-noise">0</span>
                    <button class="token-btn" onclick="changeToken('noise', 1)">+</button>
                </div>
            </div>
            <!-- その他（汎用） -->
            <div class="token-container">
                <div class="token-icon counter-icon">汎用</div>
                <div class="token-controls">
                    <button class="token-btn" onclick="changeToken('generic', -1)">-</button>
                    <span class="token-value" id="token-generic">0</span>
                    <button class="token-btn" onclick="changeToken('generic', 1)">+</button>
                </div>
            </div>
        </div>
    </div>

    <!-- モーダルウィンドウ群 -->
    <div id="mulligan-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">マリガン（引き直し）をしますか？</div>
            <button class="btn" onclick="executeMulligan(true)" style="background:#333; margin-bottom:10px;">マリガンする</button>
            <button class="btn" onclick="executeMulligan(false)">このまま開始</button>
        </div>
    </div>

    <div id="action-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title" id="action-card-title">カード名</div>
            <div id="action-buttons-container"></div>
            <button class="menu-btn cancel" onclick="closeActionModal()">閉じる</button>
        </div>
    </div>
    <script>
        let gameState = {
            deck: [], hand: [],
            stage: [null, null, null, null, null], // 5つの専用枠
            field: [null, null, null, null, null], // 5つの専用枠
            trash: [], temporary: 0, directionTemp: 0,
            turn: 1, isFirstPlayer: true, phaseIndex: 0,
            phases: ['ドロー', 'アクト', 'エンド'],
            tokens: { vol: 0, mana: 0, noise: 0, generic: 0 }
        };
        let selectedCardInfo = null;

        document.getElementById('deck-code').addEventListener('input', function() {
            const rawText = this.value;
            const cards = rawText.split(/[\/\n]/).map(c => c.trim()).filter(c => c !== '');
            document.getElementById('deck-count').innerText = `${cards.length} / 60 枚`;
        });

        function changeToken(type, amount) {
            gameState.tokens[type] += amount;
            if (gameState.tokens[type] < 0) gameState.tokens[type] = 0;
            if (type === 'noise' && gameState.tokens.noise > 5) gameState.tokens.noise = 5;
            document.getElementById(`token-${type}`).innerText = gameState.tokens[type];
        }

        function changeTemp(type, amount) {
            gameState[type] += amount;
            if (gameState[type] < 0) gameState[type] = 0;
            document.getElementById(`temp-${type}`).innerText = gameState[type];
        }

        function rollDice() {
            const result = Math.floor(Math.random() * 6) + 1;
            alert(`🎲 ダイスの出目: ${result}`);
        }

        function shuffleDeck() {
            for (let i = gameState.deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [gameState.deck[i], gameState.deck[j]] = [gameState.deck[j], gameState.deck[i]];
            }
            alert("山札をシャッフルしました。");
            renderGame();
        }

        function parseCardCode(code) {
            const cleanCode = code.trim();
            const parts = cleanCode.split('-');
            let typeChar = 'M';
            if (parts.length >= 2) {
                const rightPart = parts[1];
                if (rightPart && rightPart.length > 0) typeChar = rightPart.charAt(0).toUpperCase();
            } else {
                if (cleanCode.includes('A')) typeChar = 'A';
                else if (cleanCode.includes('S')) typeChar = 'S';
                else if (cleanCode.includes('D')) typeChar = 'D';
            }
            const typeMap = { 'A': 'A', 'S': 'S', 'M': 'M', 'D': 'D' };
            return { code: cleanCode, type: typeMap[typeChar] || 'M', img: `images/${cleanCode}.png` };
        }

        function startGame() {
            const codeText = document.getElementById('deck-code').value;
            const lines = codeText.split(/[\/\n]/).map(line => line.trim()).filter(line => line !== '');
            if (lines.length !== 60) {
                alert(`枚数が60枚ではありません。（現在: ${lines.length}枚）`);
                return;
            }
            gameState.deck = lines.map(line => parseCardCode(line));
            gameState.hand = [];
            gameState.stage = [null, null, null, null, null];
            gameState.field = [null, null, null, null, null];
            gameState.trash = []; gameState.temporary = 0; gameState.directionTemp = 0;
            gameState.tokens = { vol: 0, mana: 0, noise: 0, generic: 0 };
            gameState.turn = 1;
            gameState.isFirstPlayer = document.querySelector('input[name="turn-order"]:checked').value === 'first';
            
            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            
            shuffleDeck();
            drawCards(7);
            openModal('mulligan-modal');
            renderGame();
        }

        function drawCards(count) {
            for (let i = 0; i < count; i++) {
                if (gameState.deck.length > 0) gameState.hand.push(gameState.deck.pop());
            }
        }

        function drawFromBottom() {
            if (gameState.deck.length > 0) {
                const card = gameState.deck.shift(); // 一番下から抜く
                gameState.hand.push(card);
                alert("山札の下から1枚ドローしました。");
                renderGame();
            } else {
                alert("山札がありません。");
            }
        }

        function executeMulligan(wantMulligan) {
            closeModal('mulligan-modal');
            if (wantMulligan) {
                gameState.deck.push(...gameState.hand);
                gameState.hand = [];
                for (let i = gameState.deck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [gameState.deck[i], gameState.deck[j]] = [gameState.deck[j], gameState.deck[i]];
                }
                drawCards(7);
            }
            gameState.phaseIndex = 0;
            if (gameState.turn === 1 && gameState.isFirstPlayer) {
                alert("先攻1ターン目のためドローはスキップされます。");
            } else {
                drawCards(1);
            }
            renderGame();
        }
        function discardAllHand() {
            if(confirm("手札をすべてトラッシュしますか？")) {
                gameState.trash.push(...gameState.hand);
                gameState.hand = [];
                renderGame();
            }
        }

        function nextPhase() {
            gameState.phaseIndex++;
            if (gameState.phaseIndex >= gameState.phases.length) {
                // エンドフェーズ自動処理
                gameState.stage.forEach(item => {
                    if (item) {
                        item.attachedSongs = [];
                        if (item.status === 'Standby') item.status = 'Active';
                    }
                });
                gameState.turn++;
                gameState.phaseIndex = 0;
                drawCards(1);
            }
            document.getElementById('current-phase').innerText = gameState.phases[gameState.phaseIndex];
            renderGame();
        }

        function renderGame() {
            document.getElementById('turn-count').innerText = gameState.turn;
            document.getElementById('deck-left').innerText = gameState.deck.length;
            document.getElementById('trash-count').innerText = gameState.trash.length;

            // 5枠のステージ枠の描画
            for (let i = 0; i < 5; i++) {
                const slot = document.getElementById(`stage-slot-${i}`);
                slot.innerHTML = '';
                const item = gameState.stage[i];
                if (item) {
                    const cardDom = createCardDOM(item.card, 'stage', i, item.status);
                    if (item.attachedSongs.length > 0) {
                        const songText = document.createElement('div');
                        songText.className = 'song-overlay';
                        songText.innerText = '♪ ' + item.attachedSongs.map(s => s.code).join(', ');
                        cardDom.appendChild(songText);
                    }
                    slot.appendChild(cardDom);
                }
            }

            // 5枠のDirection枠の描画
            for (let i = 0; i < 5; i++) {
                const slot = document.getElementById(`field-slot-${i}`);
                slot.innerHTML = '';
                const card = gameState.field[i];
                if (card) {
                    slot.appendChild(createCardDOM(card, 'field', i));
                }
            }

            // 手札枠の描画
            const handRow = document.getElementById('hand-row');
            handRow.innerHTML = '';
            gameState.hand.forEach((card, index) => {
                const cardDom = createCardDOM(card, 'hand', index);
                handRow.appendChild(cardDom);
            });
        }

        function createCardDOM(card, zone, index, status = 'Active') {
            const cardDiv = document.createElement('div');
            cardDiv.className = `card ${card.type}`;
            if (status === 'Standby') cardDiv.classList.add('standby');
            
            const imgEl = document.createElement('img');
            imgEl.src = card.img;
            imgEl.className = 'card-img';
            imgEl.onerror = () => { imgEl.style.display = 'none'; };
            cardDiv.appendChild(imgEl);

            const overlay = document.createElement('div');
            overlay.className = 'card-info-overlay';
            overlay.innerHTML = `<div class="card-code-label">${card.code}</div>`;
            cardDiv.appendChild(overlay);

            cardDiv.onclick = (e) => {
                e.stopPropagation();
                handleCardClick(zone, index, card, status);
            };
            return cardDiv;
        }

        function handleCardClick(zone, index, card, status) {
            selectedCardInfo = { zone, index, card, status };
            const container = document.getElementById('action-buttons-container');
            container.innerHTML = '';
            document.getElementById('action-card-title').innerText = card.code;

            if (zone === 'hand') {
                if (card.type === 'A') {
                    // 空いているステージ枠を探して出す
                    createMenuBtn(container, 'ステージの空き枠に登場させる', () => {
                        const emptyIdx = gameState.stage.findIndex(slot => slot === null);
                        if (emptyIdx === -1) { alert("ステージに空き枠がありません！"); return; }
                        gameState.stage[emptyIdx] = { card: card, status: 'Active', attachedSongs: [] };
                        gameState.hand.splice(index, 1); closeActionModal();
                    });
                } else if (card.type === 'S') {
                    gameState.stage.forEach((item, sIdx) => {
                        if (item) {
                            createMenuBtn(container, `枠 [${sIdx+1}] のArtistにSongを使用`, () => {
                                item.attachedSongs.push(card);
                                gameState.hand.splice(index, 1); closeActionModal();
                            });
                        }
                    });
                } else if (card.type === 'D') {
                    createMenuBtn(container, 'Direction枠の空きに出す', () => {
                        const emptyIdx = gameState.field.findIndex(slot => slot === null);
                        if (emptyIdx === -1) { alert("Direction枠に空きがありません！"); return; }
                        gameState.field[emptyIdx] = card;
                        gameState.hand.splice(index, 1); closeActionModal();
                    });
                } else if (card.type === 'M') {
                    createMenuBtn(container, 'Magicを使用 (トラッシュへ)', () => {
                        gameState.trash.push(card);
                        gameState.hand.splice(index, 1); closeActionModal();
                    });
                }
                createMenuBtn(container, 'トラッシュに捨てる', () => {
                    gameState.trash.push(card); gameState.hand.splice(index, 1); closeActionModal();
                });
            } else if (zone === 'stage') {
                createMenuBtn(container, status === 'Active' ? 'Standby(横置)にする' : 'Active(縦置)にする', () => {
                    gameState.stage[index].status = status === 'Active' ? 'Standby' : 'Active'; closeActionModal();
                });
                createMenuBtn(container, 'この枠からトラッシュへ送る', () => {
                    gameState.trash.push(gameState.stage[index].card);
                    gameState.trash.push(...gameState.stage[index].attachedSongs);
                    gameState.stage[index] = null; closeActionModal();
                });
            } else if (zone === 'field') {
                createMenuBtn(container, 'この枠からトラッシュへ送る', () => {
                    gameState.trash.push(gameState.field[index]);
                    gameState.field[index] = null; closeActionModal();
                });
            }
            openModal('action-modal');
        }

        function changeStageCard(index) {
            if(gameState.stage[index] === null) {
                alert("この枠にはカードがありません。手札から登場させてください。");
                return;
            }
            if(confirm(`枠 [${index+1}] のカードを手札に戻しますか？（チェンジ処理）`)) {
                gameState.hand.push(gameState.stage[index].card);
                gameState.trash.push(...gameState.stage[index].attachedSongs);
                gameState.stage[index] = null;
                renderGame();
            }
        }

        function createMenuBtn(parent, text, onClickFn) {
            const btn = document.createElement('button'); btn.className = 'menu-btn'; btn.innerText = text;
            btn.onclick = () => { onClickFn(); renderGame(); }; parent.appendChild(btn);
        }
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function closeActionModal() { closeModal('action-modal'); }
    </script>
</body>
</html>

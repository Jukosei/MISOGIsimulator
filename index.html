<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禊シミュレーター</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1a1a1a;
            --border-color: #333333;
            --btn-blue: #007bff;
            --btn-red: #dc3545;
            --btn-green: #28a745;
            --btn-accent: #e6002d;
            --text-color: #ffffff;
            
            /* カードのサイズ定義 */
            --card-width: 120px;
            --card-height: 168px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* メメインメニュー画面 */
        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .title {
            font-size: 54px;
            font-weight: bold;
            margin-bottom: 35px;
            letter-spacing: 6px;
        }

        .mode-selection {
            display: flex;
            gap: 10px;
            margin-bottom: 35px;
        }

        .mode-btn {
            background-color: #242424;
            color: #8a8a8a;
            border: 1px solid #3a3a3a;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background-color: var(--btn-blue);
            color: #ffffff;
            border-color: var(--btn-blue);
        }

        .input-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .deck-code-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .label-text {
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            align-self: center;
            margin-bottom: 12px;
        }

        .textarea-container {
            width: 100%;
        }

        textarea {
            width: 100%;
            height: 160px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            padding: 15px;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
            outline: none;
        }

        .clear-btn {
            background-color: var(--btn-red);
            color: #ffffff;
            border: none;
            padding: 10px 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 12px;
            transition: background-color 0.2s ease;
        }

        .clear-btn:hover {
            background-color: #c82333;
        }

        .start-btn-container {
            margin-top: 45px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .start-btn {
            background-color: var(--btn-accent);
            color: #ffffff;
            border: none;
            padding: 15px 100px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 2px;
            transition: background-color 0.2s ease;
        }
        /* 対戦画面 */
        .game-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            background-color: #0d0d0d;
            box-sizing: border-box;
            padding: 10px;
            gap: 12px;
        }

        .left-panel {
            width: var(--card-width);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .zone-box {
            background-color: var(--panel-bg);
            border: 2px dashed #444;
            border-radius: 6px;
            width: var(--card-width);
            height: var(--card-height);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-sizing: border-box;
        }

        .zone-box .count-display {
            font-size: 36px;
            font-weight: bold;
        }

        .zone-label {
            font-size: 10px;
            color: #8a8a8a;
            margin-top: 5px;
            text-align: center;
            padding: 0 4px;
        }

        .temporary-tag {
            position: absolute;
            bottom: -22px;
            background-color: var(--btn-green);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            white-space: nowrap;
        }

        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 12px;
        }

        .field-section-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        
        .stage-box { 
            flex: 6; 
            margin-bottom: 20px; 
        }
        .direction-box { 
            flex: 3.2; 
        }

        .field-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .row-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .slot-column-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            gap: 10px; /* ボタンとエリアの隙間 */
            /* 💡 カード縦168px ＋ 半分ずらし2枚分(84px*2) ＝ 合計336pxの高さ空間を確保 */
            height: 340px; 
        }

        /* 💡 3枚重ね用の下地コンテナ */
        .stage-placeholder-stack {
            position: relative;
            width: var(--card-width);
            height: 336px;
        }

        /* 3つの重なるカラー点線枠 */
        .frame-layer {
            position: absolute;
            width: var(--card-width);
            height: var(--card-height);
            border-radius: 6px;
            box-sizing: border-box;
        }
        /* 💡 縦幅168pxに対してぴったり半分（84px刻み）の重ね位置に変更 */
        .frame-layer.layer-1  { top: 0px; border: 2px dashed #1565c0; }  /* 1枚目：青枠 */
        .frame-layer.layer-2  { top: 84px; border: 2px dashed #f9a825; } /* 2枚目：黄枠（半分重ね） */
        .frame-layer.layer-3  { top: 168px; border: 2px dashed #6a1b9a; } /* 3枚目：紫枠（半分重ね） */

        /* Direction用の赤いカラー点線枠 */
        .direction-placeholder {
            width: var(--card-width);
            height: var(--card-height);
            border: 2px dashed #c62828;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .card-container-slot {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .card-container-slot * {
            pointer-events: auto;
        }

        /* 💡 カードエリアの「上側」に単独で綺麗に浮くチェンジボタン */
        .slot-tag-btn {
            background-color: #222;
            color: #aaa;
            font-size: 11px;
            border: 1px solid #444;
            padding: 4px 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }
        .slot-tag-btn:hover {
            background-color: #333;
            color: #fff;
        }
        .slot-tag-btn.selecting {
            background-color: var(--btn-accent);
            color: #fff;
            border-color: var(--btn-accent);
            box-shadow: 0 0 8px var(--btn-accent);
        }
        .hand-area {
            flex: 2.8;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-content: flex-start;
        }

        .game-card {
            width: var(--card-width);
            height: var(--card-height);
            background-color: #333;
            border: 1px solid #555;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .control-panel {
            width: 160px;
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 6px;
        }

        .control-btn {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 8px 5px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
        }
        
        .control-btn.orange { background-color: #ff9f00; }
        .control-btn.gray { background-color: #444; }

        .deck-zone {
            margin-top: auto;
            border: 2px dashed #444;
            background-color: #222;
            border-radius: 6px;
            width: 100%;
            height: var(--card-height);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-sizing: border-box;
        }

        .deck-count {
            font-size: 32px;
            font-weight: bold;
        }

        .deck-label {
            font-size: 10px;
            color: #888;
            margin-top: 4px;
        }

        .counter-panel {
            width: 120px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            padding: 15px 5px;
            box-sizing: border-box;
            justify-content: flex-start;
            gap: 20px;
            height: 100%;
        }

        .counter-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .counter-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }
        .icon-vol { background-color: #ffd700; color: #000; }
        .icon-alpha { background-color: #ff69b4; }
        .icon-beta { background-color: #1e90ff; }
        .icon-omega { background-color: #9400d3; }

        .counter-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .counter-btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
        }

        .counter-value {
            font-size: 24px;
            font-weight: bold;
            width: 30px;
            text-align: center;
        }

        .turn-display {
            margin-top: auto;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            font-size: 12px;
            color: #aaa;
        }
        
        .turn-display span {
            display: block;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- メインメニュー画面 -->
    <div class="menu-container" id="menuScreen">
        <div class="title">禊</div>

        <div class="mode-selection">
            <button class="mode-btn" id="btn1Deck" onclick="selectMode(1)">1デッキモード</button>
            <button class="mode-btn active" id="btn2Deck" onclick="selectMode(2)">2デッキ対戦モード</button>
        </div>

        <div class="input-section">
            <div class="deck-code-area" id="areaPlayer1">
                <div class="label-text" id="labelPlayer1">プレイヤー1のデッキ</div>
                <div class="textarea-container">
                    <textarea id="deckInput1" oninput="saveData()" placeholder="ここにデッキコードを入力してください"></textarea>
                </div>
                <button class="clear-btn" onclick="clearInput(1)">クリア</button>
            </div>

            <div class="deck-code-area" id="areaPlayer2">
                <div class="label-text">プレイヤー2のデッキ</div>
                <div class="textarea-container">
                    <textarea id="deckInput2" oninput="saveData()" placeholder="ここにデッキコードを入力してください"></textarea>
                </div>
                <button class="clear-btn" onclick="clearInput(2)">クリア</button>
            </div>
        </div>

        <div class="start-btn-container">
            <button class="start-btn" onclick="startGame()">ゲーム開始</button>
        </div>
    </div>
    <!-- 対戦画面 -->
    <div class="game-screen" id="gameScreen">
        
        <!-- 左端特殊ゾーン -->
        <div class="left-panel">
            <div class="zone-box">
                <div class="count-display" id="volNoiseCount">0</div>
                <div class="zone-label">VOLノイズ</div>
                <div class="temporary-tag">テンポラリ</div>
            </div>
            <div class="zone-box">
                <div class="count-display" id="trashCount">0</div>
                <div class="zone-label">トラッシュ (表向き)</div>
            </div>
        </div>

        <!-- 中央パネル -->
        <div class="center-panel">
            
            <!-- 🟢 ステージエリア（完全に3重カラー点線枠になり、ボタンが上側に独立） -->
            <div class="field-section-box stage-box">
                <div class="row-label">ステージ</div>
                <div class="field-row">
                    
                    <!-- 1列目 -->
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-0" onclick="clickChangeBtn(0)">チェンジ</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1"></div>
                            <div class="frame-layer layer-2"></div>
                            <div class="frame-layer layer-3"></div>
                            <div class="card-container-slot" id="stage-slot-0"></div>
                        </div>
                    </div>

                    <!-- 2列目 -->
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-1" onclick="clickChangeBtn(1)">チェンジ</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1"></div>
                            <div class="frame-layer layer-2"></div>
                            <div class="frame-layer layer-3"></div>
                            <div class="card-container-slot" id="stage-slot-1"></div>
                        </div>
                    </div>

                    <!-- 3列目 -->
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-2" onclick="clickChangeBtn(2)">チェンジ</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1"></div>
                            <div class="frame-layer layer-2"></div>
                            <div class="frame-layer layer-3"></div>
                            <div class="card-container-slot" id="stage-slot-2"></div>
                        </div>
                    </div>

                    <!-- 4列目 -->
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-3" onclick="clickChangeBtn(3)">チェンジ</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1"></div>
                            <div class="frame-layer layer-2"></div>
                            <div class="frame-layer layer-3"></div>
                            <div class="card-container-slot" id="stage-slot-3"></div>
                        </div>
                    </div>

                    <!-- 5列目 -->
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-4" onclick="clickChangeBtn(4)">チェンジ</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1"></div>
                            <div class="frame-layer layer-2"></div>
                            <div class="frame-layer layer-3"></div>
                            <div class="card-container-slot" id="stage-slot-4"></div>
                        </div>
                    </div>

                </div>
            </div>
            
            <!-- 🟢 Directionエリア -->
            <div class="field-section-box direction-box">
                <div class="row-label">Direction</div>
                <div class="field-row">
                    <div class="direction-placeholder" id="dir-slot-0"></div>
                    <div class="direction-placeholder" id="dir-slot-1"></div>
                    <div class="direction-placeholder" id="dir-slot-2"></div>
                    <div class="direction-placeholder" id="dir-slot-3"></div>
                    <div class="direction-placeholder" id="dir-slot-4"></div>
                </div>
            </div>

            <!-- 下部手札エリア -->
            <div class="hand-area" id="handArea"></div>
        </div>

        <!-- 右コントロールパネル -->
        <div class="control-panel">
            <button class="control-btn" onclick="triggerAction('山札シャッフル')">山札シャッフル</button>
            <button class="control-btn" onclick="triggerAction('山札からサーチ')">山札からサーチ</button>
            <button class="control-btn" onclick="triggerAction('VOLノイズからサーチ')">VOLノイズからサーチ</button>
            <button class="control-btn" onclick="triggerAction('手札を全てトラッシュ')">手札を全てトラッシュ</button>
            <button class="control-btn" onclick="triggerAction('マリガン')">マリガン</button>
            <button class="control-btn" onclick="triggerAction('リセット')">リセット</button>
            <button class="control-btn orange" onclick="nextTurn()">ターンエンド</button>
            <button class="control-btn" onclick="rollDice()">ダイスを振る</button>
            <button class="control-btn" onclick="triggerAction('山札の下から1枚ドロー')">山札の下から1枚ドロー</button>
            
            <button class="control-btn gray" style="margin-top: 10px;" onclick="backToMenu()">メニュー戻る</button>

            <div class="deck-zone" onclick="drawCard()">
                <div class="deck-count" id="deckCount">53</div>
                <div class="deck-label">山札 (クリックドロー)</div>
            </div>
        </div>
        <!-- 一番右端：カウンタ -->
        <div class="counter-panel">
            <div class="counter-item">
                <div class="counter-icon icon-vol">VOL</div>
                <div class="counter-controls">
                    <button class="counter-btn" onclick="changeCounter('vol', -1)">-</button>
                    <div class="counter-value" id="val-vol">0</div>
                    <button class="counter-btn" onclick="changeCounter('vol', 1)">+</button>
                </div>
            </div>
            <div class="counter-item">
                <div class="counter-icon icon-alpha">α</div>
                <div class="counter-controls">
                    <button class="counter-btn" onclick="changeCounter('alpha', -1)">-</button>
                    <div class="counter-value" id="val-alpha">0</div>
                    <button class="counter-btn" onclick="changeCounter('alpha', 1)">+</button>
                </div>
            </div>
            <div class="counter-item">
                <div class="counter-icon icon-beta">β</div>
                <div class="counter-controls">
                    <button class="counter-btn" onclick="changeCounter('beta', -1)">-</button>
                    <div class="counter-value" id="val-beta">0</div>
                    <button class="counter-btn" onclick="changeCounter('beta', 1)">+</button>
                </div>
            </div>
            <div class="counter-item">
                <div class="counter-icon icon-omega">Ω</div>
                <div class="counter-controls">
                    <button class="counter-btn" onclick="changeCounter('omega', -1)">-</button>
                    <div class="counter-value" id="val-omega">0</div>
                    <button class="counter-btn" onclick="changeCounter('omega', 1)">+</button>
                </div>
            </div>

            <div class="turn-display">
                TURN
                <span id="turnCount">1</span>
            </div>
        </div>

    </div>

    <script>
        let currentMode = 2;
        let turn = 1;
        let deckSize = 53;
        const counters = { vol: 0, alpha: 0, beta: 0, omega: 0 };
        let selectedColumnIndex = null;

        window.onload = function() {
            const savedMode = localStorage.getItem('misogi_mode');
            currentMode = savedMode ? parseInt(savedMode) : 2;

            const savedDeck1 = localStorage.getItem('misogi_deck1');
            const savedDeck2 = localStorage.getItem('misogi_deck2');

            if (savedDeck1) document.getElementById('deckInput1').value = savedDeck1;
            if (savedDeck2) document.getElementById('deckInput2').value = savedDeck2;

            selectMode(currentMode);
            
            // テスト用カードを手札に5枚追加
            const handArea = document.getElementById('handArea');
            for(let i=1; i<=5; i++) {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerText = `テストカード ${i}`;
                handArea.appendChild(card);
            }
        };

        function saveData() {
            const deck1 = document.getElementById('deckInput1').value;
            const deck2 = document.getElementById('deckInput2').value;
            localStorage.setItem('misogi_mode', currentMode);
            localStorage.setItem('misogi_deck1', deck1);
            localStorage.setItem('misogi_deck2', deck2);
        }

        function selectMode(mode) {
            currentMode = mode;
            const btn1 = document.getElementById('btn1Deck');
            const btn2 = document.getElementById('btn2Deck');
            const label1 = document.getElementById('labelPlayer1');
            const area2 = document.getElementById('areaPlayer2');

            if (mode === 1) {
                btn1.classList.add('active');
                btn2.classList.remove('active');
                label1.innerText = 'デッキリストを / 区切りで入力してください';
                area2.style.display = 'none';
            } else {
                btn1.classList.remove('active');
                btn2.classList.add('active');
                label1.innerText = 'プレイヤー1のデッキ';
                area2.style.display = 'flex';
            }
            saveData();
        }

        function clearInput(targetNum) {
            document.getElementById(`deckInput${targetNum}`).value = '';
            saveData();
        }

        function startGame() {
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
        }

        function backToMenu() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('menuScreen').style.display = 'flex';
        }

        function changeCounter(type, amount) {
            counters[type] = Math.max(0, counters[type] + amount);
            document.getElementById(`val-${type}`).innerText = counters[type];
        }

        function nextTurn() {
            turn++;
            document.getElementById('turnCount').innerText = turn;
        }

        function rollDice() {
            const result = Math.floor(Math.random() * 6) + 1;
            alert(`ダイスの出目: ${result}`);
        }

        function drawCard() {
            if (deckSize > 0) {
                deckSize--;
                document.getElementById('deckCount').innerText = deckSize;
                
                const handArea = document.getElementById('handArea');
                const newCard = document.createElement('div');
                newCard.className = 'game-card';
                newCard.innerText = `ドローカード`;
                handArea.appendChild(newCard);
            } else {
                alert('山札がありません！');
            }
        }

        // チェンジボタン選択＆スワップ処理
        function clickChangeBtn(index) {
            const currentBtn = document.getElementById(`change-btn-${index}`);

            if (selectedColumnIndex === null) {
                selectedColumnIndex = index;
                currentBtn.classList.add('selecting');
            } else if (selectedColumnIndex === index) {
                currentBtn.classList.remove('selecting');
                selectedColumnIndex = null;
            } else {
                const slotA = document.getElementById(`stage-slot-${selectedColumnIndex}`);
                const slotB = document.getElementById(`stage-slot-${index}`);

                const tempHTML = slotA.innerHTML;
                slotA.innerHTML = slotB.innerHTML;
                slotB.innerHTML = tempHTML;

                document.getElementById(`change-btn-${selectedColumnIndex}`).classList.remove('selecting');
                selectedColumnIndex = null;
            }
        }

        function triggerAction(actionName) {
            alert(`「${actionName}」が実行されました`);
        }
    </script>
</body>
</html>

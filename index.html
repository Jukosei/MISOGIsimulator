<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>禊シミュレーター</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .screen {
      display: none;
      width: 100vw;
      height: 100vh;
    }

    .screen.active {
      display: flex;
    }

    /* ==========================================
       1. メインメニュー スタイル
       ========================================== */
    #main-menu {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #1a1a1a;
    }

    .menu-container {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      text-align: center;
    }

    .title {
      font-size: 3.5rem;
      font-weight: bold;
      letter-spacing: 0.2em;
      margin-bottom: 25px;
    }

    .mode-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-mode {
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background-color: #333;
      color: #aaa;
    }

    .btn-mode.active {
      background-color: #007bff;
      color: #fff;
    }

    .input-label {
      font-size: 0.85rem;
      color: #ccc;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .deck-input {
      width: 100%;
      height: 160px;
      background-color: #242424;
      border: 1px solid #3d3d3d;
      border-radius: 6px;
      color: #fff;
      padding: 12px;
      font-size: 0.95rem;
      resize: none;
      outline: none;
    }

    .action-row {
      display: flex;
      justify-content: flex-start;
      margin: 10px 0 30px;
    }

    .btn-clear {
      padding: 6px 16px;
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-start {
      padding: 12px 50px;
      background-color: #e61f52;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* ==========================================
       2. 対戦画面 スタイル
       ========================================== */
    #battle-screen {
      display: none;
      grid-template-columns: 140px 1fr 180px 100px;
      gap: 8px;
      padding: 8px;
      background-color: #121212;
    }

    /* 共通枠スタイル */
    .slot-box {
      border: 2px dashed #444;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 0.8rem;
      color: #888;
      position: relative;
    }

    /* 左カラム */
    .left-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vol-box {
      height: 120px;
      border-color: #333;
    }
    .vol-box .num {
      font-size: 2.2rem;
      font-weight: bold;
      color: #fff;
    }

    .btn-temporary {
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 10px 0;
      font-weight: bold;
      cursor: pointer;
    }

    .trash-box {
      flex: 1;
      border-color: #333;
      background-size: cover;
      background-position: center;
    }

    /* 中央メインエリア */
    .center-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stage-area {
      flex: 1;
      background-color: #1a1a1a;
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .stage-title {
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 5px;
    }

    .stage-columns {
      display: flex;
      justify-content: space-around;
      height: 100%;
    }

    .column-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 18%;
    }

    .btn-change {
      background: #2b3846;
      color: #8bb2d9;
      border: 1px solid #486585;
      border-radius: 12px;
      padding: 2px 12px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .slot-change { border-color: #2b5278; height: 22%; width: 100%; }
    .slot-orange { border-color: #b5812d; height: 22%; width: 100%; }
    .slot-purple { border-color: #683993; height: 22%; width: 100%; }
    .slot-darkpurple { border-color: #4a2168; height: 22%; width: 100%; }

    .hand-area {
      height: 130px;
      background-color: #1a1a1a;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 8px;
    }

    .hand-slot {
      border: 1.5px dashed #d93838;
      border-radius: 6px;
      width: 18%;
      height: 100%;
    }

    /* 右コントロールエリア */
    .control-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-ctrl {
      background-color: #0056b3;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 4px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-ctrl.yellow { background-color: #d99b00; color: #000; }
    .btn-ctrl.gray { background-color: #444; }

    .deck-box {
      flex: 1;
      border-color: #333;
      margin-top: auto;
    }
    .deck-box .num { font-size: 1.8rem; font-weight: bold; }

    /* 最右サイドバー（ステータス表示） */
    .sidebar-col {
      background-color: #181818;
      border-radius: 6px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .circle-label {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 0.8rem;
    }
    .circle-yellow { background-color: #d9b814; color: #000; }
    .circle-pink { background-color: #d94286; color: #fff; }
    .circle-blue { background-color: #1472d9; color: #fff; }
    .circle-purple { background-color: #8014d9; color: #fff; }

    .counter-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      width: 100%;
    }

    .counter-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-val {
      background-color: #333;
      color: white;
      border: 1px solid #555;
      width: 18px;
      height: 18px;
      border-radius: 2px;
      cursor: pointer;
      font-size: 0.7rem;
    }

    .val-num { font-size: 1.1rem; font-weight: bold; }

    .turn-box {
      margin-top: auto;
      text-align: center;
    }
    .turn-box .label { font-size: 0.65rem; color: #888; letter-spacing: 1px; }
    .turn-box .val { font-size: 1.5rem; font-weight: bold; }
  </style>
</head>
<body>

  <div id="main-menu" class="screen active">
    <div class="menu-container">
      <h1 class="title">禊</h1>
      <div class="mode-buttons">
        <button class="btn-mode active" id="btn-1deck" onclick="selectMode(1)">1デッキモード</button>
        <button class="btn-mode" id="btn-2deck" onclick="selectMode(2)">2デッキ対戦モード</button>
      </div>
      <p class="input-label">デッキリストを / 区切りで入力してください</p>
      <textarea id="deck-text" class="deck-input" placeholder="カードA / カードB / カードC..."></textarea>
      <div class="action-row">
        <button class="btn-clear" onclick="clearInput()">クリア</button>
      </div>
      <button class="btn-start" onclick="startGame()">ゲーム開始</button>
    </div>
  </div>

  <div id="battle-screen" class="screen">
    
    <div class="left-col">
      <div class="slot-box vol-box">
        <div class="num" id="vol-noise-val">0</div>
        <div>VOLノイズ</div>
      </div>
      <button class="btn-temporary">テンポラリー</button>
      <div class="slot-box trash-box">
        <span>トラッシュ</span>
      </div>
    </div>

    <div class="center-col">
      <div class="stage-area">
        <div class="stage-title">ステージ</div>
        <div class="stage-columns">
          <script>
            for(let i=0; i<5; i++) {
              document.write(`
                <div class="column-group">
                  <button class="btn-change">チェンジ</button>
                  <div class="slot-box slot-change"></div>
                  <div class="slot-box slot-orange"></div>
                  <div class="slot-box slot-purple"></div>
                  <div class="slot-box slot-darkpurple"></div>
                </div>
              `);
            }
          </script>
        </div>
      </div>
      <div class="hand-area">
        <div class="hand-slot"></div>
        <div class="hand-slot"></div>
        <div class="hand-slot"></div>
        <div class="hand-slot"></div>
        <div class="hand-slot"></div>
      </div>
    </div>

    <div class="control-col">
      <button class="btn-ctrl">山札シャッフル</button>
      <button class="btn-ctrl">山札からサーチ</button>
      <button class="btn-ctrl">VOLノイズからサーチ</button>
      <button class="btn-ctrl">手札を全てトラッシュ</button>
      <button class="btn-ctrl">マリガン</button>
      <button class="btn-ctrl">リセット</button>
      <button class="btn-ctrl yellow">ターンエンド</button>
      <button class="btn-ctrl">ダイスを振る</button>
      <button class="btn-ctrl">山札の下から1枚ドロー</button>
      <button class="btn-ctrl gray" onclick="backToMenu()">メニュー戻る</button>

      <div class="slot-box deck-box">
        <div class="num" id="deck-count">59</div>
        <span style="font-size:0.6rem; color:#aaa;">山札 (ドロー/戻し)</span>
      </div>
    </div>

    <div class="sidebar-col">
      <div class="counter-group">
        <div class="circle-label circle-yellow">VOL</div>
      </div>

      <div class="counter-group">
        <div class="circle-label circle-pink">α</div>
        <div class="counter-row">
          <button class="btn-val" onclick="changeVal('alpha', -1)">-</button>
          <span class="val-num" id="val-alpha">0</span>
          <button class="btn-val" onclick="changeVal('alpha', 1)">+</button>
        </div>
      </div>

      <div class="counter-group">
        <div class="circle-label circle-blue">β</div>
        <div class="counter-row">
          <button class="btn-val" onclick="changeVal('beta', -1)">-</button>
          <span class="val-num" id="val-beta">0</span>
          <button class="btn-val" onclick="changeVal('beta', 1)">+</button>
        </div>
      </div>

      <div class="counter-group">
        <div class="circle-label circle-purple">Ω</div>
        <div class="counter-row">
          <button class="btn-val" onclick="changeVal('omega', -1)">-</button>
          <span class="val-num" id="val-omega">0</span>
          <button class="btn-val" onclick="changeVal('omega', 1)">+</button>
        </div>
      </div>

      <div class="turn-box">
        <div class="label">TURN</div>
        <div class="val" id="turn-val">1</div>
      </div>
    </div>

  </div>

  <script>
    let currentMode = 1;
    const counters = { alpha: 0, beta: 0, omega: 0 };

    function selectMode(mode) {
      currentMode = mode;
      document.getElementById('btn-1deck').classList.toggle('active', mode === 1);
      document.getElementById('btn-2deck').classList.toggle('active', mode === 2);
    }

    function clearInput() {
      document.getElementById('deck-text').value = '';
    }

    function startGame() {
      document.getElementById('main-menu').classList.remove('active');
      document.getElementById('battle-screen').style.display = 'grid';
    }

    function backToMenu() {
      document.getElementById('battle-screen').style.display = 'none';
      document.getElementById('main-menu').classList.add('active');
    }

    function changeVal(key, delta) {
      counters[key] = Math.max(0, counters[key] + delta);
      document.getElementById(`val-${key}`).textContent = counters[key];
    }
  </script>
</body>
</html>

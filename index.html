<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禊シミュレーター</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --text-color: #ffffff;
            --accent-color: #ff0055;
            --artist-color: #22a6b3;
            --song-color: #be2edd;
            --magic-color: #f0932b;
            --direction-color: #6ab04c;
            --token-color: #f1c40f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .screen {
            display: none !important;
            min-height: 100vh;
            padding: 15px;
        }

        .screen.active {
            display: flex !important;
            flex-direction: column;
        }

        #menu-screen {
            justify-content: center;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 6px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            width: 100%;
            font-weight: 900;
        }
        .form-group {
            width: 100%;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: var(--card-bg);
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            padding: 10px;
            font-family: monospace;
            resize: none;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 6px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        #game-screen {
            padding: 10px;
            gap: 10px;
            height: 100vh;
            max-height: 100vh;
            justify-content: space-between;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .phase-indicator {
            font-weight: bold;
            color: var(--accent-color);
        }

        .sidebar {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.8rem;
        }

        .counter-group {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .count-btn {
            background: #444;
            color: white;
            border: none;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        .battlefield {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            margin: 5px 0;
        }

        .zone {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px dashed #444;
            border-radius: 8px;
            padding: 8px;
            min-height: 130px;
        }

        .zone-title {
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .card-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .hand-container {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 8px;
        }

        #hand {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            min-height: 115px;
        }

        .card {
            width: 72px;
            height: 108px;
            background-color: #2a2a30;
            border-radius: 6px;
            border: 2px solid #666;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        .card-info-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            background: rgba(0,0,0,0.35);
        }

        .card.A { border-color: var(--artist-color); }
        .card.S { border-color: var(--song-color); }
        .card.M { border-color: var(--magic-color); }
        .card.D { border-color: var(--direction-color); }

        .card-type-tag {
            font-size: 0.45rem;
            padding: 1px 2px;
            border-radius: 2px;
            color: #fff;
            font-weight: bold;
            align-self: flex-start;
        }
        .card.A .card-type-tag { background-color: var(--artist-color); }
        .card.S .card-type-tag { background-color: var(--song-color); }
        .card.M .card-type-tag { background-color: var(--magic-color); }
        .card.D .card-type-tag { background-color: var(--direction-color); }

        .card.standby {
            transform: rotate(90deg);
            margin: 0 16px;
        }

        .card-status {
            position: absolute;
            bottom: 2px; right: 2px;
            background: rgba(0,0,0,0.8);
            padding: 1px 3px;
            border-radius: 3px;
            font-size: 0.45rem;
            z-index: 3;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal.active { display: flex; }

        .modal-content {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #2a2a30;
            color: white;
            border: 1px solid #444;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
        }
        .menu-btn:hover { background: #3a3a42; }
        .menu-btn.cancel { background: #555; text-align: center; margin-top: 10px;}

        @media (min-width: 768px) {
            #game-screen.active {
                display: grid !important;
                grid-template-columns: 260px 1fr;
                grid-template-rows: auto 1fr auto;
            }
            .info-bar { grid-column: 1 / span 2; }
            .sidebar { grid-column: 1; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 12px; padding: 15px;}
            .battlefield { grid-column: 2; height: 100%; margin: 0; overflow-y: auto;}
            .hand-container { grid-column: 1 / span 2; }
        }
    </style>
</head>
<body>

    <div id="menu-screen" class="screen active">
        <h1>禊</h1>
        <div class="form-group">
            <label for="deck-code">デッキコード (スラッシュ「/」区切り または 改行区切り)</label>
            <textarea id="deck-code" placeholder="例: GA-13/GA-13/DA-34/JS-40/exD-1..."></textarea>
            <div id="deck-count" style="font-size: 0.8rem; color: #888; text-align: right;">0 / 60 枚</div>
        </div>
        <div class="form-group">
            <label>対戦の手番</label>
            <div class="radio-group">
                <label><input type="radio" name="turn-order" value="first" checked> 先攻</label>
                <label><input type="radio" name="turn-order" value="second"> 後攻</label>
            </div>
        </div>
        <button class="btn" onclick="startGame()">対戦開始</button>
    </div>

    <div id="game-screen" class="screen">
        <div class="info-bar">
            <div>ターン: <span id="turn-count">1</span> (<span id="player-order-display">先攻</span>)</div>
            <div class="phase-indicator">フェーズ: <span id="current-phase">ドロー</span></div>
            <button class="btn" id="next-phase-btn" onclick="nextPhase()" style="width: auto; margin:0; padding:6px 12px; font-size:0.8rem;">次のフェーズへ</button>
        </div>
        
        <div class="sidebar">
            <div>🎴 ③ デッキ: <span id="deck-left">60</span> 枚</div>
            <div>🗑️ ④ トラッシュ: <span id="trash-count">0</span> 枚</div>
            
            <div class="counter-group">
                <span>🔮 ⑤ 魔力: <span id="token-mana">0</span></span>
                <button class="count-btn" onclick="changeToken('mana', 1)">+</button>
                <button class="count-btn" onclick="changeToken('mana', -1)">-</button>
            </div>
            <div class="counter-group">
                <span>⭐ ⑥ VOL: <span id="token-vol">0</span></span>
                <button class="count-btn" onclick="changeToken('vol', 1)">+</button>
                <button class="count-btn" onclick="changeToken('vol', -1)">-</button>
            </div>
            <div class="counter-group">
                <span>⚠️ ⑦ ノイズ: <span id="token-noise">0</span> / 5</span>
                <button class="count-btn" onclick="changeToken('noise', 1)">+</button>
                <button class="count-btn" onclick="changeToken('noise', -1)">-</button>
            </div>
        </div>

        <div class="battlefield">
            <div class="zone" id="stage-zone">
                <div class="zone-title">① ステージ (Artist / Song) <span id="stage-count" style="color:#aaa;">(0/5)</span></div>
                <div class="card-row" id="stage-row"></div>
            </div>
            <div class="zone" id="field-zone">
                <div class="zone-title">② 場 (Direction) <span id="field-count-label" style="color:#aaa;">(0/5)</span></div>
                <div class="card-row" id="field-row"></div>
            </div>
        </div>

        <div class="hand-container">
            <div class="zone-title">手札 (<span id="hand-count">0</span>枚)</div>
            <div id="hand"></div>
        </div>
    </div>

    <div id="mulligan-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">マリガン（引き直し）をしますか？</div>
            <button class="btn" onclick="executeMulligan(true)" style="background:#333; margin-bottom:10px;">マリガンする</button>
            <button class="btn" onclick="executeMulligan(false)">このまま開始</button>
        </div>
    </div>

    <div id="action-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title" id="action-card-title">カード名</div>
            <div id="action-buttons-container"></div>
            <button class="menu-btn cancel" onclick="closeActionModal()">閉じる</button>
        </div>
    </div>
    <script>
        let gameState = {
            deck: [], hand: [], stage: [], field: [], trash: [],
            turn: 1, isFirstPlayer: true, phaseIndex: 0,
            phases: ['ドロー', 'アクト', 'エンド'],
            tokens: { mana: 0, vol: 0, noise: 0 }
        };
        let selectedCardInfo = null;

        document.getElementById('deck-code').addEventListener('input', function() {
            const rawText = this.value;
            const cards = rawText.split(/[\/\n]/).map(c => c.trim()).filter(c => c !== '');
            document.getElementById('deck-count').innerText = `${cards.length} / 60 枚`;
        });

        function changeToken(type, amount) {
            gameState.tokens[type] += amount;
            if (gameState.tokens[type] < 0) gameState.tokens[type] = 0;
            if (type === 'noise' && gameState.tokens.noise > 5) gameState.tokens.noise = 5;
            document.getElementById(`token-${type}`).innerText = gameState.tokens[type];
        }

        function parseCardCode(code) {
            const cleanCode = code.trim();
            const parts = cleanCode.split('-');
            let typeChar = 'M';
            
            if (parts.length >= 2) {
                const rightPart = parts[1];
                if (rightPart && rightPart.length > 0) {
                    typeChar = rightPart.charAt(0).toUpperCase();
                }
            } else {
                if (cleanCode.includes('A')) typeChar = 'A';
                else if (cleanCode.includes('S')) typeChar = 'S';
                else if (cleanCode.includes('D')) typeChar = 'D';
            }
            
            const typeMap = { 'A': 'A', 'S': 'S', 'M': 'M', 'D': 'D' };
            const imagePath = `images/${cleanCode}.png`;

            return { code: cleanCode, type: typeMap[typeChar] || 'M', img: imagePath };
        }

        function startGame() {
            const codeText = document.getElementById('deck-code').value;
            const lines = codeText.split(/[\/\n]/).map(line => line.trim()).filter(line => line !== '');
            if (lines.length !== 60) {
                alert(`枚数が60枚ではありません。（現在: ${lines.length}枚）`);
                return;
            }
            gameState.deck = lines.map(line => parseCardCode(line));
            gameState.hand = []; gameState.stage = []; gameState.field = []; gameState.trash = [];
            gameState.turn = 1; gameState.tokens = { mana: 0, vol: 0, noise: 0 };
            
            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            document.getElementById('player-order-display').innerText = gameState.isFirstPlayer ? "先攻" : "後攻";
            
            document.getElementById('token-mana').innerText = 0;
            document.getElementById('token-vol').innerText = 0;
            document.getElementById('token-noise').innerText = 0;

            shuffle(gameState.deck);
            drawCards(7);
            openModal('mulligan-modal');
            renderGame();
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function drawCards(count) {
            for (let i = 0; i < count; i++) {
                if (gameState.deck.length > 0) gameState.hand.push(gameState.deck.pop());
            }
        }

        function executeMulligan(wantMulligan) {
            closeModal('mulligan-modal');
            if (wantMulligan) {
                gameState.deck.push(...gameState.hand);
                gameState.hand = [];
                shuffle(gameState.deck);
                drawCards(7);
                renderGame();
            }
            startDrawPhase();
        }
        function startDrawPhase() {
            gameState.phaseIndex = 0;
            updatePhaseDisplay();
            if (gameState.turn === 1 && gameState.isFirstPlayer) {
                alert("先攻1ターン目のためドローはスキップされます。");
            } else {
                drawCards(1);
            }
            renderGame();
        }

        function nextPhase() {
            gameState.phaseIndex++;
            if (gameState.phaseIndex >= gameState.phases.length) {
                runEndPhaseLogic();
                gameState.turn++;
                startDrawPhase();
                return;
            }
            updatePhaseDisplay();
        }

        function updatePhaseDisplay() {
            document.getElementById('current-phase').innerText = gameState.phases[gameState.phaseIndex];
            document.getElementById('next-phase-btn').innerText = gameState.phaseIndex === 2 ? "ターン終了" : "次のフェーズへ";
        }

        function runEndPhaseLogic() {
            gameState.stage.forEach(artistObj => {
                if (artistObj.attachedSongs && artistObj.attachedSongs.length > 0) {
                    gameState.trash.push(...artistObj.attachedSongs);
                    artistObj.attachedSongs = [];
                }
                if (artistObj.status === 'Standby') artistObj.status = 'Active';
            });
            renderGame();
        }

        function renderGame() {
            document.getElementById('turn-count').innerText = gameState.turn;
            document.getElementById('deck-left').innerText = gameState.deck.length;
            document.getElementById('trash-count').innerText = gameState.trash.length;
            document.getElementById('hand-count').innerText = gameState.hand.length;
            
            document.getElementById('stage-count').innerText = `(${gameState.stage.length}/5)`;
            document.getElementById('field-count-label').innerText = `(${gameState.field.length}/5)`;

            const handEl = document.getElementById('hand'); handEl.innerHTML = '';
            gameState.hand.forEach((card, index) => { handEl.appendChild(createCardDOM(card, 'hand', index)); });

            const stageRow = document.getElementById('stage-row'); stageRow.innerHTML = '';
            gameState.stage.forEach((item, index) => {
                const cardDom = createCardDOM(item.card, 'stage', index, item.status);
                if (item.attachedSongs.length > 0) {
                    const songListText = document.createElement('div');
                    songListText.style.fontSize = '0.55rem'; songListText.style.color = 'var(--song-color)';
                    songListText.style.background = 'rgba(0,0,0,0.8)';
                    songListText.style.padding = '2px';
                    songListText.innerText = '♪ ' + item.attachedSongs.map(s => s.code).join(', ');
                    cardDom.appendChild(songListText);
                }
                stageRow.appendChild(cardDom);
            });

            const fieldRow = document.getElementById('field-row'); fieldRow.innerHTML = '';
            gameState.field.forEach((card, index) => { fieldRow.appendChild(createCardDOM(card, 'field', index)); });
        }

        function createCardDOM(card, zone, index, status = 'Active') {
            const cardDiv = document.createElement('div');
            cardDiv.className = `card ${card.type}`;
            if (status === 'Standby') cardDiv.classList.add('standby');
            
            const typeNames = { 'A': 'ARTIST', 'S': 'SONG', 'M': 'MAGIC', 'D': 'DIRECTION' };
            
            const imgEl = document.createElement('img');
            imgEl.src = card.img;
            imgEl.className = 'card-img';
            imgEl.onerror = () => { imgEl.style.display = 'none'; };
            cardDiv.appendChild(imgEl);

            const overlay = document.createElement('div');
            overlay.className = 'card-info-overlay';
            overlay.innerHTML = `<div style="font-weight:bold; font-size:0.6rem; background:rgba(0,0,0,0.6); padding:1px 2px; border-radius:2px;">${card.code}</div><div class="card-type-tag">${typeNames[card.type]}</div>`;
            cardDiv.appendChild(overlay);

            if (zone === 'stage') {
                const statusTag = document.createElement('div');
                statusTag.className = 'card-status'; statusTag.innerText = status === 'Active' ? 'Act' : 'Sby';
                cardDiv.appendChild(statusTag);
            }
            
            cardDiv.onclick = () => handleCardClick(zone, index, card, status);
            return cardDiv;
        }

        function handleCardClick(zone, index, card, status) {
            selectedCardInfo = { zone, index, card, status };
            const container = document.getElementById('action-buttons-container');
            container.innerHTML = '';
            document.getElementById('action-card-title').innerText = `${card.code} (${zone.toUpperCase()})`;

            if (zone === 'hand') {
                if (card.type === 'A') {
                    createMenuBtn(container, '① ステージに出す (Artist)', () => {
                        if(gameState.stage.length >= 5) { alert("ステージには5枚までしか登場させられません！"); return; }
                        gameState.stage.push({ card: card, status: 'Active', attachedSongs: [] });
                        gameState.hand.splice(index, 1); closeActionModal();
                    });
                } else if (card.type === 'S') {
                    gameState.stage.forEach((artistObj, aIdx) => {
                        createMenuBtn(container, `Artist [${artistObj.card.code}] にSongを使用`, () => {
                            artistObj.attachedSongs.push(card); gameState.hand.splice(index, 1); closeActionModal();
                        });
                    });
                } else if (card.type === 'M') {
                    createMenuBtn(container, 'Magicを使用 (トラッシュへ)', () => {
                        gameState.trash.push(card); gameState.hand.splice(index, 1); closeActionModal();
                    });
                } else if (card.type === 'D') {
                    createMenuBtn(container, '② 場(フィールド)に出す (Direction)', () => {
                        if(gameState.field.length >= 5) { alert("場には5枚までしか置けません！"); return; }
                        const isDuplicate = gameState.field.some(c => c.code === card.code);
                        if(isDuplicate) { alert("場に同じ名前のカードは1枚までしか置けません！"); return; }
                        gameState.field.push(card); gameState.hand.splice(index, 1); closeActionModal();
                    });
                }
                createMenuBtn(container, '手札からトラッシュに捨てる', () => {
                    gameState.trash.push(card); gameState.hand.splice(index, 1); closeActionModal();
                });
            } else if (zone === 'stage') {
                createMenuBtn(container, status === 'Active' ? 'Standby(横置)にする' : 'Active(縦置)にする', () => {
                    gameState.stage[index].status = status === 'Active' ? 'Standby' : 'Active'; closeActionModal();
                });
                createMenuBtn(container, 'トラッシュに送る', () => {
                    gameState.trash.push(gameState.stage[index].card);
                    if(gameState.stage[index].attachedSongs) gameState.trash.push(...gameState.stage[index].attachedSongs);
                    gameState.stage.splice(index, 1); closeActionModal();
                });
            } else if (zone === 'field') {
                createMenuBtn(container, 'トラッシュへ送る', () => {
                    gameState.trash.push(gameState.field[index]); gameState.field.splice(index, 1); closeActionModal();
                });
            }
            openModal('action-modal');
        }

        function createMenuBtn(parent, text, onClickFn) {
            const btn = document.createElement('button'); btn.className = 'menu-btn'; btn.innerText = text;
            btn.onclick = () => { onClickFn(); renderGame(); }; parent.appendChild(btn);
        }
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function closeActionModal() { closeModal('action-modal'); }
    </script>
</body>
</html>

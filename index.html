<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>禊シミュレーター</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1a1a1a;
            --border-color: #333333;
            --btn-blue: #007bff;
            --btn-red: #dc3545;
            --btn-green: #28a745;
            --btn-accent: #e6002d;
            --text-color: #ffffff;
            --card-width: 120px;
            --card-height: 168px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: none;
            user-select: none;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            padding: 40px 20px;
            box-sizing: border-box;
            touch-action: auto;
        }

        .title {
            font-size: 54px;
            font-weight: bold;
            margin-bottom: 35px;
            letter-spacing: 6px;
        }

        .mode-selection {
            display: flex;
            gap: 10px;
            margin-bottom: 35px;
        }

        .mode-btn {
            background-color: #242424;
            color: #8a8a8a;
            border: 1px solid #3a3a3a;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .mode-btn.active {
            background-color: var(--btn-blue);
            color: #ffffff;
            border-color: var(--btn-blue);
        }

        .input-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .deck-code-area {
            width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .label-text {
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            align-self: center;
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            height: 160px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            padding: 15px;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
            outline: none;
        }

        .clear-btn {
            background-color: var(--btn-red);
            color: #ffffff;
            border: none;
            padding: 10px 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 12px;
        }

        .start-btn {
            background-color: var(--btn-accent);
            color: #ffffff;
            border: none;
            padding: 15px 100px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 45px;
            letter-spacing: 2px;
        }

        .game-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            background-color: #0d0d0d;
            box-sizing: border-box;
            padding: 10px;
            gap: 14px;
        }

        .left-panel {
            width: 160px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            box-sizing: border-box;
            padding-bottom: 15px;
        }

        .zone-box {
            background-color: var(--panel-bg);
            border: 2px dashed #444;
            border-radius: 6px;
            width: 150px;
            height: 225px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            position: relative;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .zone-box .count-display {
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0px 0px 4px #000, 0px 0px 4px #000;
        }

        .zone-label {
            font-size: 10px;
            color: #8a8a8a;
            margin-top: 5px;
            text-align: center;
            text-shadow: 0px 0px 4px #000, 0px 0px 4px #000;
        }

        .zone-box.drag-over {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: #fff;
        }

        .temporary-btn-green {
            width: 100%;
            background-color: var(--btn-green);
            color: white;
            font-size: 12px;
            font-weight: bold;
            border: none;
            padding: 10px 0;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            margin: auto 0;
        }

        .center-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 12px;
            flex: 1;
        }

        .field-section-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .stage-box {
            flex: 6.4;
            margin-bottom: 20px;
        }

        .direction-box {
            flex: 2.8;
        }

        .field-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .row-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .slot-column-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            gap: 8px;
            height: 380px;
        }

        .stage-placeholder-stack {
            position: relative;
            width: var(--card-width);
            height: 336px;
            margin-top: -6px;
        }

        .frame-layer {
            position: absolute;
            width: var(--card-width);
            height: var(--card-height);
            border-radius: 6px;
            box-sizing: border-box;
            z-index: 5;
        }

        .frame-layer.layer-1 { top: 0px; border: 2px dashed #1565c0; }
        .frame-layer.layer-2 { top: 84px; border: 2px dashed #f9a825; }
        .frame-layer.layer-3 { top: 168px; border: 2px dashed #6a1b9a; }

        .frame-layer.drag-over {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .direction-placeholder {
            width: var(--card-width);
            height: var(--card-height);
            border: 2px dashed #c62828;
            border-radius: 6px;
            box-sizing: border-box;
            position: relative;
        }

        .direction-placeholder.drag-over {
            background-color: rgba(198, 40, 40, 0.1);
        }

        .frame-layer .game-card, .direction-placeholder .game-card {
            position: absolute;
            top: 0;
            left: 0;
            margin: 0;
            width: 100%;
            height: 100%;
        }

        .slot-tag-btn {
            background-color: #222;
            color: #aaa;
            font-size: 11px;
            border: 1px solid #444;
            padding: 4px 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            z-index: 20;
        }

        .slot-tag-btn.selecting {
            background-color: var(--btn-accent);
            color: #fff;
            border-color: var(--btn-accent);
        }

        .hand-area {
            flex: 2.8;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-content: flex-start;
            touch-action: auto;
        }

        .game-card {
            width: var(--card-width);
            height: var(--card-height);
            background-color: #333;
            border: 1px solid #555;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: grab;
            box-sizing: border-box;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            text-shadow: 0px 0px 4px #000, 0px 0px 4px #000;
            touch-action: none;
        }

        .game-card.dragging {
            opacity: 0.8 !important;
            position: fixed !important;
            z-index: 9999 !important;
            pointer-events: none !important;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            transform: scale(1.05);
        }

        .control-panel {
            width: 170px;
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 6px;
            touch-action: auto;
        }

        .control-btn {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
        }

        .control-btn.orange { background-color: #ff9f00; }
        .control-btn.gray { background-color: #444; }

        .deck-zone {
    margin-top: auto;
    border: 2px dashed #444;
    background-color: #222;
    border-radius: 6px;

    /* 幅と高さをVOLノイズと同じサイズに強力固定 */
    width: 150px !important;
    height: 225px !important;
    box-sizing: border-box;

    /* 背景画像設定 */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-left: auto;
    margin-right: auto;
}

        .deck-count { font-size: 32px; font-weight: bold; }
        .deck-label { font-size: 10px; color: #888; margin-top: 4px; }

        .counter-panel {
            width: 140px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            padding: 20px 5px;
            box-sizing: border-box;
            justify-content: flex-start;
            gap: 22px;
            height: 100%;
            touch-action: auto;
        }

        .counter-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .counter-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }

        .icon-vol { background-color: #ffd700; color: #000; }
        .icon-alpha { background-color: #ff69b4; }
        .icon-beta { background-color: #1e90ff; }
        .icon-omega { background-color: #9400d3; }

        .counter-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .counter-btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .counter-value {
            font-size: 28px;
            font-weight: bold;
            width: 35px;
            text-align: center;
        }

        .turn-display {
            margin-top: auto;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            font-size: 13px;
            color: #aaa;
        }

        .turn-display span {
            display: block;
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
        }

        .search-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            justify-content: center;
            align-items: flex-start;
            padding-top: 25px;
            box-sizing: border-box;
        }

        .search-overlay.dragging-mode {
            background-color: rgba(0, 0, 0, 0.2);
        }

        .search-overlay.dragging-mode .search-modal {
            opacity: 0.3;
        }

        .search-modal {
            background-color: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            width: 85%;
            max-width: 900px;
            height: 62%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            pointer-events: auto;
        }

        .search-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .search-modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        .search-modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 28px;
            cursor: pointer;
            font-weight: bold;
            pointer-events: auto;
        }

        .search-modal-close:hover { color: #fff; }

        .search-card-grid {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            content-align: flex-start;
            padding: 5px;
            pointer-events: auto;
        }

        .search-modal .game-card {
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .search-modal .game-card:hover {
            transform: scale(1.03);
            border-color: #fff;
        }

        .action-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.6);
            z-index: 20000;
            justify-content: center;
            align-items: center;
        }

        .action-box {
            background-color: #1e1e1e;
            border: 2px solid #555;
            border-radius: 8px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            max-width: 320px;
            width: 80%;
        }

        .action-title {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            text-align: center;
            margin-bottom: 6px;
            word-break: break-all;
        }

        .action-btn {
            width: 100%;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .action-btn:hover {
            background-color: var(--btn-blue);
            border-color: var(--btn-blue);
        }

        .action-btn.cancel {
            background-color: #444;
            margin-top: 6px;
        }

        .action-btn.cancel:hover {
            background-color: var(--btn-red);
            border-color: var(--btn-red);
        }

       .card-rotate-horizontal {
    transform: rotate(90deg) !important;
    transition: transform 0.2s ease;
}

        /* ディレクションエリアでタップ（薄暗く）状態にするスタイル */
.card-dimmed {
    filter: brightness(0.5) !important;
    transition: filter 0.2s ease;
}

        /* 自動消滅トースト通知のスタイル */
.toast-message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: rgba(0, 0, 0, 0.85);
    color: #ffffff;
    padding: 16px 32px;
    border-radius: 8px;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 2px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    pointer-events: none; /* ゲーム操作を邪魔しない */
    opacity: 0;
    transition: opacity 0.2s ease-in-out;
    z-index: 9999;
}

.toast-message.show {
    opacity: 1;
}

        /* ドラッグ中にオーバーレイ背景のクリック判定を透過させる */
#searchOverlay.dragging-mode {
    pointer-events: none !important;
}

/* モーダル内部のカード自体はドラッグ可能にする */
#searchOverlay .game-card {
    pointer-events: auto !important;
}

        /* ドラッグ中のみモーダル全体のマウス判定をオフにする */
#searchOverlay.dragging-mode,
.modal.dragging-mode {
    pointer-events: none !important;
}
        
    </style>
</head>
<body>
    <div class="menu-container" id="menuScreen">
        <div class="title">禊</div>
        <div class="mode-selection">
            <button class="mode-btn" id="btn1Deck" onclick="selectMode(1)">1デッキモード</button>
            <button class="mode-btn active" id="btn2Deck" onclick="selectMode(2)">2デッキ対戦モード</button>
        </div>
        <div class="input-section">
            <div class="deck-code-area" id="areaPlayer1">
                <div class="label-text" id="labelPlayer1">プレイヤー1のデッキ</div>
                <div class="textarea-container"><textarea id="deckInput1" oninput="saveDeckInputs()"></textarea></div>
                <button class="clear-btn" onclick="clearInput(1)">クリア</button>
            </div>
            <div class="deck-code-area" id="areaPlayer2">
                <div class="label-text">プレイヤー2のデッキ</div>
                <div class="textarea-container"><textarea id="deckInput2" oninput="saveDeckInputs()"></textarea></div>
                <button class="clear-btn" onclick="clearInput(2)">クリア</button>
            </div>
        </div>
        <button class="start-btn" onclick="startGame()">ゲーム開始</button>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="left-panel">
            <div class="zone-box" id="volNoiseZone" onclick="openVolNoiseModal()" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToVolNoise(event)" style="cursor: pointer;">
    <div class="count-display" id="volNoiseCount">0</div>
    <div class="zone-label">VOLノイズ（確認はクリック）</div>
</div>     
            
            <button class="temporary-btn-green" onclick="triggerAction('テンポラリー表示')">テンポラリー</button>
            <div class="zone-box" id="trashZone" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToTrash(event)">
                <div class="count-display" id="trashCount">0</div>
                <div class="zone-label">トラッシュ (確認はクリック)</div>
            </div>
        </div>

        <div class="center-panel">
            <div class="field-section-box stage-box">
                <div class="row-label">ステージ</div>
                <div class="field-row">
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-0" onclick="clickChangeBtn(0)">チェンジ</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1" id="frame-0-1" data-type="stage" data-col="0" data-layer="1" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,0,1)"></div>
                            <div class="frame-layer layer-2" id="frame-0-2" data-type="stage" data-col="0" data-layer="2" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,0,2)"></div>
                            <div class="frame-layer layer-3" id="frame-0-3" data-type="stage" data-col="0" data-layer="3" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,0,3)"></div>
                        </div>
                    </div>
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-1" onclick="clickChangeBtn(1)">チェンジ</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1" id="frame-1-1" data-type="stage" data-col="1" data-layer="1" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,1,1)"></div>
                            <div class="frame-layer layer-2" id="frame-1-2" data-type="stage" data-col="1" data-layer="2" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,1,2)"></div>
                            <div class="frame-layer layer-3" id="frame-1-3" data-type="stage" data-col="1" data-layer="3" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,1,3)"></div>
                        </div>
                    </div>
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-2" onclick="clickChangeBtn(2)">チェンジ</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1" id="frame-2-1" data-type="stage" data-col="2" data-layer="1" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,2,1)"></div>
                            <div class="frame-layer layer-2" id="frame-2-2" data-type="stage" data-col="2" data-layer="2" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,2,2)"></div>
                            <div class="frame-layer layer-3" id="frame-2-3" data-type="stage" data-col="2" data-layer="3" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,2,3)"></div>
                        </div>
                    </div>
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-3" onclick="clickChangeBtn(3)">チェンジ</button>
                        <div class="stage-placeholder-stack">
                            <div class="frame-layer layer-1" id="frame-3-1" data-type="stage" data-col="3" data-layer="1" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,3,1)"></div>
                            <div class="frame-layer layer-2" id="frame-3-2" data-type="stage" data-col="3" data-layer="2" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,3,2)"></div>
                            <div class="frame-layer layer-3" id="frame-3-3" data-type="stage" data-col="3" data-layer="3" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropToSpecificFrame(event,3,3)"></div>
                        </div>
                    </div>
                    <div class="slot-column-wrapper">
                        <button class="slot-tag-btn" id="change-btn-4" onclick="clickChangeBtn(4)">チェンジ</button>

            // ゲーム開始時・再スタート時の状態リセット処理
function startGame() {
    // ★ 1. 盤面（ステージ・ディレクション・チェンジ・スロット等）のカード要素をすべて削除
    const boardCards = document.querySelectorAll('.stage-zone *, .direction-zone *, [class*="stage"] *, [class*="direction"] *, [class*="change"] *, [class*="slot"] *');
    boardCards.forEach(el => {
        if (el.classList.contains('card') || el.classList.contains('game-card') || el.tagName === 'IMG' || el.getAttribute('draggable') === 'true') {
            el.remove();
        }
    });

    // ★ 2. VOLノイズおよびトラッシュ枠内のカード表示DOM要素を直接削除（山札deckは除く）
    const specialZoneCards = document.querySelectorAll('#volNoise *, .vol-noise *, [class*="volnoise"] *, #trash *, .trash *, [class*="trash"] *');
    specialZoneCards.forEach(el => {
        if (el.classList.contains('card') || el.classList.contains('game-card') || el.tagName === 'IMG') {
            el.remove();
        }
    });

    // ★ 3. トラッシュ・VOLノイズの配列データを完全クリア
    trashCards = [];
    volNoiseCards = [];
    if (typeof trash !== 'undefined' && Array.isArray(trash)) trash.length = 0;
    if (typeof volNoise !== 'undefined' && Array.isArray(volNoise)) volNoise.length = 0;

    // トラッシュ・VOLノイズのテキストカウントを 0 に設定
    const countIds = ['trashCount', 'trash-count', 'val-trash', 'volNoiseCount', 'vol-noise-count', 'volnoiseCount', 'val-volnoise'];
    countIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerText = '0';
    });

    // ★ 4. UI描画関数の安全呼び出し（トラッシュ・VOLノイズの表示を完全リセット）
    if (typeof updateTrashUI === 'function') updateTrashUI();
    if (typeof updateVolNoiseUI === 'function') updateVolNoiseUI();

    // 5. ターン数のリセット
    turn = 1;
    const turnEl = document.getElementById('turnCount');
    if (turnEl) turnEl.innerText = '1';

    // 6. マリガン回数のリセット
    mulliganCount = 0;
    const mulliganEl = document.getElementById('mulliganCount');
    if (mulliganEl) mulliganEl.innerText = '0';

    // 7. ダイス結果のクリア
    const lastDiceEl = document.getElementById('lastDiceResult');
    if (lastDiceEl) lastDiceEl.innerText = '-';
    const diceContainer = document.getElementById('diceDisplayArea');
    if (diceContainer) diceContainer.innerHTML = '';

    // 8. 各種魔力カウンター（VOL, alpha, beta, omega）のリセット
    const counterTypes = ['vol', 'alpha', 'beta', 'omega'];
    counterTypes.forEach(type => {
        const el = document.getElementById('val-' + type);
        if (el) el.innerText = '0';

        if (typeof counters === 'object' && counters !== null && counters[type] !== undefined) {
            counters[type] = 0;
        }
    });

    // 9. ターンエンドボタンのリセット
    isTurnEnded = false;
    const turnBtn = document.getElementById('turnBtn');
    if (turnBtn) {
        turnBtn.innerText = 'ターンエンド';
        turnBtn.style.backgroundColor = '#ffa500';
    }

    // ★ 10. デッキコードの取得と山札の生成（改行・スラッシュの両区切りに対応）
    let inputEl = document.getElementById('deckInput1');
    if (!inputEl || !inputEl.value.trim()) {
        return alert('デッキコードを入力してください！');
    }

    let t = inputEl.value;
    // 改行 または スラッシュ(/) で分割
    let e = t.split(/[\r\n/]+/).map(str => str.trim()).filter(str => str.length > 0);

    let a = [];
    e.forEach(codeStr => {
        let p = codeStr.split('-');
        if (p.length >= 2) {
            let prefix = p[0].toUpperCase();
            let r = prefix.charAt(prefix.length - 1);
            a.push({ name: codeStr, suffix: r, imagePath: `images/${codeStr}.png` });
        }
    });

    if (a.length === 0) {
        return alert('有効なカードコードが認識できませんでした。');
    }
    
    // シャッフル処理
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }

    virtualDeck = a;

    // ★ 11. 手札の消去と初期ドロー
    let handArea = document.getElementById('handArea');
    if (handArea) handArea.innerHTML = "";

    const drawCount = Math.min(7, virtualDeck.length);
    for (let i = 0; i < drawCount; i++) {
        let drawnCard = virtualDeck.shift();
        if (drawnCard) {
            createGameCardToHand(drawnCard.name, drawnCard.imagePath);
        }
    }

    // ★ 12. 山札（デッキ）エリアの画像と枚数カウントのUI更新
    const deckContainer = document.getElementById('deck') || document.querySelector('.deck-zone');
    if (deckContainer) {
        deckContainer.innerHTML = '';
        deckContainer.style.position = 'relative';

        // 1. 裏面カード画像を配置（最初から表示）
        const backImg = document.createElement('img');
        backImg.src = 'images/back.png';
        backImg.style.width = '100%';
        backImg.style.height = '100%';
        backImg.style.objectFit = 'cover';
        backImg.style.borderRadius = '6px';
        backImg.style.display = 'block';
        backImg.style.pointerEvents = 'none'; // 画像単体の標準ドラッグを無効化（画面ズレ防止）
        backImg.onerror = function() { this.style.display = 'none'; }; // 画像パスエラー時の非表示処理
        deckContainer.appendChild(backImg);

        // 2. 枚数テキスト要素を配置
        const countSpan = document.createElement('span');
        countSpan.id = 'deckCount';
        countSpan.innerText = virtualDeck.length;
        countSpan.style.position = 'absolute';
        countSpan.style.top = '50%';
        countSpan.style.left = '50%';
        countSpan.style.transform = 'translate(-50%, -50%)';
        countSpan.style.zIndex = '2';
        countSpan.style.fontWeight = 'bold';
        countSpan.style.color = '#fff';
        countSpan.style.pointerEvents = 'none';
        deckContainer.appendChild(countSpan);

        // 3. 元の山札ドラッグ関数（dragStartDeck / dragEndDeck）を安全に実行
        deckContainer.setAttribute('draggable', 'true');
        deckContainer.ondragstart = function(e) {
            if (typeof dragStartDeck === 'function') {
                dragStartDeck(e);
            } else {
                if (!virtualDeck || virtualDeck.length === 0) {
                    e.preventDefault();
                    return;
                }
                e.dataTransfer.setData('text/plain', 'deck-zone-drag');
                e.dataTransfer.effectAllowed = 'move';
            }
        };

        deckContainer.ondragend = function(e) {
            if (typeof dragEndDeck === 'function') {
                dragEndDeck(e);
            }
        };
    }

    // ★ 画面切り替え（ゲーム開始）- startGame 関数の内部に配置
    const menuScr = document.getElementById('menuScreen');
    if (menuScr) menuScr.style.display = 'none';

    const gameScr = document.getElementById('gameScreen');
    if (gameScr) gameScr.style.display = 'flex';
} // ← startGame 関数の閉じ波括弧はここに配置します
    
            // 自動消滅トースト表示関数
function showToast(text) {
    let toast = document.getElementById('toastMessage');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toastMessage';
        toast.className = 'toast-message';
        document.body.appendChild(toast);
    }
    toast.innerText = text;
    toast.classList.add('show');

    // 1秒後に自動消去
    setTimeout(() => {
        toast.classList.remove('show');
    }, 1000);
}
            
            function dragStartDeck(ev) {
    if (!virtualDeck || virtualDeck.length === 0) {
        ev.preventDefault();
        return;
    }
    // ドロップ先で判定するための識別子をセット
    ev.dataTransfer.setData('text/plain', 'deck-zone-drag');
    ev.dataTransfer.effectAllowed = 'move';
}

function setupTrashAreaEvents() {
            let el = document.getElementById('trashZone');
            el.setAttribute('draggable', 'true');
            
            el.onclick = function(ev) {
                if (!isTrashDragging) { openSearchModal('trash'); }
            };

            el.ondragstart = function(ev) {
                if (trashCards.length === 0) { ev.preventDefault(); return; }
                ev.dataTransfer.setData('text/plain', 'trash-zone-drag');
                if (isSearchOpen) document.getElementById('searchOverlay').classList.add('dragging-mode');
            };

            el.ondragend = function(ev) {
                document.getElementById('searchOverlay').classList.remove('dragging-mode');
            };

            el.addEventListener('touchstart', function(ev) {
                if (trashCards.length === 0) return;
                isTrashDragging = true;
                let touch = ev.touches[0];
                trashDragStartX = touch.clientX;
                trashDragStartY = touch.clientY;
            }, { passive: true });

            el.addEventListener('touchend', function(ev) {
                if (!isTrashDragging) return;
                isTrashDragging = false;
                let touch = ev.changedTouches[0];

        function createGameCardToHand(t, e) {

    n.innerText = t;

        if (parentZone) {
            let pClass = parentZone.className || '';
            let pId = parentZone.id || '';
            let layerVal = parentZone.dataset.layer || parentZone.getAttribute('data-layer');

            // 黄色ゾーン（layer-2）の場合は90°回転
            if (layerVal === "2" || pClass.includes('layer-2')) {
                ev.stopPropagation();
                n.classList.toggle('card-rotate-horizontal');
                return;
            }

            // ディレクションエリア（class="direction-placeholder" または id="dir-slot-X"）の場合は薄暗く切替

            ev.preventDefault();
            returnCardFromHand(n);
        }

    n.addEventListener('touchstart', touchStartCard, { passive: false });
    n.addEventListener('touchmove', touchMoveCard, { passive: false });

// 戻し先の確定処理
function confirmDeckReturn(position) {
    if (!pendingDeckReturn) return;

    let card = pendingDeckReturn.card;

    // 1. 移動元データ・要素の削除処理
    if (pendingDeckReturn.type === 'trash') {
        trashCards.pop();
        updateTrashUI();
    } else if (pendingDeckReturn.type === 'element') {
        let el = document.getElementById(pendingDeckReturn.elementId);
        if (el) el.remove();
    }

    // 2. 山札への追加処理
    if (position === 'top') {
        virtualDeck.unshift(card); // 先頭（上）に追加
    } else if (position === 'bottom') {
        virtualDeck.push(card);    // 末尾（下）に追加
    } else if (position === 'shuffle') {
        virtualDeck.push(card);
        // Fisher-Yates シャッフル
        for (let i = virtualDeck.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [virtualDeck[i], virtualDeck[j]] = [virtualDeck[j], virtualDeck[i]];
        }
    }

    // 3. UIの更新と閉じる処理
    let deckCountEl = document.getElementById('deckCount');
    if (deckCountEl) deckCountEl.innerText = virtualDeck.length;

    closeDeckReturnModal();
}

        function changeCounter(t, e) {
    // 1. タイプごとの最大値を定義
    const maxLimits = { vol: 10, alpha: 5, beta: 5, omega: 5 };
    const max = maxLimits[t] !== undefined ? maxLimits[t] : 99;

    // 2. DOM（画面の要素）から直接現在の数値を取得して計算
    const el = document.getElementById(`val-${t}`);
    let current = 0;

    if (el) {
        current = parseInt(el.innerText, 10) || 0;
    } else if (typeof counters === 'object' && counters !== null && counters[t] !== undefined) {
        current = counters[t];
    }

    // 3. 0以上、最大値以下に制限
    let newValue = Math.min(max, Math.max(0, current + e));

    // 4. 内部変数と画面の両方を即時更新
    if (typeof counters === 'object' && counters !== null) {
        counters[t] = newValue;
    }
    if (el) {
        el.innerText = newValue;
    }
}

    } else {
        // --- 2. ターンスタート処理 ---
        isTurnEnded = false;

        if (btn) {
            btn.innerText = 'ターンエンド';
            btn.style.backgroundColor = '#ffa500'; // オレンジ色に戻す
        }

        // ① ターン数加算
        turn++;
        const turnCountEl = document.getElementById('turnCount');
        if (turnCountEl) {
            turnCountEl.innerText = turn;
        }

        // ② 山札から1枚ドロー
        if (virtualDeck.length > 0) {
            const drawnCard = virtualDeck.shift();
            createGameCardToHand(drawnCard.name, drawnCard.imagePath);

            const deckCountEl = document.getElementById('deckCount');
            if (deckCountEl) {
                deckCountEl.innerText = virtualDeck.length;
            }
        }
    }
}

            // サイコロの目のSVGデータ定義
const diceSvgDots = {
    1: '<circle cx="25" cy="25" r="9" fill="#ff0000"/>',
    2: '<circle cx="15" cy="15" r="5" fill="#000"/><circle cx="35" cy="35" r="5" fill="#000"/>',
    3: '<circle cx="12" cy="12" r="5" fill="#000"/><circle cx="25" cy="25" r="5" fill="#000"/><circle cx="38" cy="38" r="5" fill="#000"/>',
    4: '<circle cx="15" cy="15" r="5" fill="#000"/><circle cx="35" cy="15" r="5" fill="#000"/><circle cx="15" cy="35" r="5" fill="#000"/><circle cx="35" cy="35" r="5" fill="#000"/>',
    5: '<circle cx="13" cy="13" r="5" fill="#000"/><circle cx="37" cy="13" r="5" fill="#000"/><circle cx="25" cy="25" r="5" fill="#000"/><circle cx="13" cy="37" r="5" fill="#000"/><circle cx="37" cy="37" r="5" fill="#000"/>',
    6: '<circle cx="15" cy="12" r="5" fill="#000"/><circle cx="35" cy="12" r="5" fill="#000"/><circle cx="15" cy="25" r="5" fill="#000"/><circle cx="35" cy="25" r="5" fill="#000"/><circle cx="15" cy="38" r="5" fill="#000"/><circle cx="35" cy="38" r="5" fill="#000"/>'
};

function rollDice() {
    const rollResult = Math.floor(Math.random() * 6) + 1;

    // ★ 1. 右側カウンターの表示を更新
    const lastDiceEl = document.getElementById('lastDiceResult');
    if (lastDiceEl) {
        lastDiceEl.innerText = rollResult;
    }

    // ★ 2. 画面中央へのダイス表示ポップアップ処理
    let container = document.getElementById('diceDisplayArea');
    if (!container) {
        container = document.createElement('div');
        container.id = 'diceDisplayArea';
        container.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 15px; z-index: 10000; pointer-events: none;';
        document.body.appendChild(container);
    }

    while (container.children.length >= 5) {
        container.removeChild(container.firstChild);
    }

    const diceEl = document.createElement('div');
    diceEl.style.cssText = `
        width: 100px;
        height: 100px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        border: 3px solid #ccc;
        opacity: 1;
    `;

    diceEl.innerHTML = `<svg width="85" height="85" viewBox="0 0 50 50">${diceSvgDots[rollResult]}</svg>`;
    container.appendChild(diceEl);

    setTimeout(() => {
        if (diceEl.parentElement) {
            diceEl.parentElement.removeChild(diceEl);
        }
    }, 2000);
}
        function triggerAction(t) {
        alert(`${t} が実行されました`);
    }

    // --- 山札ドラッグ終了時のエラー回避処理 ---
    function dragEndDeck(ev) {
        let overlay = document.getElementById('searchOverlay');
        if (overlay) {
            overlay.classList.remove('dragging-mode');
        }
    } // ★ 2436行目にあった余分な「}」を削除しました

    // --- ドラッグアンドドロップ設定 ---
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.layer-2').forEach(zone => {
        zone.ondragover = function(ev) { ev.preventDefault(); };
        zone.ondragenter = function(ev) {
            ev.preventDefault();
            let targetZone = ev.target.closest('.layer-2') || ev.currentTarget;
            if (targetZone) targetZone.classList.add('drag-over');
        };
        zone.ondragleave = function(ev) {
            let targetZone = ev.target.closest('.layer-2') || ev.currentTarget;
            if (targetZone) targetZone.classList.remove('drag-over');
        };
        zone.ondrop = function(ev) {
            if (typeof dropToDirection === 'function') {
                dropToDirection(ev);
            }
        };
    });
});

// --- 関数のグローバル公開 (onclick対応) ---
if (typeof selectMode === 'function') window.selectMode = selectMode;
if (typeof startGame === 'function') window.startGame = startGame;
if (typeof handleTurnBtnClick === 'function') window.handleTurnBtnClick = handleTurnBtnClick;

if (typeof mulliganBtn === 'function') {
    window.mulliganBtn = mulliganBtn;
} else if (typeof mulligan === 'function') {
    window.mulligan = mulligan;
}
